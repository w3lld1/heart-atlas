questions:
  - level: patient
    prompt: Какова общая задача клапанов сердца?
    options:
      - text: Вырабатывать электрические импульсы
      - text: Следить, чтобы кровь шла через сердце только в одну сторону
        correct: true
      - text: Снабжать кровью сердечную мышцу
    explanation: В сердце четыре клапана, и их общая задача — чтобы кровь шла через сердце только в одну сторону.
    cite: [1]
  - level: patient
    prompt: Какой клапан находится между левым предсердием и левым желудочком?
    options:
      - text: Трёхстворчатый
      - text: Аортальный
      - text: Митральный
        correct: true
    explanation: Митральный клапан находится между левым предсердием и левым желудочком. Трёхстворчатый стоит справа, аортальный — между левым желудочком и аортой.
    cite: [1, 2, 3, 4]
  - level: patient
    prompt: Когда возникает первый тон сердца?
    options:
      - text: Когда закрываются трёхстворчатый и митральный клапаны
        correct: true
      - text: Когда закрываются клапаны аорты и лёгочной артерии
      - text: Когда открывается аортальный клапан
    explanation: Первый тон возникает, когда при сокращении желудочков закрываются трёхстворчатый и митральный клапаны. Второй — когда закрываются клапаны аорты и лёгочной артерии.
    cite: [1, 4]
  - level: student
    prompt: Какие клапаны относят к полулунным?
    options:
      - text: Митральный и трикуспидальный
      - text: Аортальный и клапан лёгочной артерии
        correct: true
      - text: Митральный и аортальный
    explanation: Клапаны делят на атриовентрикулярные (митральный и трикуспидальный) и полулунные (аортальный и клапан лёгочной артерии).
    cite: [4]
  - level: student
    prompt: Что верно для фазы изоволюмического сокращения?
    options:
      - text: Все клапаны открыты, кровь свободно выходит в аорту
      - text: Открыты только атриовентрикулярные клапаны
      - text: Все клапаны закрыты, давление растёт, объём крови в желудочках не меняется
        correct: true
    explanation: Между закрытием атриовентрикулярных клапанов и открытием полулунных все клапаны закрыты, давление в желудочках растёт, а объём крови в них не меняется.
    cite: [1]
