questions:
  - level: patient
    prompt: Что называют систолой?
    options:
      - text: Период расслабления, когда камеры наполняются кровью
      - text: Период сокращения
        correct: true
    explanation: Период сокращения называют систолой, а период расслабления, когда камеры наполняются кровью, — диастолой.
    cite: [2]
  - level: patient
    prompt: Что даёт второй тон сердца?
    options:
      - text: Закрытие аортального клапана и клапана лёгочной артерии
        correct: true
      - text: Закрытие митрального и трёхстворчатого клапанов
      - text: Сокращение предсердий
    explanation: Когда давление в желудочках падает, кровь закрывает аортальный клапан и клапан лёгочной артерии, и их закрытие даёт второй тон. Первый тон дают митральный и трёхстворчатый клапаны.
    cite: [1, 2]
  - level: patient
    prompt: Что происходит в промежутке между первым и вторым тоном?
    options:
      - text: Диастола
      - text: Пауза, когда сердце не работает
      - text: Систола
        correct: true
    explanation: Промежуток между первым и вторым тоном — это систола, а от второго тона до следующего первого — диастола.
    cite: [1]
  - level: student
    prompt: Что длится дольше — систола или диастола?
    options:
      - text: Диастола
        correct: true
      - text: Систола
      - text: Они всегда равны по длительности
    explanation: Диастола длится дольше систолы.
    cite: [2]
  - level: student
    prompt: Какой обычно ударный объём левого желудочка у взрослого в покое?
    options:
      - text: Около 130 мл
      - text: 50–60 мл
      - text: 70–80 мл
        correct: true
    explanation: К концу диастолы в левом желудочке около 130 мл крови, за сокращение выбрасывается обычно 70–80 мл (ударный объём), остаётся 50–60 мл.
    cite: [2]
