questions:
  - level: patient
    prompt: Откуда отходят коронарные артерии?
    options:
      - text: От лёгочного ствола
      - text: От основания аорты
        correct: true
      - text: От правого предсердия
    explanation: Коронарных артерий две, левая и правая, и они отходят от основания аорты.
    cite: [1]
  - level: patient
    prompt: Куда в основном собирается кровь из вен сердца?
    options:
      - text: В коронарный синус, который открывается в правое предсердие
        correct: true
      - text: В левое предсердие
      - text: Обратно в аорту
    explanation: Вены собирают кровь в коронарный синус — крупную вену на задней поверхности сердца, которая открывается в правое предсердие.
    cite: [2, 3]
  - level: patient
    prompt: Когда кровь по коронарным артериям течёт сильнее всего?
    options:
      - text: Во время сокращения сердечной мышцы
      - text: Одинаково всё время
      - text: Когда сердечная мышца расслаблена
        correct: true
    explanation: Кровь по коронарным артериям сильнее всего течёт, когда сердечная мышца расслаблена, а во время её сокращения поток почти останавливается.
    cite: [1, 3]
  - level: student
    prompt: Какой тип коронарного кровоснабжения встречается чаще всего?
    options:
      - text: Левый
      - text: Сбалансированный
      - text: Правый
        correct: true
    explanation: Тип определяется тем, откуда отходит задняя межжелудочковая артерия. Правый тип встречается как минимум в 70% случаев, левый — около 10%, сбалансированный — в 20%.
    cite: [1]
  - level: student
    prompt: Что снабжают септальные ветви передней межжелудочковой артерии (LAD)?
    options:
      - text: Передние две трети межжелудочковой перегородки и пучок Гиса
        correct: true
      - text: Заднебоковую стенку левого желудочка
      - text: Синусовый узел
    explanation: Септальные ветви LAD снабжают передние две трети межжелудочковой перегородки и пучок Гиса. Заднебоковую стенку левого желудочка снабжает огибающая артерия.
    cite: [1]
