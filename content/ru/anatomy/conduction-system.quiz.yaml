questions:
  - level: patient
    prompt: Где рождается электрический сигнал, который запускает сокращение сердца?
    options:
      - text: В головном мозге
      - text: В волокнах Пуркинье
      - text: В синусовом узле в правом предсердии
        correct: true
    explanation: Сигнал рождается в самом сердце — в синусовом узле в правом предсердии — и дальше идёт через АВ-узел, пучок Гиса, его ножки и волокна Пуркинье.
    cite: [1, 3]
  - level: patient
    prompt: Зачем импульс ненадолго задерживается в АВ-узле?
    options:
      - text: Чтобы предсердия успели закончить сокращение и наполнить желудочки
        correct: true
      - text: Чтобы предсердия и желудочки сокращались одновременно
    explanation: За время паузы предсердия успевают закончить сокращение и наполнить желудочки. Без паузы предсердия и желудочки сокращались бы одновременно.
    cite: [1, 2, 3]
  - level: patient
    prompt: Что может делать АВ-узел, если синусовый узел перестаёт работать?
    options:
      - text: Задаёт ритм чаще, чем синусовый узел
      - text: Задаёт ритм реже, примерно 40–60 ударов в минуту
        correct: true
      - text: Перестаёт проводить любые импульсы
    explanation: Если синусовый узел перестаёт работать, ритм может задавать АВ-узел, но реже — примерно 40–60 ударов в минуту.
    cite: [1, 2, 3]
  - level: patient
    prompt: Что отражает комплекс QRS на ЭКГ?
    options:
      - text: Возбуждение предсердий
      - text: Восстановление желудочков
      - text: Возбуждение желудочков
        correct: true
    explanation: Зубец P — возбуждение предсердий, комплекс QRS — возбуждение желудочков, зубец T — их восстановление (реполяризация).
    cite: [3]
  - level: student
    prompt: Почему синусно-предсердный узел становится водителем ритма?
    options:
      - text: У его клеток самая высокая собственная частота деполяризации в сердце
        correct: true
      - text: У его клеток самая низкая собственная частота деполяризации
      - text: Он лежит в стенке левого желудочка
    explanation: СА-узел расположен в верхней и задней стенке правого предсердия, и у его клеток собственная частота деполяризации самая высокая в сердце.
    cite: [3]
  - level: student
    prompt: Какая ножка пучка Гиса крупнее?
    options:
      - text: Правая
      - text: Левая
        correct: true
      - text: Обе одинаковые
    explanation: Пучок Гиса делится на две ножки; левая заметно крупнее правой и имеет два разветвления (фасцикулы).
    cite: [3]
