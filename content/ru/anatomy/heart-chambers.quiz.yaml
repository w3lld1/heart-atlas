questions:
  - level: patient
    prompt: Какая камера сердца принимает кровь из верхней и нижней полых вен?
    options:
      - text: Левое предсердие
      - text: Правое предсердие
        correct: true
      - text: Левый желудочек
    explanation: Правое предсердие принимает бедную кислородом кровь со всего тела, кроме лёгких, — она приходит по верхней и нижней полым венам.
    cite: [1, 2]
  - level: patient
    prompt: У какого желудочка стенка толще?
    options:
      - text: У правого
      - text: Стенки одинаковой толщины
      - text: У левого
        correct: true
    explanation: Стенка левого желудочка намного толще, чем у правого. Он гонит кровь по длинному большому кругу и должен создавать высокое давление.
    cite: [3]
  - level: patient
    prompt: Какую часть наполнения желудочков дают сокращения предсердий?
    options:
      - text: Примерно 20–30%
        correct: true
      - text: Почти 100%
      - text: Примерно 70–80%
    explanation: Сокращение предсердий даёт примерно 20–30% наполнения желудочков, остальные 70–80% поступают пассивно.
    cite: [3, 4]
  - level: student
    prompt: Сколько папиллярных мышц в правом желудочке?
    options:
      - text: Одна
      - text: Три
        correct: true
      - text: Пять
    explanation: В правом желудочке три папиллярные мышцы, в левом — две.
    cite: [3]
  - level: student
    prompt: В какой камере есть модераторный тяж?
    options:
      - text: В левом желудочке
      - text: В обоих желудочках
      - text: В правом желудочке
        correct: true
    explanation: В правом желудочке есть модераторный тяж — мышечная перекладина, покрытая эндокардом; в левом желудочке его нет.
    cite: [3]
  - level: student
    prompt: С каким элементом ЭКГ связана систола желудочков?
    options:
      - text: Комплексу QRS
        correct: true
      - text: Зубцу T
    explanation: Систола желудочков следует за их деполяризацией и соответствует комплексу QRS, а диастола — зубцу T.
    cite: [4]
