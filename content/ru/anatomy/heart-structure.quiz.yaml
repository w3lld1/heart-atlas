questions:
  - level: patient
    prompt: Из скольких слоёв состоит стенка сердца?
    options:
      - text: Из одного мышечного слоя
      - text: Из трёх — эпикарда, миокарда и эндокарда
        correct: true
      - text: Из двух — перикарда и эндокарда
    explanation: Стенка сердца состоит из трёх слоёв — снаружи эпикард, в середине миокард, изнутри эндокард.
    cite: [1, 3]
  - level: patient
    prompt: Что такое перикард?
    options:
      - text: Перегородка между предсердиями
      - text: Клапан между правым предсердием и правым желудочком
      - text: Двухслойный мешок, в котором заключено сердце
        correct: true
    explanation: Сердце заключено в двухслойный мешок — перикард. Предсердия разделяет межпредсердная перегородка.
    cite: [1, 3]
  - level: patient
    prompt: Куда возвращается кровь из лёгких по лёгочным венам?
    options:
      - text: В левое предсердие
        correct: true
      - text: В правое предсердие
      - text: В правый желудочек
    explanation: По лёгочным венам кровь возвращается в левое предсердие. В правое предсердие кровь приходит из полых вен.
    cite: [1, 2, 3]
  - level: student
    prompt: Сколько жидкости обычно находится в перикардиальной полости?
    options:
      - text: Около 2 литров
      - text: 20–25 мл
        correct: true
      - text: Жидкости там нет
    explanation: В перикардиальной полости между листками серозного перикарда обычно 20–25 мл жидкости.
    cite: [1]
  - level: student
    prompt: Что такое овальная ямка?
    options:
      - text: Отверстие в межжелудочковой перегородке
      - text: Углубление на верхушке сердца
      - text: Углубление на межпредсердной перегородке, след овального отверстия плода
        correct: true
    explanation: На межпредсердной перегородке есть овальная ямка — след отверстия, которое было в сердце плода (овального отверстия).
    cite: [3]
