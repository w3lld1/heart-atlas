questions:
  - level: patient
    prompt: Когда сердце выделяет BNP и NT-proBNP?
    options:
      - text: Когда его стенки растягиваются
        correct: true
      - text: Когда в его камерах мало крови и низкое давление
    explanation: BNP и NT-proBNP — вещества, которые выделяет сердце, когда его стенки растягиваются. Их уровень отражает нагрузку на сердце — высокое давление и большой объём крови в его камерах.
    cite: [2, 3]
  - level: patient
    prompt: Как проходит анализ на BNP и NT-proBNP?
    options:
      - text: Электроды наклеивают на грудь на сутки
      - text: Датчик УЗИ прикладывают к груди
      - text: Берут кровь из вены, как при обычном заборе крови
        correct: true
    explanation: Это анализ крови из вены, как обычный забор крови.
    cite: [3]
  - level: patient
    prompt: Ставит ли анализ на натрийуретические пептиды диагноз сам по себе?
    options:
      - text: Да, по одному анализу ставят окончательный диагноз
      - text: Нет, врач всегда оценивает его вместе с другими данными
        correct: true
    explanation: Сам по себе анализ диагноз не ставит, врач всегда оценивает его вместе с другими данными.
    cite: [2]
  - level: patient
    prompt: Можно ли пересчитать значение BNP в значение NT-proBNP?
    options:
      - text: Нет, это разные показатели с разными нормами и порогами
        correct: true
      - text: Да, это один и тот же показатель под двумя названиями
    explanation: BNP и NT-proBNP — разные показатели, их значения нельзя пересчитать один в другой, у них разные нормы и пороги.
    cite: [2]
  - level: student
    prompt: Какой из двух пептидов стабильнее?
    options:
      - text: BNP
      - text: NT-proBNP
        correct: true
    explanation: Период полувыведения BNP около 20 минут, NT-proBNP — около 120 минут; NT-proBNP значительно стабильнее.
    cite: [3]
  - level: student
    prompt: Для какого пептида NICE NG106 приводит пороги срочности направления?
    options:
      - text: Для BNP
      - text: Для NT-proBNP
        correct: true
    explanation: Пороги NG106 относятся к NT-proBNP; для BNP рекомендация пороги не приводит.
    cite: [1]
