questions:
  - level: patient
    prompt: Зачем нужна длительная запись ЭКГ, если есть обычная ЭКГ?
    options:
      - text: Обычная ЭКГ — лишь моментальный снимок, она может пропустить нарушения
        correct: true
      - text: Обычная ЭКГ не записывает электрическую активность сердца
    explanation: Обычная ЭКГ даёт лишь моментальный снимок работы сердца и может пропустить нарушения, которые появляются время от времени.
    cite: [4]
  - level: patient
    prompt: Сколько обычно идёт запись холтеровского монитора?
    options:
      - text: Около 10 секунд
      - text: Обычно от 24 до 72 часов
        correct: true
      - text: До 3 лет
    explanation: Холтер записывает ЭКГ непрерывно, обычно от 24 до 72 часов. До 3 лет может записывать данные имплантируемый петлевой регистратор.
    cite: [4]
  - level: patient
    prompt: Что главное ищет врач в записи мониторирования?
    options:
      - text: Размеры камер сердца на УЗИ
      - text: Уровень пептидов в крови
      - text: Совпадение симптомов с нарушением ритма на записи
        correct: true
    explanation: Главное, что ищет врач, — совпадение, были ли симптомы в тот момент, когда на записи есть нарушение ритма.
    cite: [2]
  - level: patient
    prompt: Почему холтер может не показать причину приступов?
    options:
      - text: Он не записывает электрическую активность сердца
      - text: Он пишет только сутки-трое, и приступа за это время могло не быть
        correct: true
    explanation: Холтер пишет только сутки-трое, и если за это время приступа не было, причину он не покажет. Если приступы редкие, за время мониторирования они могли просто не случиться.
    cite: [4]
  - level: student
    prompt: Что ESC называет золотым стандартом диагноза аритмогенного обморока?
    options:
      - text: Корреляцию симптомов с зарегистрированной аритмией
        correct: true
      - text: Нормальную ЭКГ в 12 отведениях
    explanation: Золотым стандартом диагноза аритмогенного обморока ESC называет корреляцию симптомов с зарегистрированной аритмией.
    cite: [2]
  - level: student
    prompt: Что ESC называет главным ограничением любого прибора для мониторирования ЭКГ?
    options:
      - text: Он не может записывать ЭКГ вне клиники, в обычной жизни
      - text: Он не может одновременно записывать артериальное давление
        correct: true
    explanation: ESC называет главным ограничением любого прибора для мониторирования ЭКГ то, что он не может одновременно записывать артериальное давление.
    cite: [2]
