questions:
  - level: patient
    prompt: Что записывает электрокардиограмма (ЭКГ)?
    options:
      - text: Ультразвуковое изображение клапанов сердца
      - text: Электрическую активность сердца с поверхности тела
        correct: true
      - text: Уровень веществ в крови
    explanation: ЭКГ — запись электрической активности сердца, которую снимают с поверхности тела, без проникновения внутрь.
    cite: [1]
  - level: patient
    prompt: Что на ЭКГ отражает зубец P?
    options:
      - text: Восстановление желудочков
      - text: Возбуждение желудочков
      - text: Возбуждение предсердий
        correct: true
    explanation: Зубец P — возбуждение предсердий, комплекс QRS — возбуждение желудочков, зубец T — восстановление желудочков.
    cite: [1]
  - level: patient
    prompt: Исключает ли нормальная ЭКГ в покое болезнь сердца?
    options:
      - text: Нет, например после приступа стенокардии ЭКГ часто бывает нормальной
        correct: true
      - text: Да, нормальная ЭКГ в покое полностью исключает болезнь сердца
    explanation: Нормальная ЭКГ в покое не исключает болезнь сердца — например, после приступа стенокардии ЭКГ часто бывает нормальной.
    cite: [3]
  - level: patient
    prompt: Как поступают с автоматическим заключением, которое печатает аппарат ЭКГ?
    options:
      - text: Его считают окончательным, врач его не смотрит
      - text: Любое компьютерное заключение должен проверить врач
        correct: true
    explanation: Многие аппараты печатают автоматическое заключение, но любое компьютерное заключение должен проверить врач.
    cite: [2]
  - level: student
    prompt: Чему соответствует сегмент ST?
    options:
      - text: Деполяризации предсердий (зубец P)
      - text: Концу деполяризации и началу реполяризации желудочков
        correct: true
    explanation: Сегмент ST соответствует концу деполяризации и началу реполяризации желудочков; в норме он изоэлектричен и лежит на уровне сегмента PR.
    cite: [1]
  - level: student
    prompt: Что видно на ЭКГ при фибрилляции предсердий?
    options:
      - text: Нет различимых регулярных зубцов P
        correct: true
      - text: Перед каждым комплексом QRS стоит регулярный зубец P
    explanation: При ФП нет различимых регулярных зубцов P, а интервалы RR не подчиняются никакой закономерности, если нет АВ-блокады.
    cite: [4]
