questions:
  - level: patient
    prompt: С помощью чего эхокардиография показывает строение и работу сердца?
    options:
      - text: С помощью рентгеновских лучей
      - text: С помощью ультразвука
        correct: true
      - text: С помощью анализа крови
    explanation: Эхокардиография (ЭхоКГ, УЗИ сердца) — неинвазивное исследование, которое с помощью ультразвука показывает строение сердца и то, как оно работает.
    cite: [4]
  - level: patient
    prompt: Что показывает цветной допплеровский режим?
    options:
      - text: Ток крови — его направление, скорость и завихрения
        correct: true
      - text: Зубцы P, QRS и T
      - text: Уровень NT-proBNP в крови
    explanation: Цветной допплеровский режим показывает ток крови — его направление, скорость и есть ли завихрения.
    cite: [5]
  - level: patient
    prompt: Чем чреспищеводная ЭхоКГ отличается от обычной?
    options:
      - text: Датчик только прикладывают к груди слева от грудины
      - text: Это анализ крови из вены
      - text: Датчик вводят через рот в пищевод, поэтому это инвазивное исследование
        correct: true
    explanation: При чреспищеводной ЭхоКГ датчик вводят через рот в пищевод, поэтому это инвазивное исследование. Его делают, когда обычное УЗИ не даёт ответа.
    cite: [4]
  - level: patient
    prompt: Как получают изображения при стресс-эхокардиографии?
    options:
      - text: Во время сна, ночью
      - text: Во время нагрузки или после лекарства, которое заменяет нагрузку
        correct: true
    explanation: При стресс-ЭхоКГ изображения получают во время нагрузки на беговой дорожке или велотренажёре либо после введения лекарства, которое заменяет физическую нагрузку.
    cite: [3, 4]
  - level: student
    prompt: Какая позиция, по StatPearls, лучше показывает ДМПП, перикардиальный выпот и тампонаду?
    options:
      - text: Супрастернальная
      - text: Субкостальная
        correct: true
    explanation: Субкостальная позиция лучше показывает ДМПП, перикардиальный выпот и тампонаду, а супрастернальная — болезни аорты, например расслоение и коарктацию.
    cite: [4]
  - level: student
    prompt: Как ASE рекомендует рассчитывать объёмы и фракцию выброса левого желудочка?
    options:
      - text: По линейным размерам
      - text: По двухмерным изображениям биплановым методом дисков
        correct: true
    explanation: ASE рекомендует считать объёмы ЛЖ и фракцию выброса по двухмерным изображениям биплановым методом суммации дисков; расчёт по линейным размерам не рекомендуется.
    cite: [5]
