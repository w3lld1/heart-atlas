questions:
  - level: patient
    prompt: Что обычно провоцирует приступ КПЖТ?
    options:
      - text: Физическая нагрузка или сильное волнение
        correct: true
      - text: Глубокий ночной сон в положении лёжа на спине
      - text: Обильная еда поздно вечером перед сном
    explanation: 'Обычно приступ провоцирует физическая нагрузка или сильное волнение: гормоны стресса усиливают выход кальция в клетках сердца, и в желудочках появляются лишние импульсы.'
    cite: [2]
  - level: patient
    prompt: Какой обычно бывает ЭКГ в покое у людей с КПЖТ?
    options:
      - text: Всегда резко изменённой
      - text: С постоянной тахикардией
      - text: Обычно нормальной
        correct: true
    explanation: 'Между приступами сердце выглядит здоровым: ЭКГ в покое обычно нормальная, признаков структурной болезни сердца нет, поэтому обследование в покое может ничего не найти.'
    cite: [1, 2]
  - level: patient
    prompt: Какое исследование при КПЖТ главное?
    options:
      - text: Анализ крови на уровень холестерина
      - text: Нагрузочная проба с записью ЭКГ
        correct: true
      - text: ЭКГ в покое в положении лёжа на спине
    explanation: 'Главное исследование — нагрузочная проба: ЭКГ записывают во время физической нагрузки. Диагноз подтверждается, если нагрузка вызывает полиморфную, особенно двунаправленную, желудочковую тахикардию и она повторяет жалобы человека.'
    cite: [1, 2]
  - level: patient
    prompt: Что вызывает КПЖТ?
    options:
      - text: Перенесённая вирусная инфекция с высокой температурой
      - text: Сужение коронарных артерий бляшками
      - text: Мутации в генах белков, управляющих кальцием
        correct: true
    explanation: КПЖТ вызывают изменения (мутации) в генах белков, которые управляют кальцием внутри клеток сердца.
    cite: [2]
  - level: student
    prompt: Какая аритмия наиболее характерна для КПЖТ?
    options:
      - text: Двунаправленная ЖТ
        correct: true
      - text: Мономорфная ЖТ
      - text: Трепетание предсердий
    explanation: 'Самая характерная аритмия — двунаправленная ЖТ: фронтальная ось комплекса QRS меняется от сокращения к сокращению. При КПЖТ возможны также любая полиморфная ЖТ и фибрилляция желудочков.'
    cite: [1, 2]
  - level: student
    prompt: Рекомендуется ли при КПЖТ внутрисердечное ЭФИ для стратификации риска внезапной смерти?
    options:
      - text: Да, всем пациентам с КПЖТ
      - text: Нет, оно не рекомендуется
        correct: true
      - text: Да, только при отсутствии симптомов
    explanation: Внутрисердечное электрофизиологическое исследование для стратификации риска внезапной сердечной смерти при КПЖТ не рекомендуется.
    cite: [1]
