questions:
  - level: patient
    prompt: Что такое дефект аортолёгочной перегородки?
    options:
      - text: Отверстие в перегородке между правым и левым желудочками
      - text: Отверстие между аортой и лёгочным стволом
        correct: true
      - text: Сужение аортального клапана, из-за которого кровь плохо выходит из сердца
    explanation: При этом врождённом пороке между соседними участками восходящей аорты и лёгочного ствола есть отверстие — «окно».
    cite: [1]
  - level: patient
    prompt: Почему кровь из аорты уходит через окно в лёгочную артерию?
    options:
      - text: Давление в лёгочной артерии выше, чем в аорте
      - text: Оба сосуда выходят из сердца через один общий для них клапан
      - text: Давление в аорте выше, чем в лёгочной артерии
        correct: true
    explanation: Давление в аорте выше, чем в лёгочной артерии, поэтому при каждом сокращении сердца часть крови из аорты уходит через окно в лёгочную артерию — это сброс «слева направо».
    cite: [1]
  - level: patient
    prompt: Ребёнок с незакрытым окном стал реже болеть и выглядит лучше. Что об этом говорит статья?
    options:
      - text: Это улучшение может быть мнимым
        correct: true
      - text: Значит, окно закрылось само и операция больше не нужна
      - text: Значит, порок перестал нагружать сердце и сосуды лёгких
    explanation: Когда давление в сосудах лёгких растёт, ребёнок может реже болеть и выглядеть лучше, но это улучшение мнимое, и время для операции может быть упущено. Самопроизвольное закрытие окна не описано.
    cite: [1]
  - level: patient
    prompt: При каком из этих признаков у младенца нужно вызвать скорую?
    options:
      - text: Пару раз чихнул от пыли
      - text: Посинели губы или кожа
        correct: true
      - text: Любит засыпать на боку под колыбельную
    explanation: Вызывайте скорую, если у младенца посинели губы или кожа, он дышит часто и с трудом или «кряхтит» при дыхании, задыхается во время еды и не может есть или стал необычно беспокойным.
    cite: [4]
  - level: student
    prompt: Что отличает ДАЛП от общего артериального ствола I–II типа?
    options:
      - text: Один общий полулунный клапан над обоими сосудами
      - text: Обязательный большой дефект межжелудочковой перегородки
      - text: Нет ДМЖП, клапаны аорты и ЛА раздельные
        correct: true
    explanation: Отсутствие дефекта межжелудочковой перегородки и раздельные клапаны аорты и лёгочной артерии отличают ДАЛП от общего артериального ствола I–II типа.
    cite: [1]
  - level: student
    prompt: Как идёт сброс при ДАЛП и какие отделы испытывают объёмную перегрузку?
    options:
      - text: В систолу и диастолу; ЛА, ЛП и ЛЖ
        correct: true
      - text: Только в систолу; правое предсердие и правый желудочек
      - text: Только в диастолу; правое предсердие и полые вены
    explanation: Сброс из аорты в ЛА идёт и в систолу, и в диастолу; ЛА, левое предсердие и левый желудочек испытывают объёмную перегрузку и дилатируются.
    cite: [1]
