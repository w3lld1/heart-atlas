questions:
  - level: patient
    prompt: Какой главный признак наджелудочковой тахикардии?
    options:
      - text: Медленное сердцебиение, которое появляется и проходит постепенно
      - text: Частое ровное сердцебиение, которое внезапно начинается и внезапно проходит
        correct: true
    explanation: Главный признак — приступ частого ровного сердцебиения, который начинается внезапно и так же внезапно заканчивается.
    cite: [1, 3]
  - level: patient
    prompt: Что верно про АВ-узловую тахикардию (АВУРТ)?
    options:
      - text: Она чаще бывает у женщин и обычно не связана с болезнями сердца
        correct: true
      - text: Она чаще бывает у мужчин и почти всегда связана с болезнью сердца
    explanation: АВУРТ чаще бывает у женщин и обычно не связана с болезнями сердца.
    cite: [1]
  - level: patient
    prompt: Что бывает со многими приступами ещё до лечения?
    options:
      - text: Без лечения приступ никогда не прекращается
      - text: Многие приступы прекращаются сами
        correct: true
    explanation: Многие приступы прекращаются сами ещё до лечения.
    cite: [3]
  - level: patient
    prompt: Как проводят катетерную аблацию?
    options:
      - text: Через сосуд проводят катетер и воздействуют на участок, где замыкается круг
        correct: true
      - text: Вскрывают грудную клетку и удаляют часть сердца
    explanation: При катетерной аблации через сосуд к сердцу проводят катетер и прицельно воздействуют на участок, по которому замыкается круг; обычно это излечивает тахикардию.
    cite: [1, 3]
  - level: student
    prompt: Что входит в синдром WPW?
    options:
      - text: Удлинение PR, узкий QRS и отсутствие рецидивов НЖТ
      - text: PR менее 120 мс, QRS более 120 мс, дельта-волна и рецидивы НЖТ
        correct: true
    explanation: Синдром WPW включает укорочение интервала PR менее 120 мс, расширение QRS более 120 мс, дельта-волну в начале зубца R и рецидивы НЖТ.
    cite: [1]
  - level: student
    prompt: На что указывают узкие комплексы QRS (≤120 мс) при тахикардии?
    options:
      - text: Источник аритмии выше или внутри пучка Гиса
        correct: true
      - text: Источник аритмии ниже пучка Гиса, в желудочках
    explanation: Узкие комплексы QRS (≤120 мс) обусловлены быстрой активацией желудочков через систему Гиса — Пуркинье и указывают, что источник аритмии выше или внутри пучка Гиса.
    cite: [1]
