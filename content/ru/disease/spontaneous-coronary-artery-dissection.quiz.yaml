questions:
  - level: patient
    prompt: Что такое спонтанная диссекция коронарной артерии (СДКА)?
    options:
      - text: Сужение артерии сердца атеросклеротической бляшкой
      - text: Внезапное расслоение стенки артерии, питающей сердце
        correct: true
      - text: Закупорка артерии сердца тромбом из разорвавшейся бляшки
    explanation: СДКА — внезапное расслоение стенки артерии, питающей сердце, не связанное с атеросклерозом, травмой или медицинским вмешательством.
    cite: [1, 5]
  - level: patient
    prompt: Почему при СДКА к сердечной мышце поступает меньше крови?
    options:
      - text: Кровь в стенке артерии сдавливает её просвет
        correct: true
      - text: Разорвавшаяся бляшка закрывает артерию тромбом
      - text: Холестериновые отложения забивают просвет артерии
    explanation: В стенке артерии скапливается кровь, она сдавливает просвет, и к сердечной мышце поступает меньше крови.
    cite: [4, 6]
  - level: patient
    prompt: Что верно о повторном расслоении после СДКА?
    options:
      - text: Может повториться, но стент в первый раз от этого защищает
      - text: Может повториться, обычно в той же точке той же артерии
      - text: Может повториться, обычно в другой артерии
        correct: true
    explanation: Расслоение может повториться, обычно в другой, раньше здоровой артерии; стент, поставленный в первый раз, от этого, по-видимому, не защищает.
    cite: [4, 5]
  - level: patient
    prompt: При каком признаке нужно срочно вызвать скорую?
    options:
      - text: Лёгкий насморк и заложенный нос без повышения температуры
      - text: Давящая боль за грудиной, не проходящая в покое
        correct: true
      - text: Сухая кожа на руках после частого мытья посуды руками
    explanation: Вызывайте скорую (103 или 112), если давящая боль или дискомфорт за грудиной не проходят в покое или отдают в шею, нижнюю челюсть, левую руку, под левую лопатку или в верхнюю часть живота.
    cite: [1, 2]
  - level: student
    prompt: Каков ведущий механизм ишемии при СДКА?
    options:
      - text: Разрыв атеросклеротической бляшки с тромбозом
      - text: Внутрипросветный тромб на эрозированной бляшке
      - text: Гематома в стенке артерии или надрыв интимы
        correct: true
    explanation: Ведущий механизм ишемии — обструкция интрамуральной гематомой или нарушение целостности интимы, а не разрыв бляшки и не внутрипросветный тромб.
    cite: [5]
  - level: student
    prompt: Что соответствует 2 ангиографическому типу СДКА по классификации Минздрава?
    options:
      - text: Протяжённое гладкое сужение за счёт гематомы
        correct: true
      - text: Несколько видимых просветов артерии
      - text: Локальный стеноз, похожий на атеросклеротическую бляшку
    explanation: 'Минздрав выделяет три ангиографических типа: 1 — несколько видимых просветов; 2 — протяжённое гладкое сужение за счёт интрамуральной гематомы; 3 — локальный стеноз, похожий на атеросклеротическую бляшку.'
    cite: [1, 2]
