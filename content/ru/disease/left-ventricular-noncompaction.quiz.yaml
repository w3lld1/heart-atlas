questions:
  - level: patient
    prompt: Что такое некомпактный миокард?
    options:
      - text: Сужение аортального клапана на выходе из левого желудочка
      - text: Стенка желудочка из перекладин с глубокими углублениями
        correct: true
      - text: Выпячивание стенки желудочка, оставшееся после инфаркта миокарда
    explanation: 'Некомпактный миокард — особенность строения стенки желудочка: её внутренний слой состоит из множества выраженных мышечных перекладин (трабекул) с глубокими углублениями между ними, а наружный плотный (компактный) слой часто тонкий.'
    cite: [1, 6]
  - level: patient
    prompt: Что верно о симптомах некомпактного миокарда?
    options:
      - text: У многих людей он ничем себя не проявляет
        correct: true
      - text: Он всегда проявляется уже в раннем детстве
      - text: Главный его признак — боли в мелких суставах
    explanation: 'Многие люди с некомпактным миокардом не испытывают никаких симптомов. Если симптомы есть, чаще всего это признаки сердечной недостаточности: одышка при нагрузке, утомляемость, отёки.'
    cite: [1, 6, 7]
  - level: patient
    prompt: Почему при некомпактном миокарде повышен риск тромбоэмболий?
    options:
      - text: Перекладины отрываются от стенки и уходят с кровью
      - text: Желудочек сжимается и перестаёт пропускать кровь
      - text: В глубоких углублениях кровь может застаиваться
        correct: true
    explanation: В глубоких углублениях стенки кровь может застаиваться, а это повышает риск тромбоэмболий, в том числе инсульта.
    cite: [6]
  - level: patient
    prompt: Какими исследованиями видят некомпактный миокард?
    options:
      - text: Только анализом крови на сердечные ферменты
      - text: УЗИ сердца (эхокардиографией) и МРТ сердца
        correct: true
      - text: Только обычной рентгенографией грудной клетки
    explanation: Некомпактный миокард видят при УЗИ сердца (эхокардиографии) и МРТ сердца; МРТ с контрастным веществом, по справочнику MSD, чувствительнее УЗИ.
    cite: [1, 6]
  - level: student
    prompt: Какое соотношение толщины слоёв указывает Минздрав в критериях диагноза?
    options:
      - text: Некомпактный слой к компактному больше 2
        correct: true
      - text: Некомпактный слой к компактному меньше 1
      - text: Слои равной толщины, то есть соотношение ровно 1
    explanation: В формулировке Минздрава диагноз ставится на основании эхографических и/или МРТ-критериев при соотношении толщины некомпактного слоя к компактному больше 2.
    cite: [1]
  - level: student
    prompt: Что, по MSD, предрасполагает к сердечной недостаточности и желудочковым тахиаритмиям?
    options:
      - text: Стаз крови в межтрабекулярных углублениях
      - text: Атеросклеротическое сужение коронарных артерий
      - text: Фиброз из-за нарушенной архитектуры миокарда
        correct: true
    explanation: По MSD, нарушенная архитектура миокарда и изменения микроциркуляторного русла ведут к фиброзу, который предрасполагает к систолической и диастолической сердечной недостаточности и желудочковым тахиаритмиям; стаз крови в глубоких углублениях предрасполагает к тромбоэмболиям.
    cite: [6]
