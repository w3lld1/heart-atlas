questions:
  - level: patient
    prompt: Чем замещается мышца сердца при АКПЖ?
    options:
      - text: Костной тканью
      - text: Фиброзно-жировой тканью
        correct: true
      - text: Хрящевой тканью
    explanation: АКПЖ — наследственное заболевание, при котором мышца сердца замещается фиброзно-жировой тканью.
    cite: [1, 3]
  - level: patient
    prompt: Работу каких структур чаще всего нарушают мутации при АКПЖ?
    options:
      - text: Десмосом — соединений, которые скрепляют клетки сердечной мышцы
        correct: true
      - text: Сердечных клапанов
    explanation: Изменения (мутации) в генах чаще всего нарушают работу десмосом — соединений, которые скрепляют клетки сердечной мышцы.
    cite: [3]
  - level: patient
    prompt: Когда при АКПЖ особенно часто возникают опасные аритмии?
    options:
      - text: Только во время сна
      - text: Во время эмоционального напряжения или физической нагрузки
        correct: true
    explanation: Опасные аритмии особенно часто возникают во время эмоционального напряжения или физической нагрузки.
    cite: [3]
  - level: patient
    prompt: Как ставят диагноз АКПЖ?
    options:
      - text: По одному анализу крови
      - text: По одной рентгенограмме грудной клетки
      - text: По сочетанию признаков, потому что одного решающего анализа нет
        correct: true
    explanation: 'Одного решающего анализа нет: диагноз ставят по сочетанию признаков — изменений на ЭКГ и при исследовании сердца, записанных аритмий, случаев болезни или внезапной смерти в семье и результатов генетического анализа.'
    cite: [3]
  - level: student
    prompt: Какие фенотипы аритмогенной кардиомиопатии выделяют?
    options:
      - text: Только правожелудочковый
      - text: Преимущественно правожелудочковый, бивентрикулярный и преимущественно левожелудочковый
        correct: true
    explanation: Выделяют три фенотипа аритмогенной кардиомиопатии — преимущественно правожелудочковый («классическая» АКПЖ), бивентрикулярный и преимущественно левожелудочковый.
    cite: [1, 3]
  - level: student
    prompt: О чём при АКПЖ обычно говорят ФП и признаки систолической недостаточности желудочков?
    options:
      - text: О далеко зашедшей болезни
        correct: true
      - text: О самой ранней стадии болезни
    explanation: Фибрилляция предсердий и признаки систолической недостаточности правого и/или левого желудочка обычно отражают далеко зашедшую болезнь.
    cite: [3]
