questions:
  - level: patient
    prompt: Что такое дефект межпредсердной перегородки (ДМПП)?
    options:
      - text: Сужение устья аорты
      - text: Утолщение стенки левого желудочка
      - text: Отверстие в перегородке между правым и левым предсердием
        correct: true
    explanation: ДМПП — врождённый порок сердца, при котором в перегородке между правым и левым предсердием есть отверстие, и через него кровь переходит из одного предсердия в другое.
    cite: [1]
  - level: patient
    prompt: При ДМПП кровь идёт через отверстие из левого предсердия в правое. Что получает лишнюю кровь?
    options:
      - text: Правые отделы сердца и лёгкие
        correct: true
      - text: Левый желудочек и аорта
      - text: Головной мозг
    explanation: Через отверстие кровь идёт из левого предсердия в правое, поэтому правые отделы сердца и лёгкие получают лишнюю кровь.
    cite: [1, 3]
  - level: patient
    prompt: Что часто происходит с небольшими дефектами в первый год жизни?
    options:
      - text: Они быстро увеличиваются
      - text: Они закрываются сами
        correct: true
      - text: Их сразу после рождения закрывают операцией
    explanation: Небольшие дефекты часто закрываются сами в первый год жизни.
    cite: [3]
  - level: patient
    prompt: Как закрывают вторичный ДМПП, если позволяют размер и форма дефекта?
    options:
      - text: Лекарствами, которые закрывают отверстие
      - text: Пересадкой сердца
      - text: Через сосуд проводят к сердцу специальное устройство (окклюдер)
        correct: true
    explanation: Лекарства не закрывают дефект. Самый частый тип, вторичный ДМПП, если позволяют размер и форма дефекта, закрывают без разреза грудной клетки — через сосуд к сердцу проводят окклюдер.
    cite: [1]
  - level: student
    prompt: Какой тип ДМПП встречается чаще всего?
    options:
      - text: Первичный ДМПП
      - text: Вторичный ДМПП
        correct: true
      - text: Дефект венозного синуса
    explanation: Российские рекомендации выделяют вторичный ДМПП (80% всех ДМПП), первичный (15%), дефект венозного синуса, дефект коронарного синуса и общее предсердие.
    cite: [1]
  - level: student
    prompt: Что из перечисленного — противопоказание к закрытию ДМПП?
    options:
      - text: Синдром Эйзенменгера
        correct: true
      - text: Объёмная перегрузка правого желудочка
      - text: Парадоксальная эмболия при исключении других причин
    explanation: Десатурация при нагрузке и синдром Эйзенменгера — противопоказания к закрытию. Объёмная перегрузка правого желудочка без признаков лёгочной гипертензии — показание к закрытию; при парадоксальной эмболии, если другие причины исключены, закрытие рекомендуется при условии, что нет лёгочной артериальной гипертензии и поражения левого желудочка.
    cite: [1, 2]
