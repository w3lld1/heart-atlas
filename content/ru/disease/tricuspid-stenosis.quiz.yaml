questions:
  - level: patient
    prompt: Что из-за сужения клапана происходит с кровью при трикуспидальном стенозе?
    options:
      - text: Кровь легче и быстрее переходит в желудочек
      - text: Кровь хуже переходит из предсердия в желудочек
        correct: true
      - text: Кровь совсем перестаёт возвращаться к сердцу по венам
    explanation: Из-за сужения отверстия трёхстворчатого клапана кровь хуже переходит из предсердия в желудочек.
    cite: [3, 4]
  - level: patient
    prompt: После каких инфекций возникает ревматическая лихорадка, по статье?
    options:
      - text: После гриппа или обычной простуды во взрослом возрасте
      - text: После кишечной инфекции или пищевого отравления летом
      - text: После нелеченой стрептококковой ангины или скарлатины
        correct: true
    explanation: Ревматическая лихорадка — болезнь детского возраста, которая возникает после некоторых случаев нелеченой стрептококковой ангины или скарлатины.
    cite: [3, 4]
  - level: patient
    prompt: Что показывает эхокардиография с допплером при трикуспидальном стенозе?
    options:
      - text: Суженное отверстие клапана, увеличенное правое предсердие
        correct: true
      - text: Расширенный левый желудочек и тромб в лёгочной артерии
      - text: Воспаление лёгочной ткани и жидкость в плевральной полости
    explanation: Эхокардиография показывает суженное отверстие клапана, утолщённые малоподвижные створки, увеличенное правое предсердие и то, сколько крови проходит через клапан; по ней определяют тяжесть стеноза.
    cite: [3, 4]
  - level: patient
    prompt: Какой основной вид операции при трикуспидальном стенозе называют европейские рекомендации?
    options:
      - text: Пересадка сердца и обоих лёгких от одного донора
      - text: Замена (протезирование) трёхстворчатого клапана
        correct: true
      - text: Удаление селезёнки
    explanation: Основной вид операции — замена (протезирование) трёхстворчатого клапана.
    cite: [1]
  - level: student
    prompt: Что, по MSD, происходит с ПЖ при ТС?
    options:
      - text: Он переполняется кровью сильнее, чем в норме
      - text: Он остаётся недонаполненным и маленьким
        correct: true
      - text: У него развивается собственная дисфункция
    explanation: 'По MSD, ПП гипертрофируется и растягивается; развиваются последствия сердечной недостаточности, вызванной поражением правых отделов сердца, но без дисфункции ПЖ: ПЖ остаётся недонаполненным и маленьким.'
    cite: [3]
  - level: student
    prompt: Как ESC 2025 оценивает роль транскатетерного протезирования клапана при ТС?
    options:
      - text: Это основной признанный метод лечения ТС
      - text: Его польза доказана в крупных исследованиях
      - text: Роль этого метода при ТС не изучена
        correct: true
    explanation: По ESC 2025, роль транскатетерного протезирования клапана при ТС не изучена; лечение симптомного ТС — главным образом хирургическое протезирование трикуспидального клапана.
    cite: [1]
