questions:
  - level: patient
    prompt: Что нарушено в сердце при этом пороке?
    options:
      - text: Клапан лёгочной артерии сужен, но кровь через него проходит
      - text: Выход крови из правого желудочка в лёгочную артерию закрыт
        correct: true
      - text: Выход крови из левого желудочка в аорту закрыт
    explanation: Между правым желудочком и лёгочной артерией нет прямого сообщения — выход крови из правого желудочка в лёгкие закрыт.
    cite: [1, 2]
  - level: patient
    prompt: Как при этом пороке кровь попадает в лёгкие?
    options:
      - text: Из аорты — через артериальный проток или коллатерали
        correct: true
      - text: Прямо из правого желудочка через клапан лёгочной артерии
      - text: Из левого желудочка по отдельному сосуду, минуя аорту
    explanation: Прямого пути из правого желудочка в лёгкие нет, поэтому кровь идёт туда через аорту — через открытый артериальный проток или по коллатеральным сосудам.
    cite: [1]
  - level: patient
    prompt: Чем этот порок отличается от тетрады Фалло по симптомам?
    options:
      - text: Синюшности при нём не бывает совсем
      - text: Одышечно-цианотические приступы при нём чаще и тяжелее
      - text: Одышечно-цианотических приступов при нём нет
        correct: true
    explanation: В отличие от тетрады Фалло, одышечно-цианотических приступов при этом пороке не бывает. Главный же признак порока — синюшность.
    cite: [1]
  - level: patient
    prompt: Что российские рекомендации называют показанием для экстренной госпитализации?
    options:
      - text: Предстоящее лечение зубов у стоматолога
      - text: Резкое усиление синюшности или одышки
        correct: true
      - text: Переход ребёнка к взрослому кардиологу в 18 лет
    explanation: Показания для экстренной госпитализации — резкое усиление синюшности или одышки и нарастающая сердечная недостаточность. Лечение зубов заранее согласуют с кардиологом, а после 18 лет наблюдение продолжается во взрослой поликлинике.
    cite: [1]
  - level: student
    prompt: Что соответствует IV типу по классификации J. Somerville?
    options:
      - text: Атрезия только клапана ЛА при сформированных стволе и обеих ветвях
      - text: Атрезия клапана, ствола и одной из ЛА
      - text: Атрезия клапана, ствола и обеих ЛА, кровоток по коллатералям
        correct: true
    explanation: IV тип — атрезия клапана, ствола и обеих ЛА, кровоток в лёгких идёт по сети коллатералей. Атрезия только клапана при сформированных стволе и ветвях — I тип, клапана, ствола и одной ЛА — III тип.
    cite: [1]
  - level: student
    prompt: Как соотносится насыщение крови кислородом в аорте, коллатеральных артериях и ЛА?
    options:
      - text: Оно одинаково во всех трёх сосудах
        correct: true
      - text: В ЛА оно выше, чем в аорте и коллатералях
      - text: В аорте оно выше, чем в ЛА и коллатералях
    explanation: По российским рекомендациям, насыщение крови кислородом в аорте, коллатеральных артериях и ЛА одинаково.
    cite: [1]
