questions:
  - level: patient
    prompt: Как алкоголь вредит сердечной мышце при алкогольной кардиомиопатии?
    options:
      - text: Закупоривает артерии сердца холестериновыми бляшками
      - text: Вызывает у человека врождённый порок клапанов сердца
      - text: Он и ацетальдегид напрямую повреждают её клетки
        correct: true
    explanation: Алкоголь и вещество, в которое он превращается в организме (ацетальдегид), напрямую повреждают клетки сердечной мышцы.
    cite: [1]
  - level: patient
    prompt: Что называют «праздничным сердцем»?
    options:
      - text: Румянец на щеках от радостного волнения на празднике
      - text: Фибрилляцию предсердий, которую спровоцировал запой
        correct: true
      - text: Изжогу, которая бывает после сытного застолья
    explanation: Запой может спровоцировать фибрилляцию предсердий; это называют «праздничным сердцем».
    cite: [2, 6]
  - level: patient
    prompt: Что статья говорит о роли наследственности?
    options:
      - text: У людей с разными генами алкоголь вредит сердцу неодинаково
        correct: true
      - text: Наследственность на эту болезнь сердца никак не влияет вообще
      - text: Болезнь передаётся только от матери к дочери, а не к сыновьям
    explanation: Важна и наследственность — у людей с разными генами алкоголь вредит сердцу неодинаково.
    cite: [1]
  - level: patient
    prompt: Какой признак при алкогольной кардиомиопатии — повод вызвать скорую?
    options:
      - text: Насморк весной
      - text: Боль в груди
        correct: true
      - text: Зуд от укуса комара
    explanation: Вызывайте скорую, если появились признаки острой сердечной недостаточности (резкая нехватка воздуха, удушье, особенно лёжа), обморок или боль в груди.
    cite: [1]
  - level: student
    prompt: К какой группе причин ДКМП европейские рекомендации относят алкоголь?
    options:
      - text: К инфекционным вирусным причинам
      - text: К эндокринным и гормональным нарушениям
      - text: К токсическим негенетическим причинам
        correct: true
    explanation: Европейские рекомендации относят алкоголь (этанол) к токсическим негенетическим причинам ДКМП.
    cite: [4]
  - level: student
    prompt: Какие белки кардиомиоцитов, по Минздраву, повреждают этанол и его метаболиты?
    options:
      - text: Тяжёлые цепи альфа-миозина
        correct: true
      - text: Цепи гемоглобина эритроцитов
      - text: Коллаген створок клапанов
    explanation: По Минздраву, этанол и его метаболиты, прежде всего ацетальдегид, повреждают тяжёлые цепи альфа-миозина и снижают сократимость.
    cite: [1]
