questions:
  - level: patient
    prompt: Где при этом пороке находится препятствие току крови?
    options:
      - text: Внутри лёгочных вен, у самого входа в предсердие
      - text: Под аортальным клапаном, на выходе из левого желудочка
        correct: true
      - text: В сонных артериях на шее, по пути крови к головному мозгу
    explanation: При подклапанном стенозе препятствие току крови находится не в самом аортальном клапане, а под ним, на выходе из левого желудочка в аорту.
    cite: [1, 2]
  - level: patient
    prompt: Как называется состояние, когда аортальный клапан, травмированный струёй, пропускает кровь обратно?
    options:
      - text: Аортальный стеноз
      - text: Гипертрофическая кардиомиопатия
      - text: Аортальная недостаточность
        correct: true
    explanation: Быстрая струя крови через сужение травмирует аортальный клапан, и он может начать пропускать кровь обратно — возникает аортальная недостаточность.
    cite: [1]
  - level: patient
    prompt: Какое исследование главное при диагностике этого порока?
    options:
      - text: УЗИ сердца с допплером
        correct: true
      - text: УЗИ вен ног с допплером
      - text: УЗИ сонных артерий с допплером
    explanation: Главное исследование — УЗИ сердца (эхокардиография) с допплером.
    cite: [1, 2]
  - level: patient
    prompt: Что делает хирург во время операции при этом пороке?
    options:
      - text: Ставит стент в одну из коронарных артерий
      - text: Удаляет мембрану или валик и часть мышцы под ними
        correct: true
      - text: Пересаживает пациенту донорское сердце другого человека
    explanation: Хирург удаляет мембрану или валик и часть мышцы под ними со стороны перегородки.
    cite: [1, 2]
  - level: student
    prompt: Что создаёт обструкцию ВОЛЖ при обструктивной ГКМП?
    options:
      - text: Тромб в ушке левого предсердия на фоне фибрилляции предсердий
      - text: Кальциноз створок клапана лёгочной артерии
      - text: Базальная часть МЖП и систолическое переднее движение МК
        correct: true
    explanation: При ГКМП обструкция ВОЛЖ динамическая — её создают гипертрофированная базальная часть перегородки и систолическое переднее движение МК.
    cite: [3, 4]
  - level: student
    prompt: Какой метод помогает отличить ПСА от гипертрофированной МЖП?
    options:
      - text: Чреспищеводная эхокардиография
        correct: true
      - text: Рентгенография органов грудной клетки
      - text: Сцинтиграфия скелета с технецием
    explanation: Гипертрофированная межжелудочковая перегородка может скрывать мембрану; чреспищеводная ЭхоКГ позволяет отличить ПСА от гипертрофированной перегородки.
    cite: [1]
