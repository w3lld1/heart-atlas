questions:
  - level: patient
    prompt: Что, по статье, делает кора надпочечников при этой болезни?
    options:
      - text: Вырабатывает свои гормоны ночью, а днём отключается
      - text: Забирает из крови сахар и запасает его вместо печени
      - text: Сама вырабатывает слишком много гормона
        correct: true
    explanation: При первичном гиперальдостеронизме кора надпочечников сама, без обычной регуляции, вырабатывает слишком много гормона альдостерона.
    cite: [3, 6]
  - level: patient
    prompt: Что, по статье, кроме опухоли одного надпочечника, может быть причиной болезни?
    options:
      - text: Увеличение (гиперплазия) обоих надпочечников
        correct: true
      - text: Камни, которые образовались внутри обоих надпочечников
      - text: Инфекция, которая постепенно разрушила оба надпочечника
    explanation: Причиной может быть доброкачественная опухоль одного надпочечника (аденома), которая вырабатывает альдостерон, или увеличение (гиперплазия) обоих надпочечников.
    cite: [1, 3]
  - level: patient
    prompt: Почему при этой болезни повышается давление?
    options:
      - text: Стенки сосудов расширяются и становятся гораздо мягче, чем обычно
      - text: Натрий и вода задерживаются, и крови в сосудах становится больше
        correct: true
      - text: Почки удерживают сахар, и он откладывается в стенках сосудов
    explanation: Натрий и вода задерживаются, крови в сосудах становится больше, и давление повышается.
    cite: [3, 4, 5]
  - level: patient
    prompt: Как обычно лечат, если причина — опухоль одного надпочечника?
    options:
      - text: Облучают оба надпочечника несколькими сеансами в течение месяца
      - text: Проводят курс антибиотиков, чтобы опухоль постепенно рассосалась
      - text: Удаляют этот надпочечник лапароскопически
        correct: true
    explanation: Если причина — опухоль одного надпочечника, его обычно удаляют лапароскопически.
    cite: [1, 3]
  - level: student
    prompt: Что характерно для вторичного гиперальдостеронизма?
    options:
      - text: Ренин подавлен, а альдостерон остаётся в пределах нормы
      - text: Высоки и ренин, и альдостерон
        correct: true
      - text: Ренин высок, а альдостерон снижен
    explanation: При вторичном гиперальдостеронизме высоки и ренин, и альдостерон.
    cite: [3, 4]
  - level: student
    prompt: Почему, по MSD, большинству пациентов для латерализации нужна катетеризация вен надпочечников?
    options:
      - text: КТ и МРТ относительно малочувствительны
        correct: true
      - text: Надпочечники не попадают в область сканирования КТ и МРТ живота
      - text: КТ и МРТ противопоказаны пациентам с артериальной гипертензией
    explanation: КТ и МРТ, по MSD, относительно малочувствительны, поэтому большинству пациентов для латерализации нужна катетеризация вен надпочечников.
    cite: [3]
