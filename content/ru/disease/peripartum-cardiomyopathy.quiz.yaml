questions:
  - level: patient
    prompt: Когда появляются признаки сердечной недостаточности при перипартальной кардиомиопатии?
    options:
      - text: В детстве, задолго до беременности
      - text: В конце беременности или в первые месяцы после родов
        correct: true
      - text: Только через много лет после родов
    explanation: ПКМП — форма дилатационной кардиомиопатии, при которой признаки сердечной недостаточности появляются в конце беременности или в первые месяцы после родов.
    cite: [2]
  - level: patient
    prompt: Почему ПКМП могут распознать поздно?
    options:
      - text: Болезнь никогда не вызывает никаких ощущений
      - text: Её можно выявить только генетическим анализом
      - text: Похожие ощущения бывают и при обычной беременности
        correct: true
    explanation: 'Симптомы — как при сердечной недостаточности: одышка, сердцебиение, отёки стоп. Похожие ощущения бывают и при обычной беременности, поэтому болезнь могут распознать поздно.'
    cite: [2, 4]
  - level: patient
    prompt: Какое обследование показывает, насколько ослаблен левый желудочек и нет ли в сердце тромба?
    options:
      - text: Эхокардиография (УЗИ сердца)
        correct: true
      - text: Общий анализ мочи
      - text: Измерение температуры тела
    explanation: Эхокардиография — УЗИ сердца, которое показывает, насколько ослаблен и расширен левый желудочек и нет ли в сердце тромба. Её повторяют, чтобы проверить, как помогает лечение.
    cite: [1, 2]
  - level: patient
    prompt: Что ESC и российские рекомендации советуют всем женщинам после ПКМП?
    options:
      - text: Ничего, если работа сердца восстановилась
      - text: Консультацию о риске повторения и о контрацепции
        correct: true
      - text: Обязательную пересадку сердца
    explanation: ПКМП может повториться при следующей беременности, поэтому всем женщинам после ПКМП советуют консультацию о риске повторения и о контрацепции, даже если работа сердца восстановилась.
    cite: [1, 2, 4]
  - level: student
    prompt: Какой фрагмент, по обсуждаемому механизму, повреждает эндотелий и вызывает дисфункцию миокарда при ПКМП?
    options:
      - text: Фрагмент инсулина
      - text: Фрагмент гемоглобина
      - text: Фрагмент пролактина 16 кДа
        correct: true
    explanation: Оксидативный стресс активирует катепсин D, который расщепляет пролактин с образованием фрагмента 16 кДа; этот фрагмент повреждает эндотелий и вызывает дисфункцию миокарда.
    cite: [2]
  - level: student
    prompt: Какая ФВ ЛЖ, как правило, входит в критерии ПКМП по российским рекомендациям?
    options:
      - text: Более 70%
      - text: Менее 45%
        correct: true
      - text: ФВ не входит в критерии, оценивают только предсердия
    explanation: 'Критерии ПКМП: СН в течение последнего месяца беременности или 5 месяцев после родов, отсутствие другой причины СН и систолическая дисфункция ЛЖ (как правило, ФВ ЛЖ менее 45%).'
    cite: [2]
