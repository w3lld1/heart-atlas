questions:
  - level: patient
    prompt: Что прикреплено к частице Лп(а), которая похожа на частицу ЛНП?
    options:
      - text: Гормон из гипофиза — гормон роста
      - text: Дополнительный белок — апо(а)
        correct: true
      - text: Фермент слюны — амилаза
    explanation: Частица Лп(а) похожа на частицу ЛНП, но к ней прикреплён дополнительный белок — апо(а).
    cite: [5, 6]
  - level: patient
    prompt: Что почти целиком определяет уровень Лп(а)?
    options:
      - text: Гены, полученные от родителей
        correct: true
      - text: Количество воды, выпитой за день
      - text: Количество часов сна за ночь
    explanation: Уровень Лп(а) почти целиком определяют гены, полученные от родителей, поэтому высокий уровень передаётся по наследству.
    cite: [3, 6]
  - level: patient
    prompt: Что могут делать маленькие частицы Лп(а), как и частицы ЛНП?
    options:
      - text: Растворять уже выросшие бляшки в стенке сосудов
      - text: Переносить кислород из лёгких ко всем органам тела
      - text: Проникать в стенку артерии и задерживаться там
        correct: true
    explanation: Частицы Лп(а), как и частицы ЛНП, могут проникать во внутренний слой стенки артерии и задерживаться там, а это повышает риск атеросклероза.
    cite: [2]
  - level: patient
    prompt: С какими болезнями сильнее всего связан высокий Лп(а)?
    options:
      - text: Бронхиальная астма и хроническая мигрень
      - text: Инфаркт миокарда и аортальный стеноз
        correct: true
      - text: Катаракта и возрастная глаукома глаз
    explanation: Сильнее всего высокий Лп(а) связан с инфарктом миокарда и аортальным стенозом — сужением аортального клапана.
    cite: [3]
  - level: student
    prompt: Как, по мнению авторов, действует крингл апо(а), гомологичный плазминогену?
    options:
      - text: Усиливает фибринолиз и ускоряет растворение тромбов
      - text: Связывает гемоглобин внутри эритроцитов крови
      - text: Конкурентно подавляет фибринолиз
        correct: true
    explanation: Один из крингл-доменов апо(а) гомологичен плазминогену и, как полагают, конкурентно подавляет фибринолиз, предрасполагая к тромбообразованию.
    cite: [5]
  - level: student
    prompt: Чем, по предположению ESC/EAS 2019, может быть чрезмерно повышенный Лп(а)?
    options:
      - text: Наследственной дислипидемией
        correct: true
      - text: Аутоиммунной болезнью щитовидной железы
      - text: Вирусной инфекцией сердечной мышцы
    explanation: В рекомендациях ESC/EAS 2019 высказано предположение, что чрезмерно повышенный Лп(а), возможно, представляет собой наследственную дислипидемию.
    cite: [2]
