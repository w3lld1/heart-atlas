questions:
  - level: patient
    prompt: Какой фактор риска аневризмы брюшной аорты называют главным?
    options:
      - text: Работа за компьютером
      - text: Курение
        correct: true
      - text: Низкий рост
    explanation: Главный фактор риска аневризмы брюшной аорты — курение.
    cite: [2, 4, 5]
  - level: patient
    prompt: Какое исследование главное, чтобы найти аневризму брюшной аорты?
    options:
      - text: Электрокардиограмма (ЭКГ)
      - text: Анализ мочи
      - text: УЗИ брюшной аорты
        correct: true
    explanation: Главное исследование — УЗИ брюшной аорты. Оно выполняется быстро, не связано с облучением и находит аневризму почти всегда.
    cite: [2, 4]
  - level: patient
    prompt: Как риск разрыва связан с размером аневризмы?
    options:
      - text: Чем больше аневризма, тем выше риск разрыва
        correct: true
      - text: Риск разрыва не зависит от размера
      - text: У маленьких аневризм риск разрыва самый высокий
    explanation: Главная опасность аневризмы — разрыв. Чем больше аневризма, тем выше его риск, а у маленьких аневризм он очень низкий.
    cite: [3, 5]
  - level: patient
    prompt: При каком признаке нужно вызывать скорую?
    options:
      - text: Лёгкий насморк
      - text: Внезапная сильная боль в животе или спине
        correct: true
      - text: Сухость кожи рук
    explanation: Скорую вызывают при внезапной сильной боли в животе или спине, а также при потере сознания или обмороке.
    cite: [2, 3]
  - level: student
    prompt: Что лежит в основе АБА гистологически?
    options:
      - text: Амилоидоз стенки аорты
      - text: Врождённое сужение аорты
      - text: Дегенерация медии
        correct: true
    explanation: Факторы риска у АБА и атеросклероза общие, но гистологически АБА отличается — в её основе дегенерация медии.
    cite: [2, 4]
  - level: student
    prompt: С чем чаще всего ошибочно принимают разрыв АБА?
    options:
      - text: С почечной коликой и инфарктом миокарда
        correct: true
      - text: С мигренью и отитом
      - text: С пневмонией и бронхитом
    explanation: Классическая триада есть примерно у 50% пациентов с разрывом АБА; чаще всего разрыв ошибочно принимают за почечную колику и инфаркт миокарда.
    cite: [2]
