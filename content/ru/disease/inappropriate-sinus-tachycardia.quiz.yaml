questions:
  - level: patient
    prompt: Что врач делает сначала, прежде чем поставить диагноз НСТ?
    options:
      - text: Исключает другие причины частого пульса
        correct: true
      - text: Проверяет остроту зрения пациента по таблице
      - text: Делает прививку от сезонного гриппа
    explanation: Поставить диагноз НСТ может только врач после обследования. Сначала он исключает другие причины частого пульса.
    cite: [1, 3]
  - level: patient
    prompt: Что может лежать в основе НСТ?
    options:
      - text: Воспаление желчного пузыря и желчных протоков
      - text: Повреждение сетчатки глаза при близорукости
      - text: Слишком активная работа синусового узла
        correct: true
    explanation: 'Синусовый узел может сам работать слишком активно, а может быть нарушена его регуляция вегетативной нервной системой: симпатические влияния сильнее, парасимпатические — слабее.'
    cite: [1]
  - level: patient
    prompt: Что пробуют при НСТ до лекарств?
    options:
      - text: Носить тёплый шерстяной шарф даже летом
      - text: Больше двигаться и избегать кофеина
        correct: true
      - text: Спать в очках с тёмно-синими стёклами
    explanation: До лекарств пробуют изменить образ жизни — больше двигаться и избегать веществ, которые подстёгивают сердце, например кофеина.
    cite: [2, 3]
  - level: patient
    prompt: Когда при сердцебиении нужно вызывать скорую?
    options:
      - text: Если на руках заметна лёгкая сухость кожи зимой
      - text: Если немного заложен нос после прогулки в мороз
      - text: Если есть обморок или предобморочное состояние
        correct: true
    explanation: 'Вызывайте скорую по номеру 103 или 112, если сердцебиение сопровождается обмороком или предобморочным состоянием: резким потемнением в глазах, слабостью, головокружением, холодным потом.'
    cite: [1]
  - level: student
    prompt: Что показывает ЭКГ в 12 отведениях при НСТ?
    options:
      - text: Обычную форму зубца P
        correct: true
      - text: Пилообразные волны F вместо зубца P
      - text: Мелкие волны f вместо зубца P
    explanation: 'ЭКГ в 12 отведениях при НСТ показывает обычную морфологию зубца P: положительный в I, II и aVF, двухфазный или отрицательный в V1.'
    cite: [1, 2]
  - level: student
    prompt: Когда, по ESC, при НСТ выполняют ЭФИ?
    options:
      - text: Только чтобы проверить, нет ли блокады ножек пучка Гиса
      - text: Только чтобы исключить синусовую ри-ентри-тахикардию
        correct: true
      - text: Только чтобы измерить давление в лёгочной артерии и аорте
    explanation: ЭФИ выполняют, только если нужно исключить синусовую ри-ентри-тахикардию.
    cite: [2]
