questions:
  - level: patient
    prompt: Что такое общий артериальный ствол?
    options:
      - text: Сужение клапана аорты
      - text: Один сосуд отходит от сердца вместо двух
        correct: true
      - text: Отверстие между правым и левым предсердием
    explanation: Общий артериальный ствол — врождённый порок сердца, при котором от сердца отходит один большой сосуд вместо двух отдельных — аорты и лёгочной артерии.
    cite: [1, 4]
  - level: patient
    prompt: Что происходит с лёгкими у ребёнка с этим пороком сразу после рождения?
    options:
      - text: Лёгкие получают слишком мало крови
      - text: Кровь в лёгкие совсем перестаёт поступать
      - text: Лёгкие переполняются кровью
        correct: true
    explanation: Сразу после рождения давление в лёгочных артериях становится таким же, как в стволе, и лёгкие переполняются кровью.
    cite: [1]
  - level: patient
    prompt: Какое исследование главное для диагноза?
    options:
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: Анализ мочи на сахар
      - text: Измерение роста, веса и окружности головы
    explanation: 'Главное исследование — УЗИ сердца (эхокардиография) с допплером: на нём виден единственный сосуд, отходящий от сердца, тип порока, работа трункального клапана и направление сброса крови.'
    cite: [1, 3]
  - level: patient
    prompt: Почему кондуит, поставленный при операции, в детстве приходится менять?
    options:
      - text: Он растворяется в первые дни после операции
      - text: Он растёт быстрее ребёнка и становится велик
      - text: Он не растёт вместе с ребёнком
        correct: true
    explanation: 'Кондуит не растёт вместе с ребёнком: со временем он становится мал, и в детстве его приходится менять.'
    cite: [3, 4]
  - level: student
    prompt: Чем тип B по Van Praagh отличается от типа A?
    options:
      - text: Нет дефекта межжелудочковой перегородки
        correct: true
      - text: У ствола два отдельных клапана — аортальный и лёгочный
      - text: Аорта и лёгочная артерия отходят от сердца отдельно
    explanation: По Van Praagh выделяют тип A (с ДМЖП) и очень редкий тип B (без ДМЖП).
    cite: [3]
  - level: student
    prompt: К какому пороку сейчас относят прежний тип IV по Collett–Edwards?
    options:
      - text: К изолированному дефекту межпредсердной перегородки
      - text: К тетраде Фалло с атрезией лёгочной артерии
        correct: true
      - text: К открытому овальному окну без других пороков
    explanation: Прежний тип IV сейчас относят к тетраде Фалло с атрезией лёгочной артерии.
    cite: [3]
