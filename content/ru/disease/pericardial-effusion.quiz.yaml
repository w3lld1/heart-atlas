questions:
  - level: patient
    prompt: Что такое перикардиальный выпот?
    options:
      - text: Скопление жира в стенках коронарных артерий
      - text: Скопление воздуха в полости грудной клетки
      - text: Скопление жидкости в околосердечной сумке
        correct: true
    explanation: Перикардиальный выпот — скопление жидкости в перикарде, околосердечной сумке.
    cite: [1, 3]
  - level: patient
    prompt: Как обычно проявляется небольшой выпот?
    options:
      - text: Обычно ничем не проявляется
        correct: true
      - text: Обычно вызывает высокую температуру и сыпь
      - text: Обычно вызывает потерю зрения на один глаз
    explanation: Небольшой выпот обычно ничем не проявляется.
    cite: [1]
  - level: patient
    prompt: Какое исследование главное при перикардиальном выпоте?
    options:
      - text: Проверка остроты зрения по таблице
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: Анализ мочи на сахар
    explanation: Главное исследование — УЗИ сердца (эхокардиография); оно подтверждает выпот, показывает его размер и помогает увидеть тампонаду.
    cite: [3]
  - level: patient
    prompt: Когда человеку с выпотом нужно вызвать скорую помощь?
    options:
      - text: Захотелось спать после плотного обеда в выходной
      - text: Немного зачесался нос от пыли в комнате
      - text: Появились обморок или нарастающая одышка
        correct: true
    explanation: Вызывайте скорую, если у человека с выпотом появились приступы резкой слабости, головокружение, обморок или нарастающая одышка.
    cite: [1, 3]
  - level: student
    prompt: От чего зависит развитие тампонады, если выпот не очень большой?
    options:
      - text: От скорости накопления жидкости
        correct: true
      - text: От общего количества жидкости
      - text: От времени суток, когда проводят УЗИ сердца
    explanation: Если выпот не очень большой, развитие тампонады определяет скорость накопления жидкости, а не её количество.
    cite: [1]
  - level: student
    prompt: Как на ЭхоКГ оценивают количество выпота?
    options:
      - text: По частоте сердечных сокращений во время исследования
      - text: По расстоянию между листками перикарда в диастолу
        correct: true
      - text: По толщине мышечной стенки левого желудочка в систолу
    explanation: Количество выпота оценивают на ЭхоКГ в диастолу по расстоянию между листками.
    cite: [1]
