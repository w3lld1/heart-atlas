questions:
  - level: patient
    prompt: Что такое тиреотоксикоз?
    options:
      - text: Избыток сахара в крови
      - text: Воспаление внутренней оболочки клапанов сердца
      - text: Избыток гормонов щитовидной железы в крови
        correct: true
    explanation: Тиреотоксикоз — состояние, при котором в крови слишком много гормонов щитовидной железы, и они оказывают токсическое действие на органы и ткани.
    cite: [1]
  - level: patient
    prompt: Что происходит в организме при болезни Грейвса?
    options:
      - text: Организм вырабатывает антитела, подстёгивающие железу
        correct: true
      - text: В щитовидной железе откладывается холестерин и кальций
      - text: Железу разрушает вирус гриппа
    explanation: Болезнь Грейвса — аутоиммунное заболевание, при котором организм вырабатывает антитела, которые подстёгивают щитовидную железу.
    cite: [1]
  - level: patient
    prompt: Какое исследование делают всем людям с тиреотоксикозом, чтобы проверить сердце?
    options:
      - text: Биопсию сердечной мышцы через катетер
      - text: Электрокардиограмму (ЭКГ)
        correct: true
      - text: Коронарографию
    explanation: Всем людям с тиреотоксикозом делают ЭКГ, чтобы проверить сердце.
    cite: [1]
  - level: patient
    prompt: Как статья описывает тиреотоксический криз?
    options:
      - text: Сужение коронарной артерии бляшкой
      - text: Врождённое отверстие в перегородке между правым и левым предсердиями
      - text: Резкое обострение тиреотоксикоза, которое лечат в реанимации
        correct: true
    explanation: Тиреотоксический криз — опасное для жизни осложнение, резкое обострение тиреотоксикоза, которое лечат в реанимации.
    cite: [1, 4, 5]
  - level: student
    prompt: К какому варианту относят тиреотоксикоз с ФП, сердечной недостаточностью или тромбоэмболиями?
    options:
      - text: К врождённому тиреотоксикозу
      - text: К осложнённому тиреотоксикозу
        correct: true
      - text: К наследственной форме болезни
    explanation: Тиреотоксикоз с ФП, сердечной недостаточностью или тромбоэмболиями относят к осложнённому.
    cite: [1]
  - level: student
    prompt: Как работает миокард в покое при тиреотоксикозе?
    options:
      - text: Он гиперфункционирует
        correct: true
      - text: Он работает так же, как у здоровых
      - text: Он почти перестаёт сокращаться
    explanation: Миокард при тиреотоксикозе гиперфункционирует уже в покое; рост ЧСС и потребности миокарда в кислороде может проявить скрытую стенокардию и привести к декомпенсации сердечной недостаточности.
    cite: [1]
