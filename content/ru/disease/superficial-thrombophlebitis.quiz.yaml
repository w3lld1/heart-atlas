questions:
  - level: patient
    prompt: Что такое тромбофлебит поверхностных вен?
    options:
      - text: Тромб в подкожной вене с воспалением вены и кожи вокруг неё
        correct: true
      - text: Тромб в глубокой вене, которая лежит между мышцами ноги
      - text: Расширение и извитость подкожных вен ноги без всякого тромба
    explanation: Тромбофлебит поверхностных вен — состояние, при котором в подкожной вене образуется тромб, а стенка вены, подкожная клетчатка и кожа вокруг воспаляются.
    cite: [1]
  - level: patient
    prompt: Что опаснее всего при тромбофлебите поверхностных вен?
    options:
      - text: Тромб в подкожной вене часто отрывается сам по себе
      - text: Воспаление быстро переходит с вены на соседние суставы
      - text: Тромб переходит на глубокие вены и может вызвать ТЭЛА
        correct: true
    explanation: Опаснее всего, если тромб переходит на глубокие вены (тромбоз глубоких вен) и вызывает тромбоэмболию лёгочной артерии. Сам тромб в поверхностной вене отрывается редко.
    cite: [1, 4, 5]
  - level: patient
    prompt: Какой на ощупь бывает вена с тромбом при тромбофлебите?
    options:
      - text: Мягкая, легко сжимается, как обычная вена
      - text: Твёрдая, как плотный шнур под кожей
        correct: true
      - text: Пульсирует в такт сердцу, как артерия
    explanation: Вена с тромбом на ощупь как твёрдый шнур под кожей, а не мягкая, как обычная или варикозная вена.
    cite: [5]
  - level: patient
    prompt: Какое исследование главное при подозрении на тромбофлебит?
    options:
      - text: УЗИ вен (дуплексное сканирование)
        correct: true
      - text: Лабораторный анализ крови на свёртываемость
      - text: Рентгеновский снимок обеих ног
    explanation: Главное исследование — УЗИ вен (дуплексное сканирование). Лабораторные анализы для диагноза и выбора лечения Минздрав не рекомендует.
    cite: [1]
  - level: student
    prompt: Чем прежде всего определяется риск перехода тромба на глубокие вены при ТФПВ?
    options:
      - text: Уровнем D-димера в крови пациента
      - text: Выраженностью покраснения кожи над веной
      - text: Проксимальной границей тромба
        correct: true
    explanation: Степень риска перехода тромба на глубокие вены определяется прежде всего проксимальной границей тромба. Маркёры тромбообразования, в том числе D-димер, не позволяют в полной мере определить активность процесса.
    cite: [1]
  - level: student
    prompt: Как формулируют диагноз, если тромб из поверхностной вены перешёл на глубокие?
    options:
      - text: Как варикотромбофлебит
      - text: Как тромбоз глубоких вен
        correct: true
      - text: Как мигрирующий тромбофлебит
    explanation: Если тромб перешёл на глубокие вены или одновременно выявлен ТГВ, диагноз формулируют как тромбоз глубоких вен.
    cite: [1]
