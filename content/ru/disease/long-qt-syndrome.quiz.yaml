questions:
  - level: patient
    prompt: Что происходит в сердце при синдроме удлинённого интервала QT?
    options:
      - text: Сужается аорта
      - text: Электрическое возбуждение клеток желудочков длится дольше обычного
        correct: true
      - text: Не закрывается клапан сердца
    explanation: СУИQT — нарушение работы ионных каналов клеток сердца, при котором электрическое возбуждение клеток желудочков длится дольше обычного, а на ЭКГ удлиняется интервал QT.
    cite: [2]
  - level: patient
    prompt: Как проявляется синдром, пока аритмии нет?
    options:
      - text: Никак, он ничем себя не проявляет
        correct: true
      - text: Постоянной болью в груди
    explanation: Пока аритмии нет, синдром ничем себя не проявляет.
    cite: [2]
  - level: patient
    prompt: Исключает ли одна нормальная ЭКГ врождённый СУИQT?
    options:
      - text: Да, полностью исключает
      - text: Нет, не исключает
        correct: true
    explanation: 'Одна нормальная ЭКГ не исключает врождённый синдром: QTc бывает нормальным у 25–50 % людей с найденной мутацией.'
    cite: [2]
  - level: patient
    prompt: У кого ищут мутацию, если её нашли у человека с СУИQT?
    options:
      - text: У всех близких родственников, даже без жалоб и с нормальной ЭКГ
        correct: true
      - text: Только у родственников, у которых есть жалобы
    explanation: Если у человека нашли мутацию, её ищут у всех близких родственников, даже если у них нет жалоб и ЭКГ в норме.
    cite: [1]
  - level: student
    prompt: Как наследуются три основные формы СУИQT (типы 1, 2 и 3)?
    options:
      - text: Сцепленно с Х-хромосомой
      - text: Аутосомно-доминантно с неполной пенетрантностью
        correct: true
    explanation: Три основных гена — KCNQ1, KCNH2 и SCN5A (типы 1, 2 и 3); эти три формы наследуются аутосомно-доминантно с неполной пенетрантностью.
    cite: [1, 2]
  - level: student
    prompt: Исключает ли отрицательный результат генетического исследования СУИQT?
    options:
      - text: Нет, мутации находят примерно у 75 %
        correct: true
      - text: Да, исключает
    explanation: Молекулярно-генетическое исследование рекомендуется всем пациентам с высокой вероятностью клинического диагноза; мутации находят примерно у 75 %, поэтому отрицательный результат не исключает СУИQT.
    cite: [1]
