questions:
  - level: patient
    prompt: Что видно на коронарографии при стенокардии без обструкции коронарных артерий (ANOCA)?
    options:
      - text: Артерии закрыты тромбом
      - text: Крупные коронарные артерии не сужены
        correct: true
      - text: Створки клапанов сердца срослись и сузились
    explanation: У многих людей, которым из-за стенокардии делают коронарографию, крупные коронарные артерии не сужены; это называют стенокардией без обструкции коронарных артерий (ANOCA).
    cite: [1]
  - level: patient
    prompt: Что происходит с крупной артерией при вазоспастической стенокардии?
    options:
      - text: В ней растёт бляшка
      - text: В её стенке образуется выпячивание, похожее на мешок
      - text: Она на время резко сужается из-за спазма
        correct: true
    explanation: При вазоспастической стенокардии крупная коронарная артерия на время резко сужается — это спазм.
    cite: [1, 4]
  - level: patient
    prompt: Что не так с мелкими сосудами сердца при микрососудистой стенокардии?
    options:
      - text: Они плохо расширяются при нагрузке
        correct: true
      - text: Их воспаляют бактерии, попавшие в кровь
      - text: Они от рождения слишком широкие
    explanation: При микрососудистой стенокардии изменены строение или работа мелких сосудов — они плохо расширяются при нагрузке или слишком сильно сужаются.
    cite: [1, 3]
  - level: patient
    prompt: Что статья советует сделать, если случился обморок?
    options:
      - text: Подождать до утра
      - text: Сразу вызвать скорую
        correct: true
      - text: Записаться к врачу на ближайшие недели
    explanation: Сразу звоните 103 или 112, если случился обморок.
    cite: [1]
  - level: student
    prompt: Как классификация Минздрава относит вазоспастическую и микрососудистую стенокардию?
    options:
      - text: К порокам клапанов
      - text: К воспалительным заболеваниям миокарда и перикарда
      - text: К отдельным формам стабильной ИБС
        correct: true
    explanation: В классификации Минздрава это отдельные формы стабильной ИБС — «стенокардия вазоспастическая» (вариантная, стенокардия Принцметала) и «стенокардия микрососудистая».
    cite: [2]
  - level: student
    prompt: На чём, по ESC 2024, основан диагноз ANOCA/INOCA?
    options:
      - text: Только на обычном рентгеновском снимке грудной клетки
      - text: Только на инвазивной функциональной оценке
        correct: true
      - text: Только на общем анализе крови
    explanation: По ESC 2024, ишемия при функциональной визуализации без обструктивной ИБС должна наводить на мысль об ANOCA/INOCA, а диагноз ставят только по инвазивной функциональной оценке.
    cite: [1]
