questions:
  - level: patient
    prompt: Что происходит со стенкой левого желудочка при долгом повышенном давлении?
    options:
      - text: Она постепенно утолщается
        correct: true
      - text: Она замещается жировой тканью
      - text: В ней появляется отверстие между камерами
    explanation: При долгом повышенном давлении сердцу приходится работать сильнее, и стенка левого желудочка утолщается — это гипертрофия левого желудочка.
    cite: [5, 6]
  - level: patient
    prompt: К чему могут привести утолщение и уплотнение стенок сердца?
    options:
      - text: К весенней аллергии на пыльцу и зуду глаз
      - text: К нарушениям ритма и сердечной недостаточности
        correct: true
      - text: К язве желудка и камням в желчном пузыре у взрослых
    explanation: Утолщённые стенки жёстче обычных и хуже наполняются кровью; такие изменения могут привести к нарушениям ритма и к сердечной недостаточности.
    cite: [6]
  - level: patient
    prompt: Как повышенное давление влияет на развитие атеросклероза?
    options:
      - text: Замедляет его развитие
      - text: Никак не влияет на его развитие
      - text: Ускоряет его развитие
        correct: true
    explanation: Повышенное давление ускоряет развитие атеросклероза, а тяжёлая или многолетняя гипертензия повышает риск ишемической болезни сердца и инфаркта миокарда.
    cite: [5]
  - level: patient
    prompt: Какое изменение дыхания, по статье, служит поводом вызвать скорую?
    options:
      - text: Однократное чихание после уборки пыли
      - text: Одышка резко усилилась
        correct: true
      - text: Частая зевота поздним вечером
    explanation: Если одышка резко усилилась, особенно в покое или лёжа, или появились приступы удушья, вызывайте скорую.
    cite: [2]
  - level: student
    prompt: Что, по MSD, в конечном итоге может произойти с гипертрофированным левым желудочком?
    options:
      - text: Он может дилатироваться с развитием дилатационной кардиомиопатии и СН
        correct: true
      - text: Клапаны желудочка могут со временем срастись в одну плотную пластину из хряща
      - text: Мышца желудочка со временем замещается тканью обоих предсердий сердца
    explanation: Повышение постнагрузки ведёт к постепенной гипертрофии левого желудочка и диастолической дисфункции; в конечном итоге желудочек может дилатироваться с развитием дилатационной кардиомиопатии и СН.
    cite: [5]
  - level: student
    prompt: На что, по ESC, указывает поражение органов, вызванное гипертензией?
    options:
      - text: На недавнюю вирусную инфекцию миокарда и перикарда
      - text: На наследственное нарушение ионных каналов клеток сердца
      - text: На длительную или тяжёлую АГ с повышенным риском
        correct: true
    explanation: По ESC, поражение органов, вызванное гипертензией, указывает на длительную или тяжёлую АГ и ассоциировано с повышенным сердечно-сосудистым риском.
    cite: [4]
