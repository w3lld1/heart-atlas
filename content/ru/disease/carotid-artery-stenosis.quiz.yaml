questions:
  - level: patient
    prompt: Какова главная опасность сужения сонной артерии?
    options:
      - text: Перелом шейных позвонков
      - text: Ишемический инсульт
        correct: true
      - text: Воспаление щитовидной железы
    explanation: Главная опасность сужения — ишемический инсульт.
    cite: [7]
  - level: patient
    prompt: Какой признак характерен для сужения сонной артерии?
    options:
      - text: Зуд и покраснение кожи на передней поверхности шеи по вечерам
      - text: Боль в коленях при подъёме по лестнице
      - text: Внезапная безболезненная потеря зрения на один глаз
        correct: true
    explanation: Характерный признак сужения сонной артерии — внезапная безболезненная потеря зрения на один глаз.
    cite: [2, 4]
  - level: patient
    prompt: Почему в заключении указывают, каким способом рассчитано сужение?
    options:
      - text: Два способа дают для одного сужения разные цифры
        correct: true
      - text: Способ расчёта нужен страховой компании для оплаты
      - text: Один из способов измеряет пульс, а не просвет артерии
    explanation: Есть два способа расчёта, NASCET и ECST, и для одного и того же сужения они дают разные цифры, поэтому в заключении должно быть указано, каким способом считали.
    cite: [2, 3]
  - level: patient
    prompt: В какой ситуации нужно сразу вызвать скорую помощь?
    options:
      - text: Человек пару раз чихнул, вытирая пыль с полки в комнате
      - text: Внезапно онемела рука, даже если это быстро прошло
        correct: true
      - text: Захотелось пить после долгой прогулки
    explanation: Немедленно вызывайте скорую, если внезапно появились слабость или онемение половины лица, руки или ноги, трудности с речью, нарушение зрения или потеря равновесия, — даже если симптом быстро прошёл.
    cite: [7]
  - level: student
    prompt: Вовлечение какой артерии вызывает ретинальную ТИА (amaurosis fugax)?
    options:
      - text: Правой коронарной артерии
      - text: Почечной артерии
      - text: Глазной артерии
        correct: true
    explanation: Ретинальная ТИА — преходящая безболевая монокулярная слепота без остаточных зрительных нарушений; она возникает при вовлечении глазной артерии.
    cite: [2, 4]
  - level: student
    prompt: Что лучше ультразвука показывает заднее (вертебробазилярное) кровоснабжение мозга?
    options:
      - text: МР- и КТ-ангиография
        correct: true
      - text: Суточное мониторирование ЭКГ
      - text: Измерение давления на плече
    explanation: МРА и КТА лучше ультразвука показывают заднее (вертебробазилярное) кровоснабжение.
    cite: [5]
