questions:
  - level: patient
    prompt: Откуда запускаются частые сокращения при желудочковой тахикардии?
    options:
      - text: Из аорты
      - text: Из клапанов сердца
      - text: Из желудочков
        correct: true
    explanation: 'ЖТ — нарушение ритма, при котором частые сокращения запускаются не из синусового узла, а из желудочков: ниже пучка Гиса, в его ветвях, волокнах Пуркинье или в мышце желудочков.'
    cite: [1, 3]
  - level: patient
    prompt: Чем опасна желудочковая тахикардия?
    options:
      - text: Ничем, это безобидный ритм
      - text: Она может перейти в фибрилляцию желудочков
        correct: true
    explanation: ЖТ опасна тем, что может перейти в фибрилляцию желудочков — одну из форм остановки сердца.
    cite: [2, 3]
  - level: patient
    prompt: Какие три симптома самые важные, чтобы пойти к врачу и обследоваться?
    options:
      - text: Сердцебиение, предобморочное состояние и обмороки
        correct: true
      - text: Боль в суставах, сыпь и зуд
      - text: Изжога, вздутие живота и тошнота
    explanation: Сердцебиение, предобморочное состояние и обмороки — три самых важных симптома, с которыми нужно идти к врачу и обследоваться.
    cite: [1]
  - level: patient
    prompt: Какова главная долгосрочная цель лечения ЖТ?
    options:
      - text: Только подавить аритмию
      - text: Предотвратить внезапную смерть
        correct: true
    explanation: Главная долгосрочная цель — не просто подавить аритмию, а предотвратить внезапную смерть.
    cite: [2, 3]
  - level: student
    prompt: Как следует считать любую тахикардию с широкими QRS?
    options:
      - text: ЖТ, пока не доказано иное
        correct: true
      - text: Наджелудочковой, если гемодинамика стабильна
    explanation: Любую тахикардию с широкими QRS следует считать ЖТ, пока не доказано иное; считать её наджелудочковой только потому, что гемодинамика стабильна, — распространённая ошибка.
    cite: [1, 2]
  - level: student
    prompt: Что служит целью катетерной абляции при ЖТ на фоне рубца?
    options:
      - text: Аортальный клапан
      - text: Критический перешеек круга ри-ентри
        correct: true
    explanation: При ЖТ на фоне рубца целью катетерной абляции служит критический перешеек круга ри-ентри.
    cite: [1]
