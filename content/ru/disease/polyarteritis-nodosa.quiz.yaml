questions:
  - level: patient
    prompt: Какие сосуды поражает узелковый полиартериит?
    options:
      - text: Только вены, а артерии остаются здоровыми
      - text: Артерии; вены болезнь не затрагивает
        correct: true
      - text: Только лимфатические сосуды
    explanation: Поражаются артерии, вены болезнь не затрагивает.
    cite: [1]
  - level: patient
    prompt: Что происходит, если поражённую ветвь артерии закрывает тромб?
    options:
      - text: Орган за ней начинает получать больше крови
      - text: Артерия за ней превращается в вену
      - text: Участок органа за ней погибает (инфаркт)
        correct: true
    explanation: Если в поражённой ветви образуется тромб и она закрывается, участок органа за ней погибает (инфаркт).
    cite: [1]
  - level: patient
    prompt: Какова цель лечения узелкового полиартериита?
    options:
      - text: Период без проявлений болезни (ремиссия)
        correct: true
      - text: Перенести воспаление из стенок артерий на вены
      - text: Усилить воспаление в стенках артерий
    explanation: Цель лечения — добиться периода без проявлений болезни (ремиссии).
    cite: [2]
  - level: patient
    prompt: При каком из этих признаков статья советует вызвать скорую?
    options:
      - text: Лёгкий насморк, который прошёл за один день
      - text: Сухость кожи рук в холодную погоду
      - text: Внезапная сильная боль в животе
        correct: true
    explanation: Вызывайте скорую по номеру 103 или 112 при внезапной сильной боли в животе и при сильной боли в пояснице с кровью в моче.
    cite: [1]
  - level: student
    prompt: Что выявляет ангиография при узелковом полиартериите?
    options:
      - text: Тромбы только в поверхностных венах голеней
      - text: Мешотчатые или веретенообразные аневризмы и стенозы
        correct: true
      - text: Отложения кальция в створках клапанов сердца и аорты
    explanation: Ангиография выявляет мешотчатые или веретенообразные аневризмы и стенозы брыжеечных, печёночных и почечных артерий и их ветвей.
    cite: [6]
  - level: student
    prompt: К чему может привести васкулит брыжеечных артерий?
    options:
      - text: К разрастанию костной ткани черепа и позвоночника
      - text: К помутнению хрусталика глаза
      - text: К мальабсорбции и перфорации кишки
        correct: true
    explanation: Васкулит брыжеечных артерий может вызвать мальабсорбцию и перфорацию кишки.
    cite: [1]
