questions:
  - level: patient
    prompt: Откуда чаще всего приходит тромб, который закупоривает лёгочные артерии при ТЭЛА?
    options:
      - text: Из сосудов головного мозга
      - text: Из глубоких вен ноги
        correct: true
      - text: Из коронарных артерий сердца
    explanation: При ТЭЛА тромб, который образовался в другом месте, закупоривает лёгочные артерии; чаще всего он приходит из глубоких вен ноги.
    cite: [2, 3]
  - level: patient
    prompt: Что означает нормальный результат анализа крови на D-димер?
    options:
      - text: ТЭЛА маловероятна
        correct: true
      - text: ТЭЛА точно подтверждена
      - text: Тромб уже растворился сам
    explanation: Нормальный D-димер делает ТЭЛА маловероятной, а повышенный сам по себе её не подтверждает.
    cite: [2]
  - level: patient
    prompt: Какое исследование главное при подозрении на ТЭЛА?
    options:
      - text: Анализ мочи
      - text: Измерение температуры тела
      - text: КТ лёгочных артерий с контрастом (КТ-ангиография)
        correct: true
    explanation: Главное исследование — компьютерная томография лёгочных артерий с контрастом (КТ-ангиография).
    cite: [2]
  - level: patient
    prompt: При каких признаках статья советует вызывать скорую?
    options:
      - text: Только при повышенной температуре
      - text: При одышке, боли в груди, кровохарканье, предобморочном состоянии или обмороке
        correct: true
      - text: Скорая при ТЭЛА не нужна, достаточно планового визита
    explanation: Вызывайте скорую, если появились одышка, боль в груди, кровохарканье, предобморочное состояние или обморок. ТЭЛА опасна для жизни.
    cite: [2, 3]
  - level: student
    prompt: Что входит в триаду Вирхова?
    options:
      - text: Гиперкоагуляция, венозный стаз, повреждение эндотелия
        correct: true
      - text: Гипокоагуляция, ускорение венозного кровотока, целый эндотелий
      - text: Лихорадка, сыпь, боль в суставах
    explanation: Механизм тромбообразования описывает триада Вирхова — гиперкоагуляция, венозный стаз и повреждение эндотелия.
    cite: [3]
  - level: student
    prompt: Что считается основной причиной смерти при тяжёлой ТЭЛА?
    options:
      - text: Разрыв аорты
      - text: Недостаточность правого желудочка из-за острой перегрузки давлением
        correct: true
      - text: Гипогликемия
    explanation: Недостаточность ПЖ из-за острой перегрузки давлением считается основной причиной смерти при тяжёлой ТЭЛА.
    cite: [2]
