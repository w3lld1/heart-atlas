questions:
  - level: patient
    prompt: Что происходит с перикардом при констриктивном перикардите?
    options:
      - text: Он истончается и постепенно исчезает
      - text: Он становится толстым и жёстким
        correct: true
      - text: Он наполняется воздухом
    explanation: Листки перикарда утолщаются и обызвествляются, перикард становится толстым и жёстким, и это мешает камерам сердца нормально наполняться кровью.
    cite: [1, 3]
  - level: patient
    prompt: Какая причина констриктивного перикардита самая частая во всём мире?
    options:
      - text: Туберкулёзный перикардит
        correct: true
      - text: Перелом рёбер в детстве
      - text: Пищевая аллергия у взрослых
    explanation: В странах с развитой медициной констрикции чаще всего предшествуют перикардит без установленной причины или вирусный, операции на сердце и лучевая терапия; во всём мире самая частая причина — туберкулёзный перикардит.
    cite: [3]
  - level: patient
    prompt: С чем связаны основные признаки констриктивного перикардита?
    options:
      - text: С резким повышением сахара в крови
      - text: С воспалением коленных суставов
      - text: С застоем крови в венах
        correct: true
    explanation: Основные признаки связаны с застоем крови в венах — набухшие вены на шее, увеличенная печень, жидкость в животе (асцит) и отёки ног.
    cite: [3]
  - level: patient
    prompt: Какая операция — единственный способ устранить стойкую констрикцию?
    options:
      - text: Замена аортального клапана
      - text: Перикардэктомия
        correct: true
      - text: Шунтирование коронарных артерий
    explanation: Если сдавление сохраняется, проводят перикардэктомию — операцию, при которой утолщённый перикард удаляют. Это единственный способ устранить стойкую констрикцию.
    cite: [1, 2]
  - level: student
    prompt: Что при осмотре называют симптомом Куссмауля?
    options:
      - text: Шейные вены спадаются в покое
      - text: Рост венозного давления на вдохе
        correct: true
      - text: Исчезновение пульса на каждом выдохе
    explanation: При осмотре шейные вены расширены и венозное давление растёт на вдохе (симптом Куссмауля), чего нет при тампонаде.
    cite: [3]
  - level: student
    prompt: Как на вдохе меняется скорость диастолического митрального кровотока при констриктивном перикардите?
    options:
      - text: Совсем не меняется при дыхании
      - text: Растёт более чем вдвое
      - text: Падает более чем на 25%
        correct: true
    explanation: На вдохе скорость диастолического митрального кровотока обычно падает более чем на 25% при констриктивном перикардите и менее чем на 15% при рестриктивной кардиомиопатии.
    cite: [3]
