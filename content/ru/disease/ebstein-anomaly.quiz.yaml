questions:
  - level: patient
    prompt: Что происходит с сердцем при аномалии Эбштейна?
    options:
      - text: Сужается аортальный клапан
      - text: Створки трёхстворчатого клапана смещены вниз, к верхушке правого желудочка
        correct: true
      - text: Закупоривается коронарная артерия
    explanation: При аномалии Эбштейна створки трёхстворчатого клапана сформированы неправильно и смещены вниз, к верхушке правого желудочка.
    cite: [2, 3]
  - level: patient
    prompt: Может ли человек с лёгкой формой порока долго не знать о болезни?
    options:
      - text: Да, десятилетиями
        correct: true
      - text: Нет, лёгкая форма всегда видна сразу после рождения
    explanation: При лёгкой форме человек может десятилетиями не знать о болезни.
    cite: [2]
  - level: patient
    prompt: Что делают при «конусной реконструкции»?
    options:
      - text: Ставят стент в коронарную артерию
      - text: Из створок формируют клапан в виде конуса и прикрепляют его к кольцу клапана
        correct: true
    explanation: При конусной реконструкции из створок формируют клапан в виде конуса и прикрепляют его к настоящему кольцу клапана.
    cite: [1, 3]
  - level: patient
    prompt: Как долго нужно наблюдаться у кардиолога при аномалии Эбштейна?
    options:
      - text: Только до операции
      - text: Только в первый год жизни
      - text: Всю жизнь, в том числе после операции
        correct: true
    explanation: Наблюдаться у кардиолога нужно всю жизнь, в том числе после операции; взрослым — в центрах, где лечат взрослых с врождёнными пороками сердца.
    cite: [1, 2]
  - level: student
    prompt: Какой метод — золотой стандарт оценки объёма и функции ПЖ при АЭ?
    options:
      - text: МРТ сердца
        correct: true
      - text: Коронарография
    explanation: МРТ — золотой стандарт оценки объёма и функции ПЖ.
    cite: [1]
  - level: student
    prompt: Какой зубец P обычно бывает при АЭ?
    options:
      - text: Низкий и уплощённый
      - text: Высокий и заострённый («гималайский»)
        correct: true
    explanation: Зубец P обычно высокий и заострённый («гималайский»).
    cite: [1]
