questions:
  - level: patient
    prompt: Где скапливается кровь при интрамуральной гематоме аорты?
    options:
      - text: В просвете артерий, которые питают само сердце
      - text: В среднем слое стенки аорты
        correct: true
      - text: Во втором, ложном просвете за отслоённым лоскутом
    explanation: Интрамуральная гематома аорты — скопление крови в среднем слое стенки аорты, когда нет явного надрыва внутреннего слоя и нет ложного просвета.
    cite: [2, 3]
  - level: patient
    prompt: Как ставят диагноз интрамуральной гематомы?
    options:
      - text: По снимкам аорты (КТ-ангиография, МРТ или ЭхоКГ)
        correct: true
      - text: Только по анализу крови, без каких-либо снимков аорты
      - text: По записи ЭКГ, а снимки аорты для этого не делают совсем
    explanation: Диагноз ставят по снимкам — компьютерной томографии аорты с контрастом (КТ-ангиографии), МРТ или эхокардиографии.
    cite: [2, 3]
  - level: patient
    prompt: С чего начинают лечение интрамуральной гематомы?
    options:
      - text: Сначала несколько недель соблюдают диету, а лечат потом
      - text: Сначала выписывают домой и назначают плановый осмотр
      - text: Обезболивают и снижают давление
        correct: true
    explanation: Лечение начинают сразу, обычно в отделении интенсивной терапии — обезболивают и снижают давление, чтобы уменьшить нагрузку на стенку аорты.
    cite: [1, 2, 3]
  - level: patient
    prompt: При каком признаке нужно вызывать скорую?
    options:
      - text: Лёгкий насморк без температуры и других жалоб
      - text: Внезапная сильная боль в груди или спине
        correct: true
      - text: Небольшая сухость кожи на руках после мытья посуды
    explanation: Вызывайте скорую при внезапной сильной боли в груди или спине.
    cite: [2]
  - level: student
    prompt: Что отличает ИМГ типа A от ИМГ типа B?
    options:
      - text: Тип A означает ложный просвет с током крови в нём
      - text: При типе A гематома бывает только в брюшной аорте
      - text: При типе A вовлечена восходящая аорта
        correct: true
    explanation: Классификация та же, что и при расслоении — тип A вовлекает восходящую аорту, тип B её не затрагивает.
    cite: [2, 3]
  - level: student
    prompt: Чем язвоподобное выпячивание при ИМГ отличается от ПАЯ?
    options:
      - text: Оно не связано с атеросклеротической бляшкой
        correct: true
      - text: Это другое название ПАЯ, разницы между ними нет никакой
      - text: Оно всегда возникает из изъязвлённой атеросклеротической бляшки
    explanation: Язвоподобное выпячивание (ulcer-like projection) при ИМГ — не то же, что ПАЯ — оно не связано с атеросклеротической бляшкой.
    cite: [2, 3]
