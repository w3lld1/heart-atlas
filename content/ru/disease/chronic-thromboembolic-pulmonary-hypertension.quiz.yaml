questions:
  - level: patient
    prompt: Что происходит с лёгочными артериями при ХТЭЛГ?
    options:
      - text: Они расширяются, и кровь по ним течёт свободнее
      - text: Ветви сужены или закрыты тромбами после ТЭЛА
        correct: true
      - text: Их полностью закрывают бляшки из холестерина
    explanation: При ХТЭЛГ ветви лёгочной артерии после тромбоэмболии остаются суженными или закрытыми организованными тромбами, а затем меняются и мелкие сосуды лёгких.
    cite: [1, 3]
  - level: patient
    prompt: Какой симптом ХТЭЛГ главный?
    options:
      - text: Сильная головная боль по утрам сразу после сна
      - text: Зудящая сыпь на коже голеней и стоп
      - text: Постепенно нарастающая одышка при нагрузке
        correct: true
    explanation: Симптомы ХТЭЛГ неспецифичны, а в начале болезни их может не быть. Главный симптом — одышка при нагрузке, которая нарастает постепенно.
    cite: [1, 2, 3]
  - level: patient
    prompt: Какое исследование — главный способ исключить ХТЭЛГ?
    options:
      - text: Вентиляционно-перфузионная сцинтиграфия лёгких
        correct: true
      - text: Анализ крови на уровень холестерина
      - text: Ультразвуковое исследование органов брюшной полости
    explanation: 'Главный способ исключить ХТЭЛГ — вентиляционно-перфузионная сцинтиграфия лёгких: если кровоснабжение лёгких на ней нормальное, ХТЭЛГ почти исключена.'
    cite: [1, 2]
  - level: patient
    prompt: Что делает хирург при лёгочной тромбэндартерэктомии?
    options:
      - text: Удаляет только свежий тромб, как при острой ТЭЛА
      - text: Заменяет лёгочный клапан искусственным
      - text: Удаляет плотные фиброзные массы из артерий
        correct: true
    explanation: 'Лёгочная тромбэндартерэктомия — не удаление свежего тромба, как при острой ТЭЛА: хирург отделяет от стенки и удаляет организованные фиброзные массы из ветвей обеих лёгочных артерий, вплоть до мелких ветвей.'
    cite: [1, 2, 3]
  - level: student
    prompt: Что без паренхиматозной болезни лёгких исключает ХТЭЛГ с отрицательной прогностической ценностью 98%?
    options:
      - text: Нормальная КТ-ангиография лёгочных артерий
      - text: Нормальная перфузионная сцинтиграфия
        correct: true
      - text: Нормальная ЭКГ в 12 отведениях
    explanation: 'При отсутствии паренхиматозной болезни лёгких нормальная перфузионная сцинтиграфия исключает ХТЭЛГ с отрицательной прогностической ценностью 98%. Нормальная КТ-ангиография ХТЭБЛ не исключает: дистальные поражения можно пропустить.'
    cite: [2]
  - level: student
    prompt: Какой диагноз ставят при посттромбоэмболических поражениях без прекапиллярной ЛГ?
    options:
      - text: ХТЭБЛ
        correct: true
      - text: ЛАГ
      - text: Острую ТЭЛА
    explanation: Если поражения есть, а прекапиллярной ЛГ нет, диагностируют хроническую тромбоэмболическую болезнь лёгких (ХТЭБЛ); ESC/ERS 2022 оставляет термин ХТЭЛГ для случаев с ЛГ.
    cite: [1, 2]
