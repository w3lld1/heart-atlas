questions:
  - level: patient
    prompt: Что самое характерное для боли при расслоении аорты?
    options:
      - text: Боль нарастает постепенно и сильнее всего через несколько часов
      - text: Внезапность — боль начинается резко
        correct: true
      - text: Боль слабая и почти незаметная
    explanation: Главный симптом — резко начавшаяся сильная боль в груди и/или в спине, иногда в животе. Боль сильнее всего в самом начале; самое характерное — внезапность.
    cite: [2, 3]
  - level: patient
    prompt: Кто чаще болеет расслоением аорты?
    options:
      - text: Мужчины, и с возрастом расслоение встречается чаще
        correct: true
      - text: Женщины, и с возрастом расслоение встречается реже
    explanation: Мужчины болеют чаще, и с возрастом расслоение встречается чаще.
    cite: [3]
  - level: patient
    prompt: Что верно про ЭКГ при расслоении аорты?
    options:
      - text: ЭКГ показывает расслоение и подтверждает диагноз
      - text: ЭКГ записывают, но само расслоение она не показывает
        correct: true
    explanation: ЭКГ записывают, но само расслоение она не показывает.
    cite: [3, 4]
  - level: patient
    prompt: Что нужно при расслоении типа A, когда затронута восходящая аорта?
    options:
      - text: Срочная операция
        correct: true
      - text: Операция не нужна, расслоение проходит само
    explanation: Без лечения расслоение восходящей аорты крайне опасно. При расслоении типа A, когда затронута восходящая аорта, нужна срочная операция.
    cite: [1, 2]
  - level: student
    prompt: Чем по Стэнфордской классификации тип A отличается от типа B?
    options:
      - text: Тип определяется только местом первичного разрыва интимы
      - text: Тип B вовлекает восходящую аорту, тип A её не затрагивает
      - text: Тип A вовлекает восходящую аорту, тип B её не затрагивает
        correct: true
    explanation: По Стэнфордской классификации тип A вовлекает восходящую аорту независимо от места первичного разрыва интимы, тип B восходящую аорту не затрагивает.
    cite: [2, 3]
