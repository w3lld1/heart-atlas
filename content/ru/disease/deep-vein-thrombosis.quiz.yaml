questions:
  - level: patient
    prompt: Какое осложнение тромбоза глубоких вен самое опасное?
    options:
      - text: Воспаление кожи (целлюлит)
      - text: Тромбоэмболия лёгочной артерии (ТЭЛА)
        correct: true
      - text: Перелом кости ноги
    explanation: 'Самое опасное осложнение ТГВ — ТЭЛА: часть тромба отрывается и с током крови через сердце попадает в лёгкие.'
    cite: [1, 5]
  - level: patient
    prompt: Что делают антикоагулянты с уже образовавшимся тромбом?
    options:
      - text: Сразу полностью растворяют его
      - text: Делают его твёрже, чтобы он не оторвался
      - text: Не растворяют, но не дают ему расти и мешают образоваться новым
        correct: true
    explanation: Антикоагулянты не растворяют уже образовавшийся тромб, но не дают ему расти и мешают образоваться новым.
    cite: [5]
  - level: patient
    prompt: Если вероятность ТГВ невысокая, что означает нормальный результат анализа на D-димер?
    options:
      - text: ТГВ можно с большой вероятностью исключить
        correct: true
      - text: Тромбоз точно есть
      - text: Нужна срочная операция на вене
    explanation: Нормальный D-димер позволяет с большой вероятностью исключить ТГВ, а повышенный тромбоз не доказывает, и тогда нужно УЗИ.
    cite: [1, 4]
  - level: patient
    prompt: При каких признаках нужно вызвать скорую, потому что так может проявляться ТЭЛА?
    options:
      - text: Лёгкая усталость в ногах к вечеру
      - text: Одышка, боль в груди, кашель с кровью, обморок
        correct: true
      - text: Небольшой синяк после ушиба
    explanation: Вызывайте скорую, если появились одышка, боль в груди, кашель с кровью, предобморочное состояние или обморок — так может проявляться ТЭЛА.
    cite: [1, 5]
  - level: student
    prompt: Что входит в триаду Вирхова?
    options:
      - text: Лихорадка, тахикардия и гипотония
      - text: Гипертрофия, фиброз и кальциноз
      - text: Стаз, повреждение эндотелия и гиперкоагуляция
        correct: true
    explanation: Классически тромбоз объясняют триадой Вирхова — замедление кровотока (стаз), повреждение эндотелия и гиперкоагуляция.
    cite: [1, 4]
  - level: student
    prompt: Какой ТГВ называют дистальным?
    options:
      - text: Тромбоз глубоких вен голени без распространения на подколенную вену
        correct: true
      - text: Тромбоз нижней полой вены
      - text: Тромбоз подвздошных вен
    explanation: Дистальный ТГВ — тромбоз глубоких вен голени без распространения на подколенную вену; тромбоз в подколенной, бедренной, подвздошных венах или нижней полой вене относят к проксимальному.
    cite: [1]
