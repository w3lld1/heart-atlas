questions:
  - level: patient
    prompt: Что такое синдром Лойса — Дитца, по статье?
    options:
      - text: Инфекция клапанов сердца, вызванная бактериями
      - text: Наследственное заболевание соединительной ткани
        correct: true
      - text: Болезнь, которую вызывают курение и высокий холестерин
    explanation: Синдром Лойса — Дитца — наследственное заболевание соединительной ткани.
    cite: [1]
  - level: patient
    prompt: Зачем при этом синдроме назначают лекарства?
    options:
      - text: Чтобы снизить нагрузку кровотока на стенку аорты
        correct: true
      - text: Чтобы исправить изменённый ген в клетках организма
      - text: Чтобы кожа стала плотнее и вены на ней были не видны
    explanation: Лекарства назначают, чтобы снизить нагрузку кровотока на стенку аорты; какие препараты нужны, решает врач.
    cite: [1]
  - level: patient
    prompt: Как при первом обследовании осматривают всю аорту и её ветви от головы до таза?
    options:
      - text: Измеряют давление тонометром на плече
      - text: Выслушивают сердце стетоскопом
      - text: С помощью КТ или МРТ
        correct: true
    explanation: При первом обследовании всю аорту и её ветви от головы до таза осматривают с помощью КТ или МРТ, чтобы найти аневризмы, расслоения и извитость артерий.
    cite: [1, 2, 3]
  - level: patient
    prompt: Какая боль, по статье, — повод сразу вызвать скорую?
    options:
      - text: Лёгкая ноющая боль в мышцах ног после долгой прогулки
      - text: Резко начавшаяся сильная боль в груди или спине
        correct: true
      - text: Кратковременное покалывание в пальцах рук на холоде
    explanation: Скорую вызывают при резко начавшейся сильной боли в груди или спине (иногда в животе), особенно если она сильнее всего в первый момент.
    cite: [1]
  - level: student
    prompt: Как ещё называют болезнь, вызванную вариантами пяти генов этого синдрома?
    options:
      - text: Гигантоклеточный артериит
      - text: Атеросклеротическое поражение аорты
      - text: Васкулопатия, связанная с TGF-β
        correct: true
    explanation: Болезнь, вызванную вариантами этих пяти генов, называют также васкулопатией, связанной с трансформирующим фактором роста β (TGF-β).
    cite: [1]
  - level: student
    prompt: Почему при этом синдроме одной ЭхоКГ недостаточно?
    options:
      - text: Есть риск поражения аорты дальше корня и аневризм её ветвей
        correct: true
      - text: Ультразвук повреждает стенку расширенной аорты и её ветвей
      - text: При этом синдроме сердце смещено, и на УЗИ его не удаётся разглядеть
    explanation: Все гены синдрома несут риск поражения аорты дальше её корня, а также аневризм ветвей аорты и внутричерепных артерий, поэтому одной ЭхоКГ недостаточно.
    cite: [1]
