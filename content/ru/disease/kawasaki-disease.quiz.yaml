questions:
  - level: patient
    prompt: Что без лечения развивается примерно у четверти детей с болезнью Кавасаки?
    options:
      - text: Сужение клапана аорты, которое было с рождения
      - text: Расширение или аневризмы коронарных артерий
        correct: true
      - text: Доброкачественная опухоль сердечной мышцы и клапанов
    explanation: Без лечения расширение или аневризмы коронарных артерий развиваются примерно у четверти детей.
    cite: [2, 3]
  - level: patient
    prompt: Как ставят диагноз болезни Кавасаки?
    options:
      - text: По одному специальному анализу крови на болезнь Кавасаки
      - text: По генетическому анализу, сделанному при рождении
      - text: 'По признакам болезни: специального анализа нет'
        correct: true
    explanation: 'Специального анализа на болезнь Кавасаки нет: диагноз ставят по признакам болезни.'
    cite: [4, 5]
  - level: patient
    prompt: Зачем при подозрении на болезнь Кавасаки делают УЗИ сердца?
    options:
      - text: Чтобы найти аневризмы коронарных артерий
        correct: true
      - text: Чтобы измерить размеры печени и селезёнки ребёнка
      - text: Чтобы определить группу крови ребёнка
    explanation: При подозрении на болезнь Кавасаки делают ЭКГ и УЗИ сердца (эхокардиографию), чтобы найти аневризмы коронарных артерий, недостаточность клапанов, перикардит или миокардит.
    cite: [5]
  - level: patient
    prompt: Что даёт лечение в первые 10 дней болезни?
    options:
      - text: Навсегда защищает ребёнка от любых простуд
      - text: Заметно ускоряет рост и прибавку веса ребёнка в ближайший год
      - text: Заметно снижает риск повреждения коронарных артерий
        correct: true
    explanation: 'Лечение начинают как можно раньше: лечение в первые 10 дней болезни заметно снижает риск повреждения коронарных артерий.'
    cite: [5]
  - level: student
    prompt: Когда обычно начинаются изменения сердца при болезни Кавасаки?
    options:
      - text: Во внутриутробном периоде, задолго до рождения ребёнка
      - text: В подострой фазе, примерно через 1–4 недели от начала
        correct: true
      - text: Только через 10–20 лет после выздоровления
    explanation: Изменения сердца обычно начинаются в подострой фазе, примерно через 1–4 недели от начала болезни, когда сыпь и лихорадка уже стихают, но возможны и в острой фазе.
    cite: [4]
  - level: student
    prompt: Чем сильнее всего грозят гигантские аневризмы коронарных артерий?
    options:
      - text: Тромбозом, инфарктом и тампонадой сердца
        correct: true
      - text: Врождённой глухотой и потерей зрения у ребёнка
      - text: Переломами костей и вывихами крупных суставов
    explanation: Гигантские аневризмы редки, но сильнее всего грозят тромбозом, инфарктом и тампонадой сердца.
    cite: [4]
