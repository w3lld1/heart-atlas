questions:
  - level: patient
    prompt: Что верно о саркоидозе?
    options:
      - text: Это заразная инфекция
      - text: Это не заразная болезнь
        correct: true
      - text: Это разновидность туберкулёза
      - text: Это разновидность опухоли
    explanation: Саркоидоз не заразен, это не опухоль и не туберкулёз.
    cite: [1]
  - level: patient
    prompt: Какие органы саркоидоз поражает чаще всего?
    options:
      - text: Лёгкие и лимфатические узлы
        correct: true
      - text: Почки и мочевой пузырь
      - text: Только сердце
    explanation: Чаще всего саркоидоз поражает лёгкие и лимфатические узлы, но может затронуть любой орган, в том числе сердце.
    cite: [7]
  - level: patient
    prompt: В каких трёх формах обычно проявляется саркоидоз сердца?
    options:
      - text: Повышенный холестерин, сахарный диабет и избыточный вес
      - text: АВ-блокада, желудочковые нарушения ритма, слабость левого желудочка
        correct: true
      - text: Врождённые пороки клапанов сердца и крупных сосудов
    explanation: Обычно болезнь проявляется нарушением проведения импульса (АВ-блокадой), желудочковыми нарушениями ритма или ослаблением работы левого желудочка.
    cite: [2]
  - level: patient
    prompt: Какие обследования сердца российские рекомендации советуют всем с впервые выявленным саркоидозом?
    options:
      - text: Никаких, если нет жалоб на сердце
      - text: Только анализ мочи
      - text: ЭКГ и эхокардиографию
        correct: true
    explanation: Всем людям с впервые выявленным саркоидозом, какие бы органы ни были поражены, российские рекомендации советуют сделать ЭКГ и эхокардиографию.
    cite: [1]
  - level: student
    prompt: Какие гранулёмы образуются при саркоидозе?
    options:
      - text: Неказеифицирующиеся
        correct: true
      - text: Казеифицирующиеся
      - text: Гранулёмы при саркоидозе не образуются
    explanation: Саркоидоз — системное воспалительное заболевание неизвестной этиологии с образованием неказеифицирующихся гранулём и мультисистемным поражением.
    cite: [1]
  - level: student
    prompt: К какой группе причин брадиаритмий российские рекомендации относят саркоидоз?
    options:
      - text: К врождённым аномалиям проводящей системы
      - text: К инфильтративным процессам
        correct: true
      - text: К побочным эффектам лекарств
    explanation: В перечне причин брадиаритмий российские рекомендации относят саркоидоз к инфильтративным процессам вместе с амилоидозом и гемохроматозом.
    cite: [3]
