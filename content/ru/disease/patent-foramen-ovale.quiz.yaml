questions:
  - level: patient
    prompt: Что такое открытое овальное окно (ООО)?
    options:
      - text: Утолщение стенки левого желудочка от долгих нагрузок
      - text: Сужение клапана лёгочной артерии, впервые возникшее у взрослого
      - text: Щель между предсердиями, оставшаяся от кровообращения плода
        correct: true
    explanation: Открытое овальное окно — щель в перегородке между предсердиями, которая осталась от кровообращения плода.
    cite: [3, 7]
  - level: patient
    prompt: Чем, по статье, может быть опасно открытое овальное окно?
    options:
      - text: Тромб из вен может пройти в артерии и вызвать инсульт
        correct: true
      - text: Со временем окно разрушает клапан аорты
      - text: Из-за окна постепенно и заметно слабеет зрение у взрослых
    explanation: Через окно тромб из вен может попасть в артерии и вызвать инсульт.
    cite: [3]
  - level: patient
    prompt: Чем обязательно дополняют пузырьковую пробу при поиске ООО?
    options:
      - text: Глубоким сном накануне исследования
      - text: Натуживанием (приёмом Вальсальвы)
        correct: true
      - text: Холодным душем перед началом исследования
    explanation: Исследование с пузырьковой пробой обязательно дополняют натуживанием (пробой Вальсальвы).
    cite: [1]
  - level: patient
    prompt: При каких признаках статья велит немедленно вызвать скорую?
    options:
      - text: Ногти на руках стали расти заметно быстрее, чем обычно
      - text: Веснушки на носу и щеках стали заметнее после долгого солнечного лета
      - text: Внезапная слабость мышц лица или конечностей, трудности с речью
        correct: true
    explanation: Немедленно вызывайте скорую по номеру 103 или 112, если внезапно появились слабость мышц лица или конечностей, особенно на одной половине тела, онемение, трудности с речью или её пониманием, потеря сознания.
    cite: [1]
  - level: student
    prompt: Что такое ESUS по определению российских рекомендаций?
    options:
      - text: Временное нарушение зрения при мигрени с аурой
      - text: Нелакунарный инсульт без явного источника эмболии после обследования
        correct: true
      - text: Кровоизлияние в мозг из-за разрыва аневризмы сосуда у пожилого человека
    explanation: ESUS — нелакунарный инсульт без очевидного источника эмболии после дообследования и исключения известных причин, в частности кардиоэмболии и атеросклероза проксимальнее зоны инсульта.
    cite: [1]
  - level: student
    prompt: Что на ЭхоКГ отличает ООО от вторичного ДМПП?
    options:
      - text: Заслонка первичной перегородки и косой сброс
        correct: true
      - text: Утолщённые створки трёхстворчатого клапана
      - text: Расширенный корень аорты и выпот в полости перикарда
    explanation: На ЭхоКГ вторичный ДМПП отличают от ООО — при ООО рядом видна заслонка первичной перегородки, а сброс в режиме цветового допплера идёт косо.
    cite: [2]
