questions:
  - level: patient
    prompt: Что обычно происходит со створками, когда развивается двустворчатый клапан?
    options:
      - text: Две из трёх створок срастаются
        correct: true
      - text: Вырастает дополнительная четвёртая створка
      - text: Все створки разрушает инфекция
    explanation: Во время развития клапана две из трёх створок обычно срастаются, и вместо трёх створок получаются две — одна бóльшая и одна меньшая.
    cite: [4]
  - level: patient
    prompt: Что, кроме самого клапана, у многих людей с ДАК расширяется?
    options:
      - text: Трахея
      - text: Желудок
      - text: Аорта
        correct: true
    explanation: Клапан может сужаться или неплотно закрываться, а у многих людей с ДАК расширяется аорта.
    cite: [1, 7]
  - level: patient
    prompt: Каким исследованием подтверждают диагноз ДАК?
    options:
      - text: Общим анализом крови и мочи
      - text: УЗИ сердца (эхокардиографией)
        correct: true
      - text: Измерением артериального давления на руке
    explanation: Врач может заподозрить ДАК, когда слышит шум или щелчок, а диагноз подтверждают с помощью УЗИ сердца (эхокардиографии).
    cite: [8]
  - level: patient
    prompt: Что советуют близким родственникам человека с ДАК?
    options:
      - text: Определить группу крови
      - text: Сдать анализ мочи
      - text: Сделать УЗИ сердца
        correct: true
    explanation: ДАК может передаваться по наследству. Близким родственникам — родителям, братьям и сёстрам, детям — советуют сделать УЗИ сердца, особенно если у человека с ДАК расширена аорта.
    cite: [1, 4, 8]
  - level: student
    prompt: Как часто, по ACC/AHA, ДАК встречается у пациентов с коарктацией аорты?
    options:
      - text: Примерно у половины
        correct: true
      - text: Ни у одного пациента
      - text: Примерно у 1 из 1000
    explanation: По ACC/AHA, ДАК есть примерно у половины пациентов с коарктацией аорты и примерно у 10% пациентов с синдромом Лойса — Дитца.
    cite: [1]
  - level: student
    prompt: Какой отдел аорты чаще всего поражается при ДАК?
    options:
      - text: Брюшная аорта
      - text: Восходящая аорта
        correct: true
      - text: Нижняя полая вена
    explanation: Чаще всего поражается восходящая аорта; частота дилатации в исследованиях — от 20 до 84% в зависимости от изученной группы и определения.
    cite: [1]
