questions:
  - level: patient
    prompt: Что происходит со стенками желудочков при рестриктивной кардиомиопатии?
    options:
      - text: Стенки становятся жёсткими и плохо наполняются кровью между сокращениями
        correct: true
      - text: Сужается аортальный клапан
      - text: Закупориваются коронарные артерии
    explanation: При РКМП стенки желудочков становятся жёсткими, но не обязательно утолщёнными, и плохо наполняются кровью между сокращениями.
    cite: [4]
  - level: patient
    prompt: Удаётся ли найти конкретную причину РКМП?
    options:
      - text: Да, причина известна всегда
      - text: Больше чем в половине случаев причину найти не удаётся
        correct: true
    explanation: Больше чем в половине случаев конкретную причину найти не удаётся.
    cite: [4]
  - level: patient
    prompt: Когда при РКМП обычно появляются симптомы?
    options:
      - text: В покое, а при нагрузке проходят
      - text: При нагрузке
        correct: true
    explanation: Симптомы появляются при нагрузке, когда давление в жёстком сердце быстро растёт и оно не успевает перекачать столько крови, сколько нужно.
    cite: [4]
  - level: patient
    prompt: Что показывает УЗИ сердца при РКМП?
    options:
      - text: Уменьшенные предсердия
      - text: Сужение аортального клапана
      - text: Увеличенные предсердия
        correct: true
    explanation: 'УЗИ сердца показывает увеличенные предсердия: сердце может сокращаться нормально, но мышца жёсткая и не наполняется кровью в достаточной мере.'
    cite: [4]
  - level: student
    prompt: От чего зависит сердечный выброс при РКМП?
    options:
      - text: От ЧСС, так как ударный объём относительно фиксирован
        correct: true
      - text: От ударного объёма, который легко растёт при нагрузке
    explanation: Ударный объём часто относительно фиксирован, поэтому сердечный выброс зависит от ЧСС.
    cite: [3]
  - level: student
    prompt: На какое заболевание очень похожа клиническая картина РКМП?
    options:
      - text: Аортальный стеноз
      - text: Констриктивный перикардит
        correct: true
      - text: Бронхиальная астма
    explanation: Клиническая картина РКМП очень похожа на констриктивный перикардит — поражение перикарда.
    cite: [3]
