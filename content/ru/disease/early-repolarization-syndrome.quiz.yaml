questions:
  - level: patient
    prompt: Что такое синдром ранней реполяризации?
    options:
      - text: Воспаление наружной оболочки лёгких
      - text: Генетическое нарушение работы ионных каналов клеток сердца
        correct: true
      - text: Закупорка крупных артерий обеих ног жировыми бляшками у пожилых
    explanation: Синдром ранней реполяризации — генетическое нарушение работы ионных каналов клеток сердца (каналопатия).
    cite: [1, 2, 3]
  - level: patient
    prompt: К каким опасным аритмиям склонно сердце при этом синдроме?
    options:
      - text: К желудочковой тахикардии и фибрилляции желудочков
        correct: true
      - text: 'Ни к каким: ритм сердца при этом синдроме не меняется'
      - text: К замедлению сердца, которое бывает во время глубокого ночного сна
    explanation: Из-за нарушения работы ионных каналов сердце склонно к опасным аритмиям — желудочковой тахикардии и фибрилляции желудочков.
    cite: [3]
  - level: patient
    prompt: По российским рекомендациям, при чём во время приступа аритмии нужно вызывать скорую?
    options:
      - text: При короткой икоте после еды
      - text: При лёгком зуде кожи на руках
      - text: При потере сознания
        correct: true
    explanation: Российские рекомендации советуют вызывать скорую помощь, если приступ аритмии сопровождается головокружением, слабостью, предобморочным состоянием, потерей сознания или учащённым сердцебиением.
    cite: [2]
  - level: patient
    prompt: Что рекомендуется людям рядом при остановке сердца вне больницы?
    options:
      - text: Спокойно ждать, пока человек сам придёт в себя
      - text: Прежде всего дать человеку выпить стакан воды
      - text: Сразу начать сердечно-лёгочную реанимацию
        correct: true
    explanation: При остановке сердца вне больницы рекомендуется, чтобы оказавшиеся рядом люди сразу начали сердечно-лёгочную реанимацию.
    cite: [1]
  - level: student
    prompt: К какой группе российские рекомендации относят синдром ранней реполяризации?
    options:
      - text: К приобретённым порокам клапанов сердца после перенесённой инфекции
      - text: К врождённым каналопатиям без явного структурного заболевания сердца
        correct: true
      - text: К воспалительным болезням перикарда после перенесённой вирусной инфекции
    explanation: Российские рекомендации относят синдром ранней реполяризации желудочков к врождённым синдромам (каналопатиям), при которых желудочковые аритмии возникают без явного структурного заболевания сердца.
    cite: [2]
  - level: student
    prompt: В какую группу объединяют синдром ранней реполяризации и синдром Бругада?
    options:
      - text: В пороки створок аортального клапана
      - text: В болезни околосердечной сумки
      - text: В синдромы волны J
        correct: true
    explanation: Синдром ранней реполяризации и синдром Бругада объединяют в синдромы волны J.
    cite: [3]
