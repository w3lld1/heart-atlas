questions:
  - level: patient
    prompt: Что такое пролапс митрального клапана?
    options:
      - text: Сужение аортального клапана, из-за которого кровь с трудом выходит в аорту
      - text: Прогибание створок митрального клапана в левое предсердие
        correct: true
      - text: Врождённое отверстие в перегородке между левым и правым предсердием
    explanation: Пролапс митрального клапана (ПМК) — это прогибание створок митрального клапана в левое предсердие во время сокращения левого желудочка (систолы).
    cite: [5, 6]
  - level: patient
    prompt: Как часто встречается ПМК?
    options:
      - text: Примерно у 2,4% людей
        correct: true
      - text: Примерно у одного человека на миллион
      - text: Почти у каждого человека старше 50 лет
    explanation: ПМК встречается часто, примерно у 2,4% людей.
    cite: [1, 5]
  - level: patient
    prompt: Что самая частая причина ПМК?
    options:
      - text: Атеросклероз артерий, которые питают сердце
      - text: Травма грудной клетки, например при падении
      - text: Миксоматозная дегенерация клапана
        correct: true
    explanation: Самая частая причина ПМК — миксоматозная дегенерация клапана. Створки увеличиваются и становятся растяжимыми, а хорды удлиняются и истончаются.
    cite: [5]
  - level: patient
    prompt: Как подтверждают диагноз ПМК?
    options:
      - text: Только по форме грудной клетки, без обследований
      - text: С помощью УЗИ сердца, эхокардиографии
        correct: true
      - text: Только по жалобам человека на сердцебиение
    explanation: Диагноз подтверждают с помощью УЗИ сердца (эхокардиографии). Форма грудной клетки сама по себе не позволяет поставить диагноз.
    cite: [5, 6]
  - level: student
    prompt: Что происходит со щелчком и шумом при ПМК, когда размер ЛЖ уменьшается (стоя, проба Вальсальвы)?
    options:
      - text: Щелчок ближе к I тону, шум громче и дольше
        correct: true
      - text: Щелчок запаздывает, а систолический шум укорачивается
      - text: Щелчок и шум не меняются при перемене положения тела
    explanation: Когда размер ЛЖ уменьшается (сидя, стоя, при пробе Вальсальвы), щелчок смещается к I тону, а шум появляется или становится громче и продолжительнее. При приседании щелчок запаздывает, а шум укорачивается; не смещается при перемене положения щелчок врождённого аортального стеноза.
    cite: [1, 5]
  - level: student
    prompt: Что такое дизъюнкция митрального кольца (MAD)?
    options:
      - text: Сращение створок митрального клапана по обеим комиссурам
      - text: Разрыв хорды, из-за которого край створки свободно болтается
      - text: Частичное отделение кольца от миокарда желудочка в систолу
        correct: true
    explanation: Дизъюнкция митрального кольца (MAD) — частичное отделение кольца от миокарда желудочка в систолу. Её выявляют при ЭхоКГ по систолическому разделению кольца и миокарда желудочка в задне-боковом отделе.
    cite: [5]
