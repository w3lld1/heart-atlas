questions:
  - level: patient
    prompt: Что такое ортостатическая гипотензия?
    options:
      - text: Воспаление стенок вен нижних конечностей
      - text: Врождённое сужение аортального клапана
      - text: Сильное падение давления при вставании
        correct: true
    explanation: Ортостатическая гипотензия — чрезмерное снижение артериального давления, когда человек встаёт или садится.
    cite: [5, 6]
  - level: patient
    prompt: После чего может появиться ортостатическая гипотензия?
    options:
      - text: После стрижки волос в парикмахерской
      - text: После долгого постельного режима
        correct: true
      - text: После долгого чтения книг вслух
    explanation: Ортостатическая гипотензия может появиться и после долгого постельного режима.
    cite: [5]
  - level: patient
    prompt: Что обычно происходит с дурнотой при ортостатической гипотензии, если лечь?
    options:
      - text: Быстро проходит
        correct: true
      - text: Сменяется приступом кашля
      - text: Переходит в зубную боль
    explanation: Дурнота, головокружение, спутанность мыслей и нечёткость зрения появляются в первые секунды или минуты после вставания и быстро проходят, если лечь.
    cite: [5]
  - level: patient
    prompt: С чем головокружение при вставании — повод вызвать скорую по номеру 103 или 112?
    options:
      - text: С сонливостью поздно вечером
      - text: С болью или дискомфортом в груди
        correct: true
      - text: С шелушением сухой кожи на локтях
    explanation: Вызывайте скорую, если головокружение при вставании сопровождается кровью в стуле или чёрным стулом, трудностями при ходьбе или нарушением равновесия, падением или обмороком, болью или дискомфортом в груди.
    cite: [6]
  - level: student
    prompt: Какая группа причин ОГ есть в классификации ESC наряду с лекарственной и нейрогенной?
    options:
      - text: Уменьшение объёма крови
        correct: true
      - text: Аллергическая реакция на пыльцу
      - text: Врождённый дальтонизм
    explanation: По классификации ESC, ОГ бывает лекарственной, связанной с уменьшением объёма циркулирующей крови (кровотечение, диарея, рвота) и нейрогенной.
    cite: [1]
  - level: student
    prompt: Для чего ESC рекомендует СМАД пациентам с вегетативной дисфункцией?
    options:
      - text: Для подбора очков для чтения и письма
      - text: Для проверки остроты слуха
      - text: Для выявления ночной гипертензии
        correct: true
    explanation: СМАД рекомендовано для выявления ночной гипертензии у пациентов с вегетативной дисфункцией, так как ОГ у них часто сочетается с недостаточным ночным снижением АД.
    cite: [1]
