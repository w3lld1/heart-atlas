questions:
  - level: patient
    prompt: Что происходит с сердцем при дилатационной кардиомиопатии (ДКМП)?
    options:
      - text: Левый желудочек расширяется и хуже сокращается
        correct: true
      - text: Сужается устье аорты
      - text: В перегородке между предсердиями появляется отверстие
    explanation: ДКМП — генетическое или приобретённое заболевание сердечной мышцы, при котором левый желудочек (или оба желудочка) расширяется и хуже сокращается.
    cite: [2]
  - level: patient
    prompt: Бывает ли ДКМП наследственной?
    options:
      - text: Нет, она никогда не передаётся в семье
      - text: Да, в 20–40% случаев болезнь семейная
        correct: true
      - text: Да, она всегда только наследственная
    explanation: ДКМП бывает наследственной — в 20–40% случаев болезнь семейная. Её могут вызвать и внешние причины.
    cite: [2, 3]
  - level: patient
    prompt: Какие симптомы обычно бывают при ДКМП, когда они есть?
    options:
      - text: Желтуха и зуд кожи
      - text: Насморк и чихание
      - text: Одышка, быстрая утомляемость, отёки голеней и лодыжек
        correct: true
    explanation: Когда симптомы есть, это обычно признаки сердечной недостаточности — одышка, одышка в положении лёжа, приступы одышки по ночам, быстрая утомляемость, отёки голеней и лодыжек.
    cite: [2, 3]
  - level: patient
    prompt: По каким принципам лечат ДКМП?
    options:
      - text: По тем же принципам, что и сердечную недостаточность
        correct: true
      - text: Сразу после диагноза делают пересадку сердца
      - text: Лечения не существует
    explanation: ДКМП лечат по тем же принципам, что и сердечную недостаточность. Пересадку сердца рассматривают, если болезнь не отвечает на всё доступное лечение.
    cite: [3]
  - level: student
    prompt: Какое снижение фракции выброса ЛЖ — критерий ДКМП по российским рекомендациям?
    options:
      - text: Значительное (≤40%) или умеренное (41–49%)
        correct: true
      - text: Фракция выброса при ДКМП не снижается
    explanation: Один из критериев ДКМП по российским рекомендациям — значительное (≤40%) или умеренное (41–49%) снижение фракции выброса левого желудочка.
    cite: [2]
  - level: student
    prompt: Как часто встречается внезапная сердечная смерть при ДКМП?
    options:
      - text: 'Не встречается: такого осложнения при ДКМП нет'
      - text: Примерно у 12% пациентов
        correct: true
      - text: У всех пациентов
    explanation: Внезапная сердечная смерть встречается примерно у 12% пациентов с ДКМП.
    cite: [2]
