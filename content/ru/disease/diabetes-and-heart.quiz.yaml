questions:
  - level: patient
    prompt: Что в статье называют атеросклерозом?
    options:
      - text: Воспаление клапанов сердца из-за инфекции
      - text: Отложение бляшек в стенке артерий
        correct: true
      - text: Растяжение сердечной мышцы после нагрузки
    explanation: Атеросклероз — отложение бляшек в стенке артерий; при диабете он начинается в более молодом возрасте, чем без диабета.
    cite: [5]
  - level: patient
    prompt: Что происходит с сосудами, когда сахар в крови долго остаётся высоким?
    options:
      - text: Сосуды расширяются, и кровоток по ним ускоряется
      - text: Сосуды становятся прозрачными и очень мягкими
      - text: Сосуды сужаются, и кровоток по ним уменьшается
        correct: true
    explanation: Когда уровень сахара в крови долго остаётся высоким, мелкие и крупные сосуды сужаются, а кровоток по ним уменьшается.
    cite: [5]
  - level: patient
    prompt: Как иногда обнаруживают «немой» инфаркт у человека с диабетом?
    options:
      - text: Позже, на очередной ЭКГ
        correct: true
      - text: По изменению голоса и почерка
      - text: По цвету ногтей на руках
    explanation: У людей с диабетом инфаркт может случиться без боли в груди, и такой «немой» инфаркт иногда обнаруживают лишь позже, на очередной ЭКГ.
    cite: [7]
  - level: patient
    prompt: Какой из этих признаков статья называет поводом сразу звонить 103 или 112?
    options:
      - text: Небольшой зуд кожи на тыльной стороне кисти
      - text: Заложенность носа после прогулки на холоде
      - text: Боль, давление или дискомфорт в груди
        correct: true
    explanation: Сразу звоните 103 или 112, если появились боль, давление или дискомфорт в груди, особенно отдающие в спину, челюсть или левую руку.
    cite: [7]
  - level: student
    prompt: Следствием чего MSD считает атеросклероз крупных сосудов при СД?
    options:
      - text: Гипокальциемии, гипонатриемии и гиперурикемии
      - text: Гиперинсулинемии, дислипидемии и гипергликемии
        correct: true
      - text: Гипотиреоза, гипоальбуминемии и выраженной анемии
    explanation: По MSD, атеросклероз крупных сосудов — следствие характерных для СД гиперинсулинемии, дислипидемии и гипергликемии.
    cite: [4]
  - level: student
    prompt: Какое поражение коронарного русла характерно для СД?
    options:
      - text: Изолированный короткий стеноз одной артерии без кальциноза
      - text: Врождённая аномалия отхождения коронарных артерий
      - text: Многососудистое диффузное, с выраженным кальцинозом
        correct: true
    explanation: Для СД характерны многососудистое диффузное поражение коронарного русла и выраженный кальциноз коронарных артерий.
    cite: [2]
