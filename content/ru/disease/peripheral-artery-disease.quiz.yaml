questions:
  - level: patient
    prompt: Что главным образом сужает или перекрывает артерии ног при этой болезни?
    options:
      - text: Расширение и застой крови в венах ног
      - text: Бляшки в стенке артерии, которые сужают или перекрывают её просвет
        correct: true
      - text: Недостаток витаминов и минералов в питании
    explanation: 'Главная причина — атеросклероз: в стенке артерии образуются бляшки, которые сужают её просвет или полностью его перекрывают.'
    cite: [1]
  - level: patient
    prompt: Что сравнивают при измерении лодыжечно-плечевого индекса (ЛПИ)?
    options:
      - text: Давление на лодыжке и давление на руке
        correct: true
      - text: Пульс на шее и пульс на запястье
      - text: Температуру стопы и температуру кисти
    explanation: 'Главный простой тест — лодыжечно-плечевой индекс (ЛПИ): давление на лодыжке сравнивают с давлением на руке.'
    cite: [1, 6]
  - level: patient
    prompt: Какое лечение — первая линия при перемежающейся хромоте?
    options:
      - text: Ампутация ноги
      - text: Полный покой без ходьбы
      - text: Тренировочная ходьба
        correct: true
    explanation: Тренировочная ходьба — лечение первой линии при перемежающейся хромоте.
    cite: [1]
  - level: patient
    prompt: В какой ситуации статья советует сразу вызывать скорую?
    options:
      - text: Икра болит при ходьбе, и боль проходит через несколько минут отдыха
      - text: Нога внезапно стала сильно болеть, побледнела и похолодела
        correct: true
      - text: Нога тёплая, не болит, пульс на стопе хорошо прощупывается
    explanation: Вызывайте скорую по номеру 103 или 112, если в ноге внезапно появились сильная боль, бледность, похолодание, онемение или покалывание, пульс на стопе пропал или стало трудно пошевелить ногой.
    cite: [7, 8]
  - level: student
    prompt: Какое значение ЛПИ в покое ACC/AHA относят к нормальным?
    options:
      - text: 0,90 и ниже
      - text: Выше 1,40
      - text: От 1,00 до 1,40
        correct: true
    explanation: 'ACC/AHA: ЛПИ ≤0,90 — патологический, 0,91–0,99 — пограничный, 1,00–1,40 — нормальный, выше 1,40 — несжимаемые артерии.'
    cite: [5]
  - level: student
    prompt: Чем боль при стенозе позвоночного канала (псевдохромота) отличается от хромоты?
    options:
      - text: Проходит, только если сесть, а пульс на стопах сохранён
        correct: true
      - text: Проходит сразу после остановки, а пульс на стопах исчезает
      - text: Возникает только в покое и стихает при продолжении ходьбы
    explanation: Боль при стенозе позвоночного канала (псевдохромота) проходит, только если сесть, а не просто остановиться, и пульс на стопах сохранён.
    cite: [6]
