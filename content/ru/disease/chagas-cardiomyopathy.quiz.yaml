questions:
  - level: patient
    prompt: Что вызывает болезнь Шагаса?
    options:
      - text: Вирус, который передаётся при кашле и чихании
      - text: Паразит — одноклеточное простейшее
        correct: true
      - text: Бактерия, которая попадает в рану из почвы
    explanation: Болезнь Шагаса, или американский трипаносомоз, — инфекция, которую вызывает паразит Trypanosoma cruzi, одноклеточное простейшее.
    cite: [1, 5]
  - level: patient
    prompt: Как паразит попадает в организм человека после укуса клопа?
    options:
      - text: Со слюной клопа, которую он впрыскивает при укусе
      - text: Через яйца клопа, отложенные под кожу
      - text: Через испражнения клопа, втёртые в ранку
        correct: true
    explanation: Клоп обычно кусает открытый участок кожи и оставляет рядом испражнения. Паразиты попадают в организм, когда человек втирает их в зудящую ранку, другие повреждения кожи, глаза или рот.
    cite: [1]
  - level: patient
    prompt: Что происходит с сердцем при кардиомиопатии Шагаса?
    options:
      - text: Оно увеличивается и слабеет
        correct: true
      - text: Оно уменьшается и сокращается сильнее обычного
      - text: Оно не меняется, а страдают только сосуды ног
    explanation: 'Через годы и десятилетия после заражения у части людей развивается кардиомиопатия: сердце увеличивается и слабеет, нарушается проведение импульсов, появляются опасные нарушения ритма.'
    cite: [1, 2, 6]
  - level: patient
    prompt: Что из этого, по статье, повод вызвать скорую?
    options:
      - text: Небольшой синяк на колене после ушиба
      - text: Приступ аритмии с потерей сознания
        correct: true
      - text: Лёгкий насморк после прогулки под дождём
    explanation: Российские рекомендации советуют вызывать скорую помощь, если приступ аритмии сопровождается головокружением, слабостью, предобморочным состоянием, потерей сознания или учащённым сердцебиением.
    cite: [2]
  - level: student
    prompt: С чего обычно начинается поражение сердца при болезни Шагаса?
    options:
      - text: С сужения аортального клапана и утолщения стенки левого желудочка
      - text: С закупорки коронарных артерий атеросклеротическими бляшками
      - text: С нарушений проводимости, например блокады правой ножки
        correct: true
    explanation: 'Поражение сердца обычно начинается с нарушений проводимости: блокады правой ножки пучка Гиса или передней ветви левой ножки. Затем часто развивается кардиомиопатия с расширением всех камер, аневризмами верхушки и прогрессированием поражения проводящей системы.'
    cite: [5]
  - level: student
    prompt: К каким причинам дилатационной кардиомиопатии ESC 2023 относит болезнь Шагаса?
    options:
      - text: 'К негенетическим: к инфекционным, после миокардита'
        correct: true
      - text: 'К генетическим: к наследственным мутациям белков саркомера'
      - text: 'К токсическим: к поражению сердца алкоголем'
    explanation: 'Рекомендации ESC 2023 относят болезнь Шагаса к негенетическим причинам дилатационной кардиомиопатии: к инфекционным, после миокардита, вызванного паразитом.'
    cite: [4]
