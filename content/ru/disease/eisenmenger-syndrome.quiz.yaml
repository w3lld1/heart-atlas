questions:
  - level: patient
    prompt: Куда идёт кровь через дефект при синдроме Эйзенменгера?
    options:
      - text: Только слева направо, как в начале болезни
      - text: Через дефект кровь совсем не проходит
      - text: Справа налево или в обе стороны
        correct: true
    explanation: Давление в сосудах лёгких становится таким же высоким, как в большом круге кровообращения, и кровь через дефект идёт справа налево или в обе стороны.
    cite: [1]
  - level: patient
    prompt: Как клинические рекомендации относятся к закрытию дефекта при синдроме Эйзенменгера?
    options:
      - text: Называют его противопоказанным или не рекомендуют
        correct: true
      - text: Рекомендуют всем как основное лечение
      - text: Рекомендуют сразу после появления синюшности
    explanation: Клинические рекомендации называют закрытие дефекта при синдроме Эйзенменгера противопоказанным или не рекомендуют его.
    cite: [1, 2, 3, 4]
  - level: patient
    prompt: Почему регулярные кровопускания при синдроме Эйзенменгера не рекомендуются?
    options:
      - text: Потому что эритроцитов при синдроме слишком мало
      - text: Потому что избыток эритроцитов — приспособление к нехватке кислорода
        correct: true
      - text: Потому что кровь при синдроме не сворачивается
    explanation: Избыток эритроцитов — приспособление к нехватке кислорода, поэтому регулярные кровопускания не рекомендуются, а дефицит железа восполняют.
    cite: [2, 3, 4]
  - level: patient
    prompt: При каком симптоме человеку с синдромом Эйзенменгера нужно вызвать скорую?
    options:
      - text: При лёгком насморке без температуры
      - text: При сухости кожи
      - text: При кровохарканье
        correct: true
    explanation: Кровохарканье — самое частое большое кровотечение при синдроме, и оно может быть лишь видимой частью кровотечения в лёгких; при нём вызывают скорую.
    cite: [4]
  - level: student
    prompt: При каких шунтах симптомы обычно появляются в 20–40 лет?
    options:
      - text: При претрикуспидальных (ДМПП, частичный аномальный дренаж лёгочных вен)
        correct: true
      - text: При некорригированных посттрикуспидальных (ДМЖП, ОАП)
    explanation: При претрикуспидальных шунтах симптомы обычно появляются в 20–40 лет; при некорригированных посттрикуспидальных необратимая лёгочная сосудистая болезнь может сформироваться в первые годы жизни.
    cite: [5]
  - level: student
    prompt: Каким обычно бывает II тон при аускультации?
    options:
      - text: Тихим и широко расщеплённым
      - text: Громким и одиночным
        correct: true
      - text: Он не выслушивается
    explanation: При аускультации II тон громкий и одиночный, часто слышен щелчок изгнания на лёгочной артерии.
    cite: [5]
