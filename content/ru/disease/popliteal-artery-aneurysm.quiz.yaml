questions:
  - level: patient
    prompt: Из-за чего расширяется артерия при этой болезни?
    options:
      - text: Из-за нехватки воды в организме
      - text: Из-за ослабления её стенки
        correct: true
      - text: Из-за долгого сидения на корточках
    explanation: Стенка артерии слабеет, и артерия расширяется.
    cite: [5]
  - level: patient
    prompt: Что может образоваться внутри расширенного участка артерии?
    options:
      - text: Тромб (сгусток крови)
        correct: true
      - text: Камень, как в почке
      - text: Костный нарост из коленного сустава
    explanation: 'В аневризме может образоваться тромб: он закрывает саму аневризму или отрывается и закупоривает артерии ниже.'
    cite: [1, 3, 5]
  - level: patient
    prompt: Каким исследованием подтверждают диагноз?
    options:
      - text: Общий анализ мочи
      - text: Измерение роста и веса
      - text: УЗИ сосудов
        correct: true
    explanation: 'Диагноз подтверждают визуализацией: УЗИ сосудов (дуплексное сканирование), КТ-ангиографией или МР-ангиографией.'
    cite: [1, 5]
  - level: patient
    prompt: Какой признак — повод сразу вызвать скорую?
    options:
      - text: Икота после быстрой еды
      - text: Нога внезапно заболела
        correct: true
      - text: Заложенный нос при простуде
    explanation: Статья советует сразу вызывать скорую, если нога внезапно заболела.
    cite: [4, 5]
  - level: student
    prompt: Что, по российским рекомендациям, определяет успех шунтирования при АПА?
    options:
      - text: Уровень холестерина в крови пациента
      - text: Толщина подкожного жира на бедре
      - text: Проходимость берцовых артерий
        correct: true
    explanation: Проходимость берцовых артерий имеет ключевое значение для выбора метода лечения, так как определяет успех шунтирования.
    cite: [1]
  - level: student
    prompt: По российским рекомендациям, из-за чего тромбоз АПА может приводить к тяжёлой ишемии?
    options:
      - text: Из-за быстрой окклюзии дистальных сосудов
        correct: true
      - text: Из-за спазма поверхностных вен голени и стопы
      - text: Из-за воспаления коленного сустава рядом с артерией
    explanation: Тромбоз АПА может приводить к тяжёлой ишемии из-за быстрой окклюзии дистальных сосудов.
    cite: [1]
