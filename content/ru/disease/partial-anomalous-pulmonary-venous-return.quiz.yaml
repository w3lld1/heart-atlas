questions:
  - level: patient
    prompt: Что такое частичный аномальный дренаж лёгочных вен?
    options:
      - text: Все лёгочные вены сразу впадают в правое предсердие или полые вены
      - text: В перегородке между двумя желудочками сердца есть лишнее отверстие
      - text: Часть лёгочных вен впадает в правое предсердие или полые вены
        correct: true
    explanation: ЧАДЛВ — врождённый порок сердца, при котором одна или несколько, но не все лёгочные вены впадают не в левое предсердие, а в правое предсердие, коронарный синус или полые вены. Если неправильно впадают все лёгочные вены, это другой порок — тотальный аномальный дренаж лёгочных вен.
    cite: [1]
  - level: patient
    prompt: Почему при ЧАДЛВ перегружены правые отделы сердца?
    options:
      - text: Часть крови из лёгких возвращается в них и снова идёт в лёгкие
        correct: true
      - text: Часть крови от органов тела сразу уходит из них в аорту
      - text: Клапан лёгочной артерии сужен и почти не пропускает кровь в лёгкие
    explanation: Часть богатой кислородом крови из лёгких при ЧАДЛВ возвращается в правые отделы сердца и снова идёт в лёгкие, поэтому правые отделы перегружены лишней кровью — так же, как при дефекте межпредсердной перегородки.
    cite: [1, 2]
  - level: patient
    prompt: Что происходит при синдроме ятагана?
    options:
      - text: Левые лёгочные вены поднимаются и впадают в верхнюю полую вену
      - text: Правые лёгочные вены спускаются и впадают в нижнюю полую вену
        correct: true
      - text: Правые лёгочные вены впадают напрямую в правый желудочек
    explanation: 'Особый редкий вариант — синдром ятагана (синдром «турецкой сабли»): правые лёгочные вены спускаются вниз и впадают в нижнюю полую вену.'
    cite: [1, 2]
  - level: patient
    prompt: Что делают во время операции при ЧАДЛВ?
    options:
      - text: Отверстие закрывают устройством, которое проводят через сосуд
      - text: Отверстие закрывают заплатой, кровь вен ведут в левое предсердие
        correct: true
      - text: Отверстие не закрывают, а неправильно впадающие вены перевязывают
    explanation: 'Во время операции отверстие в перегородке закрывают заплатой, а кровь из неправильно впадающих вен направляют в левое предсердие по заплате-тоннелю внутри правого предсердия. Дефект «синус-венозус» сам не закрывается, и его нельзя закрыть устройством через сосуд (окклюдером).'
    cite: [1, 3]
  - level: student
    prompt: Какое отношение Qp/Qs при ЧАДЛВ считают значимым?
    options:
      - text: Qp/Qs не больше 0,5
      - text: Qp/Qs не больше 1,0
      - text: Qp/Qs более 1,5
        correct: true
    explanation: Обязательно определяют отношение лёгочного и системного кровотока (Qp/Qs); значимым считается более 1,5.
    cite: [1]
  - level: student
    prompt: Что показывает ЭКГ при ЧАДЛВ?
    options:
      - text: Гипертрофию ПЖ, неполную блокаду правой ножки, перегрузку ПП
        correct: true
      - text: Гипертрофию ЛЖ, полную блокаду левой ножки, перегрузку ЛП
      - text: Гипертрофию ЛЖ, укороченный интервал PQ и дельта-волну перед QRS
    explanation: На ЭКГ — гипертрофия миокарда ПЖ, неполная блокада правой ножки пучка Гиса, признаки перегрузки правого предсердия.
    cite: [1]
