questions:
  - level: patient
    prompt: Почему при семейной гиперхолестеринемии холестерин ЛНП остаётся высоким?
    options:
      - text: Из-за изменённого гена частицы ЛНП хуже уходят из крови
        correct: true
      - text: Из-за инфекции, которая постепенно разрушает клетки печени и почек
      - text: Из-за аллергии на продукты, которая сохраняется всю жизнь
    explanation: При семейной гиперхолестеринемии ген, нужный для захвата частиц ЛНП клетками печени, изменён, поэтому частицы ЛНП хуже уходят из крови и холестерин ЛНП остаётся высоким.
    cite: [1]
  - level: patient
    prompt: В чём главная опасность семейной гиперхолестеринемии?
    options:
      - text: Ранняя потеря слуха и постоянный шум в ушах
      - text: Ранняя близорукость и катаракта
      - text: Ранняя ишемическая болезнь сердца
        correct: true
    explanation: 'Главная опасность — ранняя ишемическая болезнь сердца: стенокардия и инфаркт.'
    cite: [1, 5]
  - level: patient
    prompt: Исключает ли отсутствие ксантом семейную гиперхолестеринемию?
    options:
      - text: 'Да: ксантомы есть у каждого больного с самого рождения'
      - text: 'Нет: ксантомы есть не у всех и в детстве редки'
        correct: true
      - text: 'Да: без ксантом холестерин ЛНП всегда остаётся в норме'
    explanation: Ксантомы есть не у всех, а в детстве появляются редко, поэтому их отсутствие болезнь не исключает.
    cite: [3, 5]
  - level: patient
    prompt: Почему обследуют родственников человека с семейной гиперхолестеринемией?
    options:
      - text: У них болезнь тоже может быть
        correct: true
      - text: Болезнь может передаваться воздушно-капельным путём
      - text: Им может понадобиться сдать кровь для переливания больному
    explanation: Когда болезнь найдена у одного человека, обследуют его родственников, потому что у них она тоже может быть.
    cite: [1, 2]
  - level: student
    prompt: Мутация какого гена — самая частая причина СГХС?
    options:
      - text: Гена бета-цепи гемоглобина (HBB)
      - text: Гена дистрофина (DMD)
      - text: Гена рецептора ЛНП (LDLR)
        correct: true
    explanation: Самая частая причина — мутация гена рецептора ЛНП (LDLR), который расположен главным образом на поверхности гепатоцитов.
    cite: [1]
  - level: student
    prompt: При каком результате по шкале DLCN выставляют диагноз геСГХС?
    options:
      - text: Только при возможной форме, но не при вероятной
      - text: При определённой или вероятной форме
        correct: true
      - text: При любой сумме баллов, даже нулевой
    explanation: По сумме баллов DLCN геСГХС бывает определённой, вероятной или возможной; диагноз выставляют только при определённой или вероятной форме.
    cite: [1]
