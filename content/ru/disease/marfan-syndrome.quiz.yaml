questions:
  - level: patient
    prompt: Изменения какого гена вызывают синдром Марфана?
    options:
      - text: Гена FBN1, который кодирует белок фибриллин-1
        correct: true
      - text: Гена, который кодирует гемоглобин
      - text: Гена, который кодирует инсулин
    explanation: Синдром Марфана вызывают изменения (патогенные варианты) гена FBN1, который кодирует белок фибриллин-1.
    cite: [1, 4]
  - level: patient
    prompt: С какой вероятностью ребёнок человека с синдромом Марфана получает эту болезнь?
    options:
      - text: Болезнь не передаётся по наследству
      - text: 50%
        correct: true
      - text: 100%, всегда
    explanation: Болезнь передаётся по наследству — ребёнок человека с синдромом Марфана получает её с вероятностью 50%.
    cite: [1]
  - level: patient
    prompt: Почему расширение аорты при синдроме Марфана ищут на обследованиях?
    options:
      - text: Потому что оно всегда вызывает сильную боль
      - text: Потому что его видно снаружи
      - text: Потому что во многих случаях оно никак себя не проявляет
        correct: true
    explanation: Расширение аорты во многих случаях никак себя не проявляет, поэтому его ищут на обследованиях.
    cite: [3]
  - level: patient
    prompt: Когда человеку с синдромом Марфана нужно вызвать скорую?
    options:
      - text: При внезапной сильной боли в груди или спине
        correct: true
      - text: При обычной усталости после работы
      - text: При лёгкой боли в мышцах после тренировки
    explanation: Синдром Марфана относится к состояниям высокого риска расслоения аорты; скорую вызывают при внезапной сильной боли в груди или спине, иногда в животе.
    cite: [1]
  - level: student
    prompt: Какой порок может вызвать дилатация корня аорты при синдроме Марфана?
    options:
      - text: Стеноз трикуспидального клапана
      - text: Аортальную регургитацию с диастолическим убывающим шумом
        correct: true
      - text: Стеноз клапана лёгочной артерии
    explanation: Дилатация корня аорты есть у большинства пациентов, включая детей; она может вызывать аортальную регургитацию с диастолическим убывающим шумом.
    cite: [4]
  - level: student
    prompt: При каком максимальном диаметре синусов аорты ESC показывает операцию (I B)?
    options:
      - text: ≥ 35 мм
      - text: ≥ 65 мм
      - text: ≥ 50 мм
        correct: true
    explanation: По ESC операция показана при максимальном диаметре синусов аорты ≥ 50 мм (I B) и должна рассматриваться при ≥ 45 мм с дополнительными факторами риска (IIa C).
    cite: [2]
