questions:
  - level: patient
    prompt: Что такое единственный желудочек сердца?
    options:
      - text: Оба желудочка есть, но в перегородке между ними отверстие
      - text: Оба предсердия соединены лишь с одним развитым желудочком
        correct: true
      - text: Оба желудочка развиты нормально, но сужен один из клапанов
    explanation: Единственный желудочек сердца — врождённый порок сердца, при котором оба предсердия соединяются только с одним хорошо развитым желудочком. Второй желудочек отсутствует или так недоразвит, что сделать из сердца нормальное, с двумя полноценными желудочками, нельзя.
    cite: [1, 2]
  - level: patient
    prompt: Почему при единственном желудочке в крови меньше кислорода, чем в норме?
    options:
      - text: Воздух плохо доходит до лёгких из-за сужения бронхов
      - text: В крови слишком мало эритроцитов из-за болезни костного мозга
      - text: Кровь из лёгких и от органов смешивается в одной камере
        correct: true
    explanation: При единственном желудочке малый и большой круги кровообращения работают параллельно, а не последовательно. Кровь из лёгких и кровь от органов тела смешивается в одной камере, поэтому кислорода в крови меньше нормы.
    cite: [1]
  - level: patient
    prompt: Что делают этапные операции при единственном желудочке?
    options:
      - text: Улучшают кровообращение, но порок не излечивают
        correct: true
      - text: Создают второй желудочек и полностью излечивают порок
      - text: Только уменьшают боль, не влияя на кровообращение
    explanation: 'Лечение — несколько операций по очереди. Второй желудочек они не создают: эти операции паллиативные, то есть порок не излечивают, а облегчают состояние, улучшая кровообращение при сложном строении сердца.'
    cite: [1]
  - level: patient
    prompt: Что, по статье, у взрослого после операции Фонтена — повод сразу вызвать скорую?
    options:
      - text: Сухость кожи на руках в холодное время года
      - text: Желание вздремнуть после сытного обеда
      - text: Затяжной приступ частого сердцебиения
        correct: true
    explanation: 'У взрослых после операции Фонтена затяжной приступ частого сердцебиения — неотложное состояние: вызывайте скорую по номеру 103 или 112.'
    cite: [2]
  - level: student
    prompt: Чем грозит сужение бульбовентрикулярного отверстия, если аорта отходит от камеры-выпускника?
    options:
      - text: Субаортальным стенозом с затруднением системного кровотока
        correct: true
      - text: Стенозом лёгочной артерии с уменьшением лёгочного кровотока
      - text: Митральной недостаточностью с перегрузкой левого предсердия
    explanation: Если аорта отходит от камеры-выпускника, путь из системного желудочка в аорту проходит через бульбовентрикулярное отверстие — по сути ДМЖП. Со временем оно может суживаться (субаортальный стеноз) и затруднять системный кровоток.
    cite: [1]
  - level: student
    prompt: К чему ведёт отсутствие подлёгочного желудочка при кровообращении Фонтена?
    options:
      - text: К системной венозной гипотензии и перегрузке желудочка объёмом
      - text: К системной венозной гипертензии и недогрузке желудочка объёмом
        correct: true
      - text: К лёгочной венозной гипертензии и перегрузке желудочка давлением
    explanation: Отсутствие подлёгочного желудочка ведёт к хронической системной венозной гипертензии, изменённой лёгочной гемодинамике и хронической недогрузке желудочка объёмом («preload-deprived»).
    cite: [2]
