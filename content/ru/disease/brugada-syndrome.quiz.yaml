questions:
  - level: patient
    prompt: Когда при синдроме Бругада чаще случаются обмороки и остановка сердца?
    options:
      - text: Сразу после еды
      - text: Ночью, в покое или во сне
        correct: true
    explanation: Такие эпизоды чаще случаются ночью, в покое или во сне и обычно не связаны с физической нагрузкой.
    cite: [1, 2]
  - level: patient
    prompt: Что может спровоцировать приступ при синдроме Бругада?
    options:
      - text: Употребление сладкого
      - text: Прогулка на свежем воздухе
      - text: Лихорадка
        correct: true
    explanation: Приступ могут спровоцировать лихорадка, некоторые лекарства, кокаин и большое количество алкоголя.
    cite: [1, 2]
  - level: patient
    prompt: Какое исследование при синдроме Бругада главное?
    options:
      - text: ЭКГ с поиском характерной картины в отведениях V1 и V2
        correct: true
      - text: Анализ мочи
      - text: Гастроскопия
    explanation: 'Главное исследование — ЭКГ: врач ищет характерную картину в правых грудных отведениях V1 и V2, иногда записывая их на одно-два межреберья выше обычного.'
    cite: [1, 2]
  - level: patient
    prompt: Что используют для защиты от внезапной смерти при синдроме Бругада?
    options:
      - text: Слуховой аппарат
      - text: Имплантируемый кардиовертер-дефибриллятор (ИКД)
        correct: true
      - text: Инсулиновую помпу
    explanation: Для защиты от внезапной смерти используют имплантируемый кардиовертер-дефибриллятор (ИКД).
    cite: [1, 2]
  - level: student
    prompt: Какой ген — единственный с доказанной причинной ролью при синдроме Бругада?
    options:
      - text: MYH7
      - text: FBN1
      - text: SCN5A
        correct: true
    explanation: Единственный ген с доказанной причинной ролью — SCN5A, но на его мутации приходится лишь около 20 % случаев.
    cite: [1]
  - level: student
    prompt: Считаются ли диагностическими изменения ЭКГ 2-го и 3-го типов?
    options:
      - text: Нет, но они могут переходить в 1-й тип
        correct: true
      - text: Да, наравне с 1-м типом
    explanation: Изменения 2-го и 3-го типов диагностическими не считаются; они могут переходить в 1-й тип спонтанно, при лихорадке или под действием лекарств.
    cite: [2]
