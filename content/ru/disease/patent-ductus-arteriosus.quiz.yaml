questions:
  - level: patient
    prompt: Какие сосуды соединяет артериальный проток?
    options:
      - text: Верхнюю и нижнюю полые вены
      - text: Две коронарные артерии
      - text: Аорту и лёгочную артерию
        correct: true
    explanation: Обычно проток отходит от дуги аорты напротив левой подключичной артерии и впадает в лёгочную артерию у начала левой лёгочной артерии.
    cite: [1, 2]
  - level: patient
    prompt: У каких детей проток чаще всего остаётся открытым?
    options:
      - text: У недоношенных детей
        correct: true
      - text: У детей с большой массой тела при рождении
    explanation: 'Чаще всего проток остаётся открытым у недоношенных детей: чем меньше масса тела при рождении, тем чаще.'
    cite: [1, 3]
  - level: patient
    prompt: Какое исследование главное при открытом артериальном протоке?
    options:
      - text: Анализ мочи
      - text: УЗИ сердца (эхокардиография) с допплером
        correct: true
      - text: МРТ головного мозга
    explanation: 'Главное исследование — УЗИ сердца (эхокардиография) с допплером: оно показывает сам проток и сброс крови через него.'
    cite: [1, 3]
  - level: patient
    prompt: Что со временем развивается, если большой проток не закрыть?
    options:
      - text: Лёгочная гипертензия и синдром Эйзенменгера
        correct: true
      - text: Ничего, большой проток не опасен
    explanation: Если большой проток не закрыть, со временем развиваются лёгочная гипертензия и синдром Эйзенменгера — необратимое поражение сосудов лёгких.
    cite: [1, 3]
  - level: student
    prompt: Какой шум характерен для ОАП?
    options:
      - text: Короткий систолический шум на верхушке сердца
      - text: Непрерывный систоло-диастолический шум во II–III межреберье слева
        correct: true
    explanation: Характерные признаки — непрерывный систоло-диастолический шум во II–III межреберье слева от грудины и снижение диастолического АД.
    cite: [1]
  - level: student
    prompt: Нужна ли катетеризация сердца для диагноза ОАП?
    options:
      - text: Нужна всем для подтверждения диагноза
      - text: Обычно не нужна; её делают при признаках высокого давления в ЛА
        correct: true
    explanation: Катетеризация для диагноза обычно не нужна; её выполняют при признаках высокого давления в ЛА, чтобы оценить лёгочное сосудистое сопротивление и возможность операции.
    cite: [1, 2, 3]
