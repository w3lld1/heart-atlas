questions:
  - level: patient
    prompt: Что такое синдром такоцубо?
    options:
      - text: Временное нарушение сокращения части левого желудочка
        correct: true
      - text: Врождённое сужение аорты, которое заметно с самого рождения
      - text: Необратимое разрушение клапанов сердца после перенесённой ангины
    explanation: Синдром такоцубо — временное нарушение сокращения части левого желудочка, которое по своим проявлениям похоже на острый коронарный синдром, то есть на инфаркт.
    cite: [3]
  - level: patient
    prompt: Откуда пришло название «такоцубо»?
    options:
      - text: Это фамилия японского врача, который первым описал болезнь
      - text: Так называется японский город, где болезнь впервые нашли
      - text: Так по-японски называется ловушка для осьминогов
        correct: true
    explanation: Название пришло из японского — так называется ловушка для осьминогов, на которую похож левый желудочек в конце сокращения.
    cite: [3]
  - level: patient
    prompt: Кто чаще всего болеет синдромом такоцубо?
    options:
      - text: Мальчики-подростки до 15 лет
      - text: Женщины после менопаузы
        correct: true
      - text: Молодые мужчины-спортсмены
    explanation: Чаще всего синдромом такоцубо болеют женщины после менопаузы.
    cite: [3]
  - level: patient
    prompt: За какое время обычно восстанавливается сокращение левого желудочка?
    options:
      - text: За 4–8 недель
        correct: true
      - text: Только через 10–20 лет
      - text: Не восстанавливается никогда
    explanation: 'Синдром такоцубо обратим: сокращение левого желудочка обычно полностью восстанавливается за 4–8 недель. Но в острый период болезнь бывает опасной, а наблюдаться у врача важно и после выписки: у небольшой части людей болезнь повторяется, иногда через годы.'
    cite: [4]
  - level: student
    prompt: Что считается золотым стандартом диагностики синдрома такоцубо?
    options:
      - text: Однократный анализ крови на тропонин
      - text: Коронарография с левой вентрикулографией
        correct: true
      - text: Холтеровское мониторирование ЭКГ в течение суток
    explanation: Золотым стандартом считается коронарография с левой вентрикулографией. Тропонин в большинстве случаев повышен лишь умеренно.
    cite: [3]
  - level: student
    prompt: Что у большинства пациентов с такоцубо показывает МРТ сердца?
    options:
      - text: Обширное позднее накопление гадолиния без отёка миокарда
      - text: Нормальный миокард без каких-либо изменений сигнала
      - text: Отёк миокарда без позднего накопления гадолиния
        correct: true
    explanation: У большинства пациентов с такоцубо на МРТ виден отёк миокарда в зонах нарушенной сократимости, а позднее накопление гадолиния обычно отсутствует.
    cite: [4]
