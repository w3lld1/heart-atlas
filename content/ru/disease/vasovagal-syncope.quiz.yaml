questions:
  - level: patient
    prompt: Почему после обморока нужно показаться врачу?
    options:
      - text: От обморока может начаться простуда
      - text: Обморок может передаться другим людям при близком контакте
      - text: Так же может выглядеть обморок из-за болезни сердца
        correct: true
    explanation: 'Так же может выглядеть и обморок из-за болезни сердца, поэтому после обморока нужно показаться врачу: отличить безобидную причину от серьёзной может только он.'
    cite: [4]
  - level: patient
    prompt: Что часто провоцирует вазовагальный обморок?
    options:
      - text: Боль, долгое стояние или эмоциональный стресс
        correct: true
      - text: Крепкий ночной сон в положении лёжа на спине
      - text: Спокойное чтение книги сидя в прохладной комнате
    explanation: Вазовагальный обморок часто, но не всегда, провоцируют боль, долгое стояние (особенно в жаре) или эмоциональный стресс.
    cite: [2]
  - level: patient
    prompt: Почему человеку, который после обморока дышит, лучше полежать?
    options:
      - text: Сидя у него может начаться аллергия на пыль
      - text: Если сесть слишком быстро, обморок может повториться
        correct: true
      - text: Сидя у него может очень сильно подняться температура тела
    explanation: 'Если человек дышит, пусть полежит: если сесть слишком быстро, обморок может повториться. Даже если всё прошло, после обморока покажитесь врачу.'
    cite: [4]
  - level: patient
    prompt: Почему для диагноза важен рассказ свидетелей?
    options:
      - text: Без свидетелей врач не может записать ЭКГ
      - text: Свидетели могут заменить осмотр врача целиком
      - text: Сам человек может не помнить, что произошло
        correct: true
    explanation: 'Важен рассказ свидетелей: сам человек может не помнить, что произошло.'
    cite: [1, 4]
  - level: student
    prompt: Зависит ли тип гемодинамической реакции при рефлекторном синкопе от триггера?
    options:
      - text: Нет, тип реакции от триггера не зависит
        correct: true
      - text: 'Да: боль всегда вызывает только асистолию'
      - text: 'Да: стояние всегда вызывает только брадикардию'
    explanation: Тип гемодинамической реакции — кардиоингибиторная, вазодепрессорная или обе — не зависит от триггера.
    cite: [1]
  - level: student
    prompt: О чём скорее говорит обморок в положении лёжа?
    options:
      - text: О нехватке витамина C в пище
      - text: Об аритмии
        correct: true
      - text: О начинающейся близорукости
    explanation: Обморок лёжа говорит скорее об аритмии, потому что вазовагальный механизм в положении лёжа обморок не вызывает.
    cite: [3]
