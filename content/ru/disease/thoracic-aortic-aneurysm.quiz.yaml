questions:
  - level: patient
    prompt: Что такое аневризма грудной аорты?
    options:
      - text: Сужение аорты выше диафрагмы
      - text: Стойкое расширение аорты выше диафрагмы
        correct: true
      - text: Кратковременное расширение аорты ниже диафрагмы
    explanation: Аневризма грудной аорты — стойкое расширение аорты выше диафрагмы.
    cite: [2, 4]
  - level: patient
    prompt: Что рекомендации советуют людям с аневризмой грудной аорты насчёт нагрузок?
    options:
      - text: Избегать подъёма тяжестей и контактных видов спорта
        correct: true
      - text: Регулярно поднимать тяжести, чтобы укрепить стенку аорты
      - text: Отказаться от любой, даже лёгкой, аэробной нагрузки
    explanation: Рекомендации советуют избегать подъёма тяжестей, упражнений с натуживанием и контактных видов спорта. Лёгкая или умеренная аэробная нагрузка при целевом давлении рекомендуется, а её объём обсуждают с врачом.
    cite: [1, 2, 3]
  - level: patient
    prompt: Что верно об аневризмах корня и восходящей аорты?
    options:
      - text: Они чаще появляются в пожилом возрасте
      - text: Они чаще всего связаны с атеросклерозом
      - text: Они нередко бывают наследственными
        correct: true
    explanation: Аневризмы корня и восходящей аорты нередко наследственные и появляются в более молодом возрасте, поэтому рекомендуют обследовать аорту у родственников первой степени родства. С атеросклерозом чаще связаны аневризмы нисходящей грудной аорты.
    cite: [2, 3]
  - level: patient
    prompt: Какое исследование позволяет точно измерить аорту и осмотреть её целиком?
    options:
      - text: УЗИ сердца (эхокардиография)
      - text: КТ- или МР-ангиография
        correct: true
      - text: Обычный рентген грудной клетки
    explanation: Чтобы точно измерить аорту и осмотреть её целиком, делают КТ-ангиографию или МР-ангиографию. Часть восходящей аорты и дуги на УЗИ не видна, а обычный рентген для поиска аневризмы ненадёжен.
    cite: [1, 2, 3, 4]
  - level: student
    prompt: Что, по Минздраву и ACC/AHA, связано с более высокой склонностью к разрыву?
    options:
      - text: Медленный рост, менее 0,05 см/год
      - text: Мужской пол
      - text: Мешотчатая форма аневризмы
        correct: true
    explanation: С более высокой склонностью к разрыву связаны быстрый рост (≥0,5 см/год), симптомная аневризма, моногенные заболевания соединительной ткани или НЗГА, мешотчатая форма, женский пол и инфицированная аневризма.
    cite: [2, 3]
  - level: student
    prompt: По ACC/AHA, какие аневризмы грудной аорты диагностируют в более молодом возрасте?
    options:
      - text: Аневризмы корня и восходящей аорты
        correct: true
      - text: Аневризмы нисходящей грудной аорты
      - text: Все отделы — в одном и том же возрасте
    explanation: Аневризмы корня и восходящей аорты диагностируют в более молодом возрасте, чем аневризмы нисходящей грудной аорты (в 60 и 72 года соответственно); первые чаще имеют врождённую или наследственную природу, вторые — атеросклеротическую.
    cite: [3]
