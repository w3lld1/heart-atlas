questions:
  - level: patient
    prompt: Что происходит при врождённом надклапанном стенозе аорты?
    options:
      - text: Сужен или плохо открывается сам аортальный клапан
      - text: Аорта сужена выше аортального клапана
        correct: true
      - text: Препятствие находится под аортальным клапаном
    explanation: При надклапанном стенозе аорта сужена выше аортального клапана. При аортальном стенозе сужен сам клапан, а при подаортальном стенозе препятствие находится под клапаном.
    cite: [1, 3]
  - level: patient
    prompt: Что в большинстве случаев вызывает этот порок?
    options:
      - text: Травма грудной клетки во время родов
      - text: Частые простуды в первые годы жизни
      - text: Изменение или потеря гена эластина
        correct: true
    explanation: В большинстве случаев причина — изменение (мутация) или потеря (делеция) гена эластина на 7-й хромосоме.
    cite: [1, 2]
  - level: patient
    prompt: Какое лечение при этом пороке основное?
    options:
      - text: Операция на аорте
        correct: true
      - text: Лекарства, устраняющие сужение
      - text: Лечебная диета
    explanation: Лекарств, которые устраняют сужение, нет. Основное лечение — операция.
    cite: [1, 2]
  - level: patient
    prompt: Когда человеку с надклапанным стенозом аорты нужно вызвать скорую?
    options:
      - text: Чихнул несколько раз подряд
      - text: Захотелось пить после прогулки
      - text: Появилась боль в груди
        correct: true
    explanation: Скорую вызывают, если у ребёнка или взрослого с надклапанным стенозом аорты появилась боль в груди, случился обморок, приступ сильного сердцебиения или быстро нарастает одышка.
    cite: [1, 2]
  - level: student
    prompt: Что представляет собой диффузная форма НСА?
    options:
      - text: Сужение всей восходящей аорты
        correct: true
      - text: Фиброзная диафрагма сразу дистальнее устьев коронарных артерий
      - text: Наружная деформация аорты в виде песочных часов
    explanation: По ESC, диффузная форма — сужение всей восходящей аорты; фиброзная диафрагма характерна для мембранозной формы, наружная деформация — для «песочных часов».
    cite: [2]
  - level: student
    prompt: Какой метод, по Минздраву, лучше других методов лучевой диагностики оценивает анатомию артерий, питающих сердце?
    options:
      - text: Рентгенография грудной клетки
      - text: КТ-коронарография
        correct: true
      - text: УЗИ брюшной аорты
    explanation: По Минздраву, КТ-коронарография превосходит другие методы лучевой диагностики в оценке анатомии коронарных артерий.
    cite: [1]
