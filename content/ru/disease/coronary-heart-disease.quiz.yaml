questions:
  - level: patient
    prompt: Что является главной причиной ишемической болезни сердца?
    options:
      - text: Атеросклероз — бляшки в стенках коронарных артерий
        correct: true
      - text: Перелом рёбер
      - text: Сыпь на коже
    explanation: Главная причина ИБС — атеросклероз — в стенках коронарных артерий накапливаются бляшки.
    cite: [1, 3]
  - level: patient
    prompt: Что происходит с болью при стенокардии, когда нагрузка прекращается?
    options:
      - text: Она усиливается
      - text: Она быстро проходит
        correct: true
      - text: Она становится постоянной
    explanation: Боль при стенокардии появляется при физической нагрузке или сильном волнении и быстро проходит, когда нагрузка прекращается.
    cite: [3]
  - level: patient
    prompt: У кого инфаркт чаще, чем у других, бывает без боли в груди?
    options:
      - text: Ни у кого — инфаркт всегда начинается с боли в груди
      - text: У женщин, пожилых людей и людей с диабетом
        correct: true
    explanation: У женщин, пожилых людей и людей с диабетом чаще, чем у других, бывают нетипичные проявления без боли в груди — только одышка, боль в верхней части живота или слабость.
    cite: [5]
  - level: patient
    prompt: Что делать при острой боли или давлении в груди дольше 15 минут?
    options:
      - text: Подождать, пока пройдёт само
      - text: Самому доехать за рулём до больницы
      - text: Сразу вызвать скорую по номеру 103 или 112
        correct: true
    explanation: Это признак инфаркта — сразу звоните 103 или 112. Не ждите, что пройдёт само, не садитесь за руль и не добирайтесь до больницы сами.
    cite: [2, 5]
  - level: student
    prompt: В какой срок от первого медицинского контакта регистрируют ЭКГ при подозрении на ОКС?
    options:
      - text: В течение 10 минут
        correct: true
      - text: В течение 24 часов
      - text: На следующий день
    explanation: При подозрении на ОКС ЭКГ регистрируют в течение 10 минут от первого медицинского контакта.
    cite: [2]
  - level: student
    prompt: Чем NSTEMI отличается от нестабильной стенокардии?
    options:
      - text: Стойким подъёмом сегмента ST
      - text: Повышением маркеров некроза миокарда
        correct: true
    explanation: NSTEMI отличается от нестабильной стенокардии повышением маркеров некроза миокарда. При стойком подъёме сегмента ST рабочий диагноз — STEMI.
    cite: [2, 5]
