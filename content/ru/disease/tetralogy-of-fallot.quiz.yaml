questions:
  - level: patient
    prompt: Из скольких компонентов состоит тетрада Фалло?
    options:
      - text: Из двух
      - text: Из четырёх
        correct: true
      - text: Из шести
    explanation: Тетрада Фалло — врождённый порок сердца, который состоит из четырёх компонентов.
    cite: [1, 2, 3]
  - level: patient
    prompt: Почему при тетраде Фалло у ребёнка обычно синеют губы и кожа?
    options:
      - text: К органам идёт кровь, в которой не хватает кислорода
        correct: true
      - text: В лёгкие поступает слишком много крови
    explanation: Это порок «синего» типа — обычно у ребёнка синеют губы и кожа, потому что к органам идёт кровь, в которой не хватает кислорода.
    cite: [1]
  - level: patient
    prompt: Некоторые дети во время игры присаживаются на корточки. Что в этой позе происходит с кислородом в крови?
    options:
      - text: Его становится меньше
      - text: Он не меняется
      - text: Его становится больше
        correct: true
    explanation: Характерный признак — некоторые дети во время игры присаживаются на корточки; в этой позе кислорода в крови становится больше.
    cite: [1, 3]
  - level: patient
    prompt: Нужно ли наблюдаться у кардиолога после операции?
    options:
      - text: Нет, после операции наблюдение не нужно
      - text: Да, всю жизнь
        correct: true
      - text: Только в первый год после операции
    explanation: После операции нужно наблюдаться у кардиолога всю жизнь — до 18 лет у детского кардиолога, затем у взрослого.
    cite: [1]
  - level: student
    prompt: Чем обусловлен грубый систолический шум по левому краю грудины при тетраде Фалло?
    options:
      - text: Током крови через ДМЖП
      - text: Током крови через стеноз ЛА
        correct: true
    explanation: Грубый систолический шум по левому краю грудины обусловлен током крови через стеноз ЛА; ДМЖП обычно не даёт шума, потому что он большой и градиента давления на нём нет.
    cite: [1, 3]
  - level: student
    prompt: Что видно на рентгенограмме грудной клетки при тетраде Фалло?
    options:
      - text: Обеднение лёгочного кровотока и сердце в форме «деревянного башмачка»
        correct: true
      - text: Усиление лёгочного кровотока и сердце обычной формы
    explanation: На рентгенограмме — обеднение лёгочного кровотока и сердце в форме «деревянного башмачка».
    cite: [1, 3]
