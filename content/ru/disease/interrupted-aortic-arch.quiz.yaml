questions:
  - level: patient
    prompt: Что такое перерыв дуги аорты?
    options:
      - text: Аортальный клапан сердца сужен с рождения
      - text: Участок аорты отсутствует или не имеет просвета
        correct: true
      - text: В перегородке между предсердиями сердца есть отверстие
    explanation: Перерыв дуги аорты — редкий врождённый порок сердца, при котором участок аорты между восходящей и нисходящей её частью отсутствует или не имеет просвета.
    cite: [1]
  - level: patient
    prompt: Как при этом пороке кровь попадает в нижнюю половину тела?
    options:
      - text: Через коронарные артерии, которые питают сердце
      - text: Через вены, которые несут кровь к сердцу
      - text: Только через открытый артериальный проток
        correct: true
    explanation: Кровь в нисходящую аорту, а значит, к нижней половине тела, поступает только через открытый артериальный проток.
    cite: [1]
  - level: patient
    prompt: Какой единственный способ устранить этот порок?
    options:
      - text: Операция
        correct: true
      - text: Лекарства от сердечной недостаточности
      - text: Покой и специальная диета
    explanation: Единственный способ устранить порок — операция. Лекарства от сердечной недостаточности — лишь «мост» до операции, они не заменяют её.
    cite: [1]
  - level: patient
    prompt: В каком случае нужно вызвать скорую новорождённому?
    options:
      - text: Ребёнок один раз чихнул утром
      - text: Ребёнок зевнул перед тем, как уснуть
      - text: У ребёнка посинели губы или кожа
        correct: true
    explanation: Вызывайте скорую по номеру 103 или 112, если у новорождённого побледнели или посинели губы или кожа, похолодели руки и ноги, он стал вялым и слабо реагирует, дышит с трудом или задыхается при кормлении.
    cite: [1, 3, 4]
  - level: student
    prompt: Где находится перерыв при типе B по классификации Celoria–Patton?
    options:
      - text: Между подключичной и сонной артериями
        correct: true
      - text: Дальше, после левой подключичной артерии
      - text: Между двумя сонными артериями
    explanation: Тип A — перерыв дистальнее левой подключичной артерии, тип B — между подключичной и сонной артериями, тип C — между сонными артериями.
    cite: [1]
  - level: student
    prompt: Что происходит с шунтом при естественном снижении лёгочно-сосудистого сопротивления?
    options:
      - text: Шунт уменьшается и исчезает
      - text: Объём шунта растёт
        correct: true
      - text: Сброс меняет направление на право-левый
    explanation: С естественным снижением лёгочно-сосудистого сопротивления объём шунта растёт, нарастают гипоперфузия органов, сердечная недостаточность и лактат-ацидоз, которые усугубляются при закрытии ОАП.
    cite: [1]
