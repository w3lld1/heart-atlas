questions:
  - level: patient
    prompt: Что такое экстрасистола?
    options:
      - text: Сужение одного из клапанов сердца из-за отложений кальция
      - text: Воспаление сердечной мышцы после вирусной инфекции
      - text: Внеочередное, преждевременное сокращение сердца
        correct: true
    explanation: Экстрасистола — внеочередное сокращение сердца. Электрический импульс возникает не там, где обычно, и раньше, чем пришёл бы очередной нормальный удар.
    cite: [1, 6, 7]
  - level: patient
    prompt: У кого бывают экстрасистолы?
    options:
      - text: И у здоровых, и у людей с болезнями сердца
        correct: true
      - text: Только у людей с тяжёлой болезнью сердца, после инфаркта
      - text: Только у профессиональных спортсменов во время нагрузки
    explanation: Экстрасистолы очень часты и у здоровых людей, и у людей с болезнями сердца, а отдельные предсердные экстрасистолы бывают почти у всех.
    cite: [4, 5]
  - level: patient
    prompt: Что делает холтеровское мониторирование?
    options:
      - text: Показывает строение клапанов сердца с помощью ультразвуковых волн
      - text: Непрерывно записывает ЭКГ в обычной жизни 18 часов и дольше
        correct: true
      - text: Один раз в сутки измеряет артериальное давление и уровень калия в крови
    explanation: Чтобы записать редкие экстрасистолы и сопоставить их с ощущениями, проводят холтеровское мониторирование. Портативный прибор непрерывно записывает ЭКГ в обычной жизни 18 часов и дольше.
    cite: [1]
  - level: patient
    prompt: Какой прогноз для жизни при желудочковых экстрасистолах без болезни сердца и без ослабления левого желудочка?
    options:
      - text: Неблагоприятный, если экстрасистол больше тысячи в сутки
      - text: Плохой при любом виде экстрасистол, даже редких одиночных
      - text: Благоприятный, при любом виде и числе экстрасистол
        correct: true
    explanation: У людей с желудочковыми экстрасистолами без болезни сердца и без ослабления левого желудочка прогноз для жизни благоприятный, каким бы ни был вид экстрасистол и их количество за сутки. Если экстрасистол очень много, врач всё же время от времени проверяет, как работают желудочки. А если перебои сопровождаются головокружением, слабостью, предобморочным состоянием или потерей сознания, вызывайте скорую.
    cite: [1, 2]
  - level: student
    prompt: Как выглядит желудочковая экстрасистола на ЭКГ?
    options:
      - text: Ранний QRS ≥ 120 мс без предшествующего зубца P
        correct: true
      - text: Ранний узкий QRS менее 120 мс, без зубца P перед ним
      - text: Ранний широкий QRS, перед которым всегда есть зубец P
    explanation: ЖЭ на ЭКГ — преждевременный комплекс QRS шириной 120 мс и более, без предшествующего зубца P, с дискордантным по отношению к основному зубцу комплекса зубцом T.
    cite: [1]
  - level: student
    prompt: При какой доле ЖЭ от всех сокращений российские рекомендации называют ЖЭ частыми?
    options:
      - text: Более 1 %
      - text: Более 10 %
        correct: true
      - text: Более половины всех сокращений
    explanation: Бремя ЖЭ — доля желудочковых эктопических комплексов от всех сокращений за время холтеровского мониторирования. Частыми российские рекомендации называют ЖЭ, если их доля превышает 10 %.
    cite: [1]
