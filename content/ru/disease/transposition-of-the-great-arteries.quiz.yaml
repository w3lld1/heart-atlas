questions:
  - level: patient
    prompt: Что такое транспозиция магистральных артерий?
    options:
      - text: Порок, при котором отсутствует лёгочная артерия
      - text: Аорта отходит от правого желудочка, а лёгочная артерия — от левого
        correct: true
    explanation: При ТМА две главные артерии отходят от сердца «наоборот» — аорта от правого желудочка, а лёгочная артерия от левого.
    cite: [1, 2, 3]
  - level: patient
    prompt: Какой главный признак ТМА у новорождённого?
    options:
      - text: Синюшность, которая почти не уменьшается при дыхании кислородом
        correct: true
      - text: Высокая температура
      - text: Сыпь на коже
    explanation: Главный признак — синюшность (цианоз), которая почти не уменьшается при дыхании кислородом.
    cite: [1]
  - level: patient
    prompt: Что происходит с ребёнком с ТМА, когда закрывается артериальный проток?
    options:
      - text: Ребёнок выздоравливает
      - text: Состояние становится ещё тяжелее
        correct: true
    explanation: Когда артериальный проток закрывается, состояние становится ещё тяжелее.
    cite: [1]
  - level: patient
    prompt: Что делают при операции артериального переключения (операции Жатене)?
    options:
      - text: Заменяют митральный клапан протезом
      - text: Меняют местами аорту и лёгочную артерию и пересаживают коронарные артерии в новую аорту
        correct: true
    explanation: 'При операции артериального переключения аорту и лёгочную артерию отсекают и меняют местами, а коронарные артерии пересаживают в новую аорту.'
    cite: [3]
  - level: student
    prompt: От чего зависит степень гипоксемии при ТМА?
    options:
      - text: От размера сообщений между кругами и объёма смешивания крови
        correct: true
      - text: От уровня холестерина в крови
    explanation: Степень гипоксемии зависит от размера сообщений между кругами и объёма смешивания крови.
    cite: [1]
  - level: student
    prompt: Каким обычно бывает II тон при ТМА?
    options:
      - text: Широко расщеплённым и тихим
      - text: Одиночным и громким
        correct: true
    explanation: Кроме генерализованного цианоза, физикальное обследование мало что выявляет; II тон одиночный и громкий.
    cite: [3]
