questions:
  - level: patient
    prompt: Что происходит при синдроме постуральной ортостатической тахикардии?
    options:
      - text: При вставании пульс резко замедляется, и человек сразу теряет сознание
      - text: При вставании пульс заметно учащается, а давление почти не падает
        correct: true
      - text: При вставании давление резко падает, а пульс не меняется
    explanation: СПОТ — состояние, при котором при вставании заметно учащается пульс и появляются дурнота, сердцебиение, слабость и другие жалобы, а давление при этом почти не падает.
    cite: [5, 7, 8]
  - level: patient
    prompt: Что уменьшает жалобы при СПОТ?
    options:
      - text: Если быстро встать и пройтись
      - text: Если подольше постоять неподвижно
      - text: Если сесть или лечь
        correct: true
    explanation: Если сесть или лечь, жалобы уменьшаются, хотя не всегда проходят полностью.
    cite: [3, 6]
  - level: patient
    prompt: Что, по данным исследований, которые приводит HRS, вызывает учащение пульса стоя при СПОТ?
    options:
      - text: Нарушение в работе организма, а не тревога
        correct: true
      - text: Тревога, а не нарушение в работе организма
      - text: Привычка вставать слишком резко, а не нарушение в работе организма
    explanation: Тревога при СПОТ бывает часто, но, по данным исследований, которые приводит HRS, учащение пульса стоя вызывает не она, а нарушение в работе организма.
    cite: [8]
  - level: patient
    prompt: Что из этого, по статье, повод вызвать скорую?
    options:
      - text: Несколько чиханий от пыли
      - text: Небольшая царапина на руке после игры с кошкой
      - text: Обморок во время физической нагрузки
        correct: true
    explanation: Вызывайте скорую по номеру 103 или 112, если обморок случился во время физической нагрузки или лёжа.
    cite: [1, 4]
  - level: student
    prompt: Какая тахикардия бывает при СПОТ?
    options:
      - text: Желудочковая
      - text: Синусовая
        correct: true
      - text: Трепетание предсердий
    explanation: Тахикардия при СПОТ синусовая.
    cite: [8]
  - level: student
    prompt: К какой группе причин ESC относит СПОТ?
    options:
      - text: К сердечно-сосудистым причинам непереносимости ортостаза
        correct: true
      - text: К врождённым порокам сердца с нарушением тока крови в лёгких
      - text: К эндокринным болезням щитовидной железы
    explanation: ESC относит СПОТ вместе с классической, ранней и отсроченной ортостатической гипотензией и ортостатическим вазовагальным синкопе к сердечно-сосудистым причинам непереносимости ортостаза.
    cite: [1]
