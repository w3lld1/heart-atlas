questions:
  - level: patient
    prompt: Что такое сердечная недостаточность?
    options:
      - text: Одна отдельная болезнь сердечного клапана
      - text: Синдром, при котором сердце хуже наполняется кровью или хуже выбрасывает её
        correct: true
      - text: Тромб в лёгочной артерии
    explanation: Сердечная недостаточность — не одна болезнь, а клинический синдром — из-за нарушения строения или работы сердца оно хуже наполняется кровью или хуже выбрасывает её.
    cite: [2, 5]
  - level: patient
    prompt: Какой симптом сердечной недостаточности самый частый?
    options:
      - text: Сыпь на коже
      - text: Выпадение волос
      - text: Одышка
        correct: true
    explanation: Самый частый симптом сердечной недостаточности — одышка.
    cite: [2, 5]
  - level: patient
    prompt: Что обычно означает нормальный уровень натрийуретического пептида в крови?
    options:
      - text: Сердечная недостаточность маловероятна
        correct: true
      - text: Диагноз сердечной недостаточности подтверждён
    explanation: Если уровень натрийуретического пептида нормальный, сердечная недостаточность обычно маловероятна.
    cite: [2, 3]
  - level: patient
    prompt: Как проявляется острая сердечная недостаточность?
    options:
      - text: Только лёгкой усталостью к вечеру, дыхание не страдает
      - text: Выраженной нехваткой воздуха, одышкой лёжа и приступами удушья по ночам
        correct: true
      - text: Зудом кожи без каких-либо проблем с дыханием
    explanation: Острая сердечная недостаточность проявляется выраженной нехваткой воздуха, одышкой в положении лёжа и приступами удушья по ночам; она может сопровождаться кардиогенным шоком — резким нарушением кровоснабжения органов.
    cite: [5]
  - level: student
    prompt: Какая ФВ ЛЖ соответствует ХСН со сниженной ФВ по российским рекомендациям 2024 года?
    options:
      - text: 41–49%
      - text: 50% и более
      - text: 40% и менее
        correct: true
    explanation: ХСН со сниженной ФВ — 40% и менее, с умеренно сниженной — 41–49%, с сохранённой — 50% и более.
    cite: [2]
  - level: student
    prompt: Какие признаки СН российские рекомендации называют наиболее специфичными?
    options:
      - text: Одышка
      - text: Повышенное давление в яремных венах, гепатоюгулярный рефлюкс, третий тон
        correct: true
    explanation: Наиболее специфичные признаки — повышенное давление в яремных венах, гепатоюгулярный рефлюкс и третий тон (ритм галопа). Одышка — самый распространённый симптом, но она встречается и при многих других заболеваниях.
    cite: [2]
