questions:
  - level: patient
    prompt: Какая причина митрального стеноза самая частая?
    options:
      - text: Высокий уровень холестерина
      - text: Перенесённая ревматическая лихорадка (ревматизм)
        correct: true
      - text: Курение
    explanation: Самая частая причина митрального стеноза — перенесённая ревматическая лихорадка (ревматизм).
    cite: [2, 4]
  - level: patient
    prompt: Как обычно протекает митральный стеноз?
    options:
      - text: Долго может быть без жалоб, а на поздних этапах прогрессирует быстрее
        correct: true
      - text: С самого начала вызывает сильные жалобы
    explanation: Болезнь долго может протекать без жалоб, а на поздних этапах прогрессирует быстрее.
    cite: [2, 4]
  - level: patient
    prompt: Какая жалоба при митральном стенозе главная?
    options:
      - text: Головная боль
      - text: Зуд кожи
      - text: Одышка
        correct: true
    explanation: 'Главная жалоба — одышка: сначала при физической нагрузке, потом и в покое; со временем становится трудно дышать лёжа.'
    cite: [2]
  - level: patient
    prompt: Чем полезно УЗИ сердца через пищевод?
    options:
      - text: Измеряет уровень сахара в крови
      - text: Лучше показывает небольшие тромбы в левом предсердии
        correct: true
    explanation: Иногда нужно УЗИ сердца через пищевод — оно лучше показывает небольшие тромбы в левом предсердии.
    cite: [4]
  - level: student
    prompt: К чему предрасполагает расширение ЛП при МС?
    options:
      - text: К фибрилляции предсердий — фактору риска тромбоэмболий
        correct: true
      - text: К аортальному стенозу
    explanation: Расширение ЛП предрасполагает к фибрилляции предсердий (ФП) — фактору риска тромбоэмболий.
    cite: [4]
  - level: student
    prompt: Почему при кальцинозе митрального кольца баллонная комиссуротомия не даёт пользы?
    options:
      - text: Кальциноз со временем исчезает сам
      - text: Сращения комиссур нет
        correct: true
      - text: Створки при этом совсем не изменены
    explanation: При кальцинозе митрального кольца баллонная комиссуротомия пользы не даёт, потому что сращения комиссур нет.
    cite: [4]
