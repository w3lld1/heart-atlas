questions:
  - level: patient
    prompt: Куда несёт кровь артерия, которая сужена при этой болезни?
    options:
      - text: К руке, а своими ветвями — к почкам и надпочечникам
      - text: К руке, а своими ветвями — к шее и мозгу
        correct: true
      - text: К руке, а своими ветвями — к желудку и кишечнику
    explanation: Стеноз подключичной артерии — сужение артерии, которая несёт кровь к руке, а своими ветвями — к шее и мозгу.
    cite: [7]
  - level: patient
    prompt: Что происходит при синдроме обкрадывания, когда человек работает рукой?
    options:
      - text: Кровь уходит к руке из позвоночной артерии, питающей мозг
        correct: true
      - text: Рука забирает кровь из артерий желудка, кишечника и печени
      - text: Сердце на время работы перестаёт подавать кровь в другую руку
    explanation: Если сужение расположено до отхождения позвоночной артерии, при работе рукой кровь может уходить к руке из позвоночной артерии, которая питает мозг.
    cite: [6]
  - level: patient
    prompt: Какое исследование, по статье, делают первым?
    options:
      - text: Анализ крови на гормоны щитовидной железы
      - text: Запись электроэнцефалограммы мозга во время ночного сна
      - text: Ультразвуковое (дуплексное) исследование артерий
        correct: true
    explanation: Первое исследование — ультразвуковое (дуплексное) исследование артерий.
    cite: [1, 7]
  - level: patient
    prompt: Какой признак со стороны руки, по статье, — повод вызвать скорую?
    options:
      - text: Лёгкая сухость и шелушение кожи на ладонях после мытья посуды
      - text: Рука внезапно стала холодной, бледной и болезненной
        correct: true
      - text: Небольшой синяк на предплечье, появившийся после удара о дверь
    explanation: Скорую вызывают, если рука внезапно стала холодной, бледной и болезненной, онемела или ослабла, а пульс на ней пропал — это может быть острая закупорка артерии.
    cite: [3, 7]
  - level: student
    prompt: Кого касается коронарно-подключичное обкрадывание?
    options:
      - text: Пациентов после замены аортального клапана механическим протезом
      - text: Пациентов с кардиостимулятором, имплантированным под ключицу слева
      - text: Пациентов после АКШ с шунтом из внутренней грудной артерии
        correct: true
    explanation: Коронарно-подключичное обкрадывание касается пациентов после АКШ, у которых ипсилатеральная внутренняя грудная артерия использована как шунт; при проксимальном стенозе у них возможна ишемия миокарда.
    cite: [1]
  - level: student
    prompt: Какой метод остаётся эталонным, когда планируется эндоваскулярное лечение?
    options:
      - text: Катетерная ангиография
        correct: true
      - text: Электрокардиография в 12 отведениях
      - text: Перфузионная сцинтиграфия миокарда в покое
    explanation: КТА и МРА дают подробную анатомическую оценку поражения; катетерная ангиография остаётся эталонным методом, когда планируется эндоваскулярное лечение.
    cite: [7]
