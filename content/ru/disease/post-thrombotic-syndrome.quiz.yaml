questions:
  - level: patient
    prompt: Отдалённым последствием чего бывает посттромботическая болезнь?
    options:
      - text: Растяжения связок голеностопа
      - text: Тромбоза глубоких вен
        correct: true
      - text: Перелома костей стопы
    explanation: Посттромботическая болезнь, или посттромботический синдром, — отдалённое последствие тромбоза глубоких вен.
    cite: [1, 4]
  - level: patient
    prompt: Как в норме работают клапаны в венах ноги?
    options:
      - text: Пропускают кровь в обе стороны без задержки
      - text: Пропускают кровь только вниз, к стопе
      - text: Пропускают кровь только вверх, к сердцу
        correct: true
    explanation: В норме клапаны в венах пропускают кровь только вверх, к сердцу, и не дают ей течь назад.
    cite: [5]
  - level: patient
    prompt: Что может повредить рубцовая ткань, оставшаяся после тромба?
    options:
      - text: Ахиллово сухожилие
      - text: Коленный сустав
      - text: Клапаны вен
        correct: true
    explanation: Рубцовая ткань после тромба может повредить клапаны вен; из-за этого кровоток по венам снижается, а давление в них растёт.
    cite: [5]
  - level: patient
    prompt: При каком внезапном признаке статья советует вызывать скорую, так как это может быть тромбоэмболия лёгочной артерии?
    options:
      - text: Кашель с кровью
        correct: true
      - text: Лёгкая икота после еды
      - text: Насморк без температуры
    explanation: Если внезапно появились одышка, боль в груди, кашель с кровью или обморок, вызывайте скорую по номеру 103 или 112, так может проявляться тромбоэмболия лёгочной артерии.
    cite: [1, 3]
  - level: student
    prompt: Как MSD определяет ПТБ?
    options:
      - text: Острое воспаление мелких суставов стопы после долгой нагрузки
      - text: Симптомная хроническая венозная недостаточность после ТГВ
        correct: true
      - text: Наследственная слабость стенки лимфатических сосудов ноги
    explanation: ПТБ — симптомная хроническая венозная недостаточность после ТГВ; при ПТБ симптомы есть всегда.
    cite: [4]
  - level: student
    prompt: Что, по MSD, вызывает длительная венозная гипертензия?
    options:
      - text: Обезвоживание тканей и гипокальциемию
      - text: Отёк тканей, воспаление и гипоксию
        correct: true
      - text: Атрофию костей, гипогликемию и выпадение волос
    explanation: Длительная венозная гипертензия вызывает отёк тканей, воспаление и гипоксию.
    cite: [4]
