questions:
  - level: patient
    prompt: Клапан лёгочной артерии закрывается не полностью. Что происходит в диастолу?
    options:
      - text: Кровь из левого желудочка проходит в правый через отверстие в перегородке
      - text: Часть крови возвращается из лёгочной артерии в правый желудочек
        correct: true
      - text: Клапан остаётся сомкнутым, и кровь не выходит из правого желудочка в лёгочную артерию
    explanation: При лёгочной регургитации клапан лёгочной артерии закрывается не полностью, и во время диастолы часть крови возвращается из лёгочной артерии в правый желудочек.
    cite: [4, 5]
  - level: patient
    prompt: Как лёгочная гипертензия может приводить к лёгочной регургитации?
    options:
      - text: Высокое давление сжимает правое предсердие, и оно перестаёт наполняться
      - text: Высокое давление склеивает створки клапана, и он перестаёт открываться
      - text: Высокое давление нагружает клапан, и он начинает пропускать кровь
        correct: true
    explanation: Высокое давление в лёгочных артериях нагружает клапан, и он начинает пропускать кровь обратно.
    cite: [4, 5]
  - level: patient
    prompt: Каким обследованием подтверждают лёгочную регургитацию?
    options:
      - text: УЗИ сердца (эхокардиографией)
        correct: true
      - text: Анализом мочи на белок и на сахар
      - text: Кожной пробой на аллергию на предплечье
    explanation: 'Подтверждают её УЗИ сердца (эхокардиографией): видно протекающий клапан и сколько крови возвращается, и по этому оценивают тяжесть.'
    cite: [5]
  - level: patient
    prompt: Какими способами меняют клапан лёгочной артерии?
    options:
      - text: Лазером, которым воздействуют на кожу над сердцем через охлаждающий гель
      - text: Таблетками, от которых у клапана постепенно вырастают новые створки взамен старых
      - text: Открытой операцией или через катетер, проведённый через крупную вену
        correct: true
    explanation: 'Клапан меняют двумя способами: открытой операцией или через катетер, который проводят через крупную вену, обычно бедренную.'
    cite: [4, 8]
  - level: student
    prompt: Чем шум лёгочной регургитации обычно отличается от шума аортальной регургитации?
    options:
      - text: Усиливается на вдохе
        correct: true
      - text: Начинается одновременно с первым тоном сердца
      - text: Становится систолическим при задержке дыхания
    explanation: Шум лёгочной регургитации похож на шум аортальной регургитации, но обычно усиливается на вдохе.
    cite: [4]
  - level: student
    prompt: Какое осложнение может вызвать расширение правого желудочка при лёгочной регургитации?
    options:
      - text: Значимый митральный стеноз, который сужает путь из левого предсердия в левый желудочек
      - text: Значимую трикуспидальную регургитацию, которая ещё больше расширяет ПЖ
        correct: true
      - text: Кальциноз аортального клапана, который уменьшает правый желудочек в размерах
    explanation: Расширение правого желудочка может вызвать значимую трикуспидальную регургитацию, которая ещё больше его расширяет.
    cite: [1]
