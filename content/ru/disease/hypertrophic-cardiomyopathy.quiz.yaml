questions:
  - level: patient
    prompt: Что происходит с сердцем при гипертрофической кардиомиопатии (ГКМП)?
    options:
      - text: Сужается устье аорты
      - text: Утолщается стенка левого желудочка
        correct: true
      - text: В перегородке между предсердиями появляется отверстие
    explanation: ГКМП — преимущественно генетическое заболевание, при котором стенка левого желудочка утолщается, чаще несимметрично, за счёт межжелудочковой перегородки.
    cite: [2]
  - level: patient
    prompt: Почему при ГКМП врачи думают не только об одном человеке, но и о его семье?
    options:
      - text: ГКМП передаётся воздушно-капельным путём
      - text: Болезнь часто передаётся в семье от родителя к ребёнку
        correct: true
    explanation: Болезнь часто передаётся в семье от родителя к ребёнку. Поэтому врачи думают не только об одном человеке, но и о его семье в целом.
    cite: [1, 2]
  - level: patient
    prompt: Сколько людей с ГКМП не замечают симптомов или замечают только слабые?
    options:
      - text: До половины
        correct: true
      - text: Ни одного, симптомы выраженные у всех
    explanation: До половины людей с ГКМП не замечают симптомов или замечают только слабые.
    cite: [1, 3]
  - level: patient
    prompt: Какие исследования главные для диагностики ГКМП?
    options:
      - text: Анализ мочи
      - text: Гастроскопия
      - text: УЗИ сердца и при необходимости МРТ сердца
        correct: true
    explanation: Главное — исследования, которые показывают строение сердца — УЗИ сердца (эхокардиография) и при необходимости МРТ сердца.
    cite: [1, 3]
  - level: student
    prompt: Какая толщина миокарда левого желудочка — критерий ГКМП у взрослого пробанда?
    options:
      - text: 15 мм и больше
        correct: true
      - text: 10 мм и больше
    explanation: Толщина миокарда левого желудочка 15 мм и больше — критерий ГКМП у взрослого пробанда.
    cite: [2, 3]
  - level: student
    prompt: Чем алкогольная септальная абляция отличается от септальной миэктомии?
    options:
      - text: Результаты более предсказуемы, а риск блокады ниже
      - text: Её выполняют только при отсутствии симптомов
      - text: Восстановление быстрее, но риск полной АВ-блокады выше
        correct: true
    explanation: Алкогольная септальная абляция выполняется по тем же показаниям, восстановление после неё быстрее, но результаты менее предсказуемы, а риск полной атриовентрикулярной блокады выше.
    cite: [3]
