questions:
  - level: patient
    prompt: Где находится синусовый узел?
    options:
      - text: В стенке аорты
      - text: В правом предсердии
        correct: true
      - text: В левом желудочке
    explanation: Синусовый узел — небольшой участок правого предсердия, естественный водитель ритма сердца; его клетки сами вырабатывают электрические импульсы.
    cite: [4]
  - level: patient
    prompt: Какая главная причина синдрома слабости синусового узла?
    options:
      - text: Высокий уровень холестерина в крови
      - text: Недостаток железа в крови
      - text: Замещение ткани синусового узла фиброзной и жировой тканью с возрастом
        correct: true
    explanation: Главная причина — с возрастом ткань синусового узла замещается фиброзной (рубцовой) и жировой тканью.
    cite: [1, 4]
  - level: patient
    prompt: Когда ставят диагноз синдрома слабости синусового узла?
    options:
      - text: Когда нарушение ритма записано на ЭКГ и совпадает с жалобами
        correct: true
      - text: По рентгеновскому снимку грудной клетки
      - text: По одному измерению артериального давления
    explanation: Диагноз ставят, когда нарушение ритма записано на ЭКГ или при длительной записи ЭКГ и совпадает с жалобами.
    cite: [1, 3, 4]
  - level: patient
    prompt: Какое основное лечение синдрома слабости синусового узла с симптомами?
    options:
      - text: Замена клапана сердца
      - text: Пересадка сердца
      - text: Постоянный кардиостимулятор
        correct: true
    explanation: Основное лечение СССУ с симптомами — постоянный кардиостимулятор.
    cite: [1, 2, 3]
  - level: student
    prompt: Что чередуется при синдроме тахи-брадикардии?
    options:
      - text: Периоды повышенной и пониженной температуры тела
      - text: Приступы наджелудочковой тахиаритмии и эпизоды медленного ритма
        correct: true
      - text: Периоды высокого и низкого артериального давления
    explanation: Синдром тахи-брадикардии — чередование приступов наджелудочковой тахиаритмии (фибрилляции или трепетания предсердий) с эпизодами медленного ритма и/или асистолией желудочков.
    cite: [1]
  - level: student
    prompt: Что такое хронотропная несостоятельность?
    options:
      - text: Снижение сократимости левого желудочка
      - text: Чрезмерный подъём артериального давления при нагрузке
      - text: Неадекватный прирост частоты ритма при физической нагрузке
        correct: true
    explanation: Хронотропная несостоятельность — неадекватный прирост частоты ритма при физической нагрузке.
    cite: [2, 3]
