questions:
  - level: patient
    prompt: Что происходит с желудочками при фибрилляции желудочков?
    options:
      - text: Сокращаются реже обычного, но согласованно
      - text: Сокращаются чаще и выбрасывают больше крови
      - text: Беспорядочно дрожат и не выбрасывают кровь
        correct: true
    explanation: 'При ФЖ желудочки из-за множества хаотичных электрических импульсов не сокращаются согласованно, а только беспорядочно «дрожат». Кровь из сердца при этом не выбрасывается, поэтому ФЖ — одна из форм остановки сердца.'
    cite: [5]
  - level: patient
    prompt: Какая причина ФЖ самая частая?
    options:
      - text: Нехватка витаминов в ежедневном питании
      - text: Болезнь сердца, прежде всего ИБС
        correct: true
      - text: Простуда с насморком и болью в горле
    explanation: Самая частая причина ФЖ — болезнь сердца, прежде всего нехватка кровотока в сердечной мышце при ишемической болезни сердца, например во время инфаркта миокарда.
    cite: [5]
  - level: patient
    prompt: Чем часто оказывается остановка сердца?
    options:
      - text: Первым проявлением неизвестной болезни сердца
        correct: true
      - text: Следствием только простуды, перенесённой на ногах
      - text: Последствием только очень пожилого возраста
    explanation: Часто остановка сердца становится первым проявлением болезни сердца, о которой человек не знал.
    cite: [1, 6]
  - level: patient
    prompt: Что делает имплантируемый кардиовертер-дефибриллятор (ИКД)?
    options:
      - text: Растворяет тромбы в коронарных артериях
      - text: Сам распознаёт ФЖ и наносит разряд
        correct: true
      - text: Заменяет собой повреждённый клапан сердца
    explanation: ИКД — небольшое устройство на батарейке под кожей ниже ключицы с тонкими проводами-электродами в сердце. Он постоянно следит за ритмом, сам распознаёт ФЖ и наносит разряд.
    cite: [3, 5]
  - level: student
    prompt: Как ФЖ выглядит на ЭКГ?
    options:
      - text: Широкие одинаковые комплексы QRS при ровном ритме
      - text: Пилообразные волны F при правильном ритме желудочков
      - text: Сверхчастые нерегулярные колебания изолинии
        correct: true
    explanation: На ЭКГ ФЖ выглядит как сверхчастые колебания изолинии, нерегулярные по времени и форме.
    cite: [4]
  - level: student
    prompt: Какой механизм лежит в основе ФЖ?
    options:
      - text: Множественные волны повторного входа
        correct: true
      - text: Единственный очаг повышенного автоматизма
      - text: Полная блокада проведения в АВ-узле
    explanation: Механизм ФЖ — множественные волны повторного входа (multiple wavelet reentry).
    cite: [4]
