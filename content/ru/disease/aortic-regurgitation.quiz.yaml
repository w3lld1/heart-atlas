questions:
  - level: patient
    prompt: Что происходит с кровью при аортальной недостаточности?
    options:
      - text: Кровь из аорты уходит в лёгочную артерию
      - text: В диастолу часть крови возвращается из аорты обратно в левый желудочек
        correct: true
      - text: Кровь из левого желудочка не может попасть в аорту
    explanation: Во время диастолы — расслабления и наполнения левого желудочка — часть крови возвращается из аорты обратно в левый желудочек.
    cite: [2, 4]
  - level: patient
    prompt: Как обычно протекает хроническая аортальная недостаточность?
    options:
      - text: Годами, а иногда десятилетиями не вызывает жалоб
        correct: true
      - text: С самого начала вызывает постоянные жалобы
    explanation: Хроническая аортальная недостаточность обычно годами, а иногда десятилетиями не вызывает жалоб.
    cite: [2]
  - level: patient
    prompt: Почему при аортальной недостаточности одного осмотра недостаточно и нужна эхокардиография?
    options:
      - text: Левый желудочек может начать хуже работать ещё до появления жалоб
        correct: true
      - text: Осмотр всегда точно показывает тяжесть порока
    explanation: Не меньше чем у четверти людей левый желудочек начинает хуже работать ещё до появления жалоб, поэтому осмотра недостаточно и нужна эхокардиография.
    cite: [2]
  - level: patient
    prompt: Как можно эффективно устранить тяжёлую аортальную недостаточность?
    options:
      - text: Лечебной гимнастикой
      - text: Только операцией
        correct: true
    explanation: Единственный способ эффективно устранить тяжёлую аортальную недостаточность — операция.
    cite: [2]
  - level: student
    prompt: Как рекомендуют оценивать тяжесть АН?
    options:
      - text: Как лёгкую, умеренную и тяжёлую
        correct: true
      - text: По цифровым степеням (1, 2, 3, 4)
    explanation: По тяжести выделяют лёгкую, умеренную и тяжёлую АН; классификация по цифровым степеням (1, 2, 3, 4) не рекомендуется.
    cite: [2]
  - level: student
    prompt: Оценивают ли коронарные артерии перед операцией при тяжёлой АН, если стенокардии нет?
    options:
      - text: Нет, только при стенокардии
      - text: 'Да: примерно у 20% есть значимое поражение коронарных артерий'
        correct: true
    explanation: 'Перед операцией оценивают коронарные артерии: примерно у 20% пациентов с тяжёлой АН есть значимое поражение коронарных артерий, даже если стенокардии нет.'
    cite: [4]
