questions:
  - level: patient
    prompt: Как обычно проявляется повышенный холестерин сам по себе?
    options:
      - text: Всегда сразу вызывает заметные жалобы
      - text: Обычно никак, многие люди не замечают никаких жалоб
        correct: true
    explanation: Повышенный холестерин сам по себе обычно ничем себя не выдаёт, многие люди с высоким уровнем липидов не замечают никаких жалоб.
    cite: [1, 4]
  - level: patient
    prompt: Как находят дислипидемию?
    options:
      - text: По анализу крови — липидному профилю
        correct: true
      - text: По измерению артериального давления
      - text: По рентгеновскому снимку грудной клетки
    explanation: Дислипидемию находят по анализу крови — липидному профилю. В нём смотрят общий холестерин, холестерин ЛНП и ЛВП, триглицериды.
    cite: [1, 3, 4]
  - level: patient
    prompt: Кому рекомендуют сдать липидный профиль, чтобы оценить риск болезней сердца и сосудов?
    options:
      - text: Только людям, у которых уже есть жалобы на сердце
      - text: Только людям с лишним весом
      - text: Всем людям старше 40 лет
        correct: true
    explanation: Всем людям старше 40 лет рекомендуют сдать этот анализ, чтобы оценить риск болезней сердца и сосудов.
    cite: [1]
  - level: patient
    prompt: К какой болезни артерий ведёт дислипидемия?
    options:
      - text: К миокардиту — воспалению сердечной мышцы
      - text: К атеросклерозу, из-за которого развиваются инфаркт и инсульт
        correct: true
      - text: К варикозному расширению вен
    explanation: Дислипидемия ведёт к атеросклерозу — болезни артерий, из-за которой развиваются инфаркт и инсульт.
    cite: [1, 4]
  - level: student
    prompt: Какой тип наследования у семейной гиперхолестеринемии (СГХС)?
    options:
      - text: Х-сцепленный рецессивный
      - text: Митохондриальный
      - text: Аутосомно-доминантный
        correct: true
    explanation: СГХС — аутосомно-доминантное заболевание, обусловленное мутациями генов LDLR, APOB и PCSK9, со стойким повышением ХС ЛНП и ранним развитием атеросклероза.
    cite: [1]
  - level: student
    prompt: Как снижение ХС ЛНП связано с риском атеросклеротических ССЗ?
    options:
      - text: Уменьшает риск пропорционально абсолютному снижению ХС ЛНП
        correct: true
      - text: Не влияет на риск
      - text: Увеличивает риск
    explanation: ХС ЛНП причинно связан с риском атеросклеротических ССЗ, а снижение ХС ЛНП уменьшает этот риск пропорционально абсолютному снижению.
    cite: [2]
