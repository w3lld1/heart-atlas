questions:
  - level: patient
    prompt: Что откладывается в тканях сердца при амилоидозе сердца?
    options:
      - text: Соли кальция
      - text: Амилоид — белок особого волокнистого строения
        correct: true
      - text: Холестерин
    explanation: Амилоидоз сердца — болезнь, при которой в тканях сердца откладывается амилоид, белок особого волокнистого строения.
    cite: [3]
  - level: patient
    prompt: Какой орган вырабатывает транстиретин — белок, который откладывается при ATTR-амилоидозе?
    options:
      - text: Селезёнка
      - text: Поджелудочная железа
      - text: Печень
        correct: true
    explanation: При ATTR-амилоидозе откладывается белок транстиретин, который вырабатывает печень.
    cite: [6]
  - level: patient
    prompt: Какое несоответствие между обследованиями характерно для амилоидоза сердца?
    options:
      - text: На эхокардиографии стенки толстые, а на ЭКГ сигналы низкие
        correct: true
      - text: На эхокардиографии стенки тонкие, а на ЭКГ сигналы высокие
      - text: На эхокардиографии стенки обычные, а на ЭКГ сигналы высокие
    explanation: Характерная подсказка — несоответствие. На эхокардиографии стенки сердца толстые, а на ЭКГ электрические сигналы низкие.
    cite: [3]
  - level: patient
    prompt: У кого гораздо чаще встречается ATTR-амилоидоз «дикого типа»?
    options:
      - text: У женщин
      - text: У мужчин
        correct: true
      - text: Одинаково часто у мужчин и женщин
    explanation: Амилоидоз «дикого типа» обычно поражает сердце и у мужчин встречается гораздо чаще, чем у женщин.
    cite: [6]
  - level: student
    prompt: Чем окрашивают срезы биопсии для гистологического подтверждения амилоидоза?
    options:
      - text: Гематоксилином и эозином
      - text: По Граму
      - text: Конго красным
        correct: true
    explanation: Амилоидоз подтверждают, находя фибриллярные отложения в поражённом органе; срезы окрашивают конго красным.
    cite: [4]
  - level: student
    prompt: Какой признак на МРТ сердца с контрастом характерен для амилоидоза?
    options:
      - text: Глобальное субэндокардиальное или трансмуральное LGE
        correct: true
      - text: Отсутствие позднего контрастирования (LGE)
      - text: Снижение нативного T1
    explanation: 'Признаки амилоидоза на МРТ: глобальное субэндокардиальное или трансмуральное позднее контрастирование (LGE), повышение нативного T1 и ECV.'
    cite: [2]
