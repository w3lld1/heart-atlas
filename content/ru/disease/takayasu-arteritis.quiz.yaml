questions:
  - level: patient
    prompt: Что такое артериит Такаясу?
    options:
      - text: Врождённый порок клапанов сердца
      - text: Воспаление стенки аорты, её ветвей и лёгочных артерий
        correct: true
      - text: Отложение холестерина в стенках артерий, то есть атеросклероз
    explanation: Неспецифический аортоартериит, или артериит Такаясу, — воспаление стенки аорты, её ветвей и лёгочных артерий.
    cite: [1, 3]
  - level: patient
    prompt: Кто чаще всего болеет артериитом Такаясу?
    options:
      - text: Только новорождённые дети
      - text: В основном мужчины старше 70 лет
      - text: В основном молодые женщины
        correct: true
    explanation: Болезнь редкая, чаще встречается в Азии, но бывает во всём мире, и болеют ею в основном молодые женщины.
    cite: [3]
  - level: patient
    prompt: Как подтверждают диагноз?
    options:
      - text: Визуализацией аорты и её ветвей, например МР- или КТ-ангиографией
        correct: true
      - text: Анализом крови, ведь повышенные СОЭ и С-реактивный белок подтверждают диагноз
      - text: Только выслушиванием сердца, без других обследований
    explanation: Диагноз подтверждают визуализацией всей аорты и её ветвей — МР- или КТ-ангиографией. Анализы крови часто показывают воспаление, но подтвердить диагноз не могут.
    cite: [2, 3]
  - level: patient
    prompt: Что верно о новых сужениях артерий при артериите Такаясу?
    options:
      - text: Они появляются только в первые несколько недель болезни
      - text: Их всегда сразу выдают самочувствие и анализы крови
      - text: Они бывают и при нормальном самочувствии и анализах
        correct: true
    explanation: Новые сужения могут появляться даже тогда, когда самочувствие и анализы в норме, поэтому аорту и крупные артерии регулярно обследуют.
    cite: [3]
  - level: student
    prompt: Сколько диагностических критериев из таблицы ACC/AHA нужно для диагноза?
    options:
      - text: Достаточно одного любого критерия
      - text: 3 и более критериев
        correct: true
      - text: Все 6 критериев одновременно
    explanation: По таблице ACC/AHA диагноз устанавливают при 3 и более критериях (чувствительность 90,5%, специфичность 97,8%).
    cite: [2]
  - level: student
    prompt: Почему, по MSD, стентирование при артериите Такаясу обычно не рекомендуется?
    options:
      - text: Из-за высокой частоты рестенозов
        correct: true
      - text: Шунты из аутологичных сосудов дают худшую проходимость, чем стенты
      - text: Стент при этой болезни установить технически невозможно
    explanation: По MSD, стентирование обычно не рекомендуется из-за высокой частоты рестенозов, а лучшую проходимость дают шунты из аутологичных сосудов.
    cite: [3]
