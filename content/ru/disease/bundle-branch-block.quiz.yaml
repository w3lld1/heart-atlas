questions:
  - level: patient
    prompt: Что такое блокада ножки пучка Гиса?
    options:
      - text: Сужение одной из артерий, питающих сердце
      - text: Прерывание проведения импульса по ножке пучка Гиса
        correct: true
      - text: Прерывание проведения импульса от предсердий к желудочкам
    explanation: Блокада ножки пучка Гиса — частичное или полное прерывание проведения электрического импульса по правой или левой ножке пучка Гиса. Прерывание проведения от предсердий к желудочкам называют атриовентрикулярной блокадой.
    cite: [1, 5, 6]
  - level: patient
    prompt: Какие ощущения обычно вызывает блокада ножки?
    options:
      - text: Постоянную сильную боль в груди
      - text: Одышку даже в покое
      - text: Никаких ощущений
        correct: true
    explanation: Блокада ножки обычно не вызывает никаких ощущений.
    cite: [2, 6]
  - level: patient
    prompt: Почему при блокаде левой ножки врачу важно сравнить новую ЭКГ с записанной раньше?
    options:
      - text: Блокада сама может давать подъём ST, как при инфаркте
        correct: true
      - text: Блокада левой ножки совсем не видна на обычной ЭКГ в покое
      - text: Новую ЭКГ без старой записи технически невозможно снять
    explanation: Блокада левой ножки сама может давать на ЭКГ подъём сегмента ST, как при инфаркте, и мешает судить по ЭКГ о перенесённом инфаркте. Поэтому врачу важно сравнить новую ЭКГ с записанной раньше.
    cite: [3, 5]
  - level: patient
    prompt: Когда человеку с блокадой ножки нужно вызвать скорую?
    options:
      - text: Чихание пару раз за утро
      - text: Зевота перед сном
      - text: Обморок
        correct: true
    explanation: Экстренную помощь при обмороках из-за медленного ритма начинает бригада скорой медицинской помощи.
    cite: [1]
  - level: student
    prompt: Как блокады ножек влияют на ЭКГ-критерии перенесённого инфаркта?
    options:
      - text: При обеих блокадах обычные критерии неприменимы
      - text: БПНПГ существенно не мешает, при БЛНПГ они неприменимы
        correct: true
      - text: БЛНПГ существенно не мешает, а при БПНПГ они неприменимы
    explanation: БПНПГ существенно не мешает ЭКГ-критериям перенесённого инфаркта, а при БЛНПГ обычные критерии неприменимы.
    cite: [5]
  - level: student
    prompt: Из каких трёх пучков состоит проводящая система желудочков по ЭКГ-классификации Минздрава?
    options:
      - text: Правая ножка, передняя и задняя ветви левой ножки
        correct: true
      - text: Синусовый узел, атриовентрикулярный узел и пучок Гиса
      - text: Левая ножка, передняя и задняя ветви правой ножки
    explanation: 'По электрокардиографической классификации, которую приводит Минздрав, проводящая система желудочков состоит из трёх пучков: правой ножки и передней и задней ветвей левой ножки.'
    cite: [1]
