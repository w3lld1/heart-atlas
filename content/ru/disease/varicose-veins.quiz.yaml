questions:
  - level: patient
    prompt: Что происходит с током крови в варикозных венах?
    options:
      - text: Кровь в них течёт к сердцу быстрее, чем обычно
      - text: Кровь в них течёт в обратную сторону
        correct: true
      - text: Кровь в них не задерживается, и вена пустеет
    explanation: В варикозных венах кровь течёт в обратную сторону. Створки клапанов расходятся, и в положении стоя кровь стекает назад, вниз; она застаивается в вене и растягивает её ещё сильнее.
    cite: [1, 3, 5]
  - level: patient
    prompt: Как варикозная болезнь связана с наследственностью?
    options:
      - text: Это генетическая болезнь, и образ жизни на неё никак не влияет
      - text: Её вызывают только внешние факторы, наследственность не важна
      - text: Слабость стенки вены наследуется, но нужны и внешние факторы
        correct: true
    explanation: 'В основе болезни лежит наследственная слабость стенки вены. При этом варикозная болезнь не генетическое заболевание: чтобы она появилась, нужны внешние факторы, прежде всего образ жизни.'
    cite: [1]
  - level: patient
    prompt: Когда жалобы при варикозе обычно усиливаются?
    options:
      - text: К концу дня и при долгом стоянии или сидении
        correct: true
      - text: Утром, сразу после ночного отдыха лёжа в постели
      - text: Во время ходьбы, а при долгом стоянии проходят
    explanation: Жалобы усиливаются к концу дня и при долгом стоянии или сидении, а после ходьбы или отдыха лёжа ослабевают.
    cite: [1]
  - level: patient
    prompt: Как можно избавиться от уже появившихся варикозных вен?
    options:
      - text: Принимать таблетки, пока вены не исчезнут
      - text: Удалить вену или закрыть её изнутри
        correct: true
      - text: Мазать ноги мазью, пока вены не рассосутся
    explanation: 'Уже появившиеся варикозные вены не исчезают от таблеток, мазей или чулок; лечение без вмешательства лишь уменьшает симптомы. Их можно только удалить или закрыть изнутри: нагревом, без нагрева или введением специального вещества (склеротерапия).'
    cite: [1]
  - level: student
    prompt: Какой диаметр в положении стоя у подкожных вен, которые Минздрав считает варикозно расширенными?
    options:
      - text: Менее 1 мм
      - text: От 1 до 3 мм
      - text: Более 3 мм
        correct: true
    explanation: Варикозно расширенными считают подкожные вены диаметром более 3 мм в положении стоя; телеангиэктазы — внутрикожные вены диаметром менее 1 мм, ретикулярные вены — 1–3 мм.
    cite: [1]
  - level: student
    prompt: Какой, по данным Минздрава, бывает частота новых варикозных вен через 5 лет после вмешательства?
    options:
      - text: Достигает 50%
        correct: true
      - text: Не превышает 1%
      - text: Новые вены после вмешательства не появляются
    explanation: По данным Минздрава, после вмешательства частота появления новых варикозных вен достигает 30% через 3 года и 50% через 5 лет; повторное устранение варикозных вен можно выполнять неограниченное число раз.
    cite: [1]
