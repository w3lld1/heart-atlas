questions:
  - level: patient
    prompt: Что происходит с правым желудочком при стенозе клапана лёгочной артерии?
    options:
      - text: Он сокращается с большей силой, и его стенка постепенно утолщается
        correct: true
      - text: Его стенка постепенно истончается
      - text: Он перестаёт сокращаться
    explanation: Чтобы протолкнуть кровь через узкий клапан, правому желудочку приходится сокращаться с большей силой; давление в нём растёт, а мышечная стенка постепенно утолщается.
    cite: [1]
  - level: patient
    prompt: Какое исследование главное для диагноза?
    options:
      - text: Общий анализ крови
      - text: Измерение артериального давления
      - text: УЗИ сердца (эхокардиография) с допплером
        correct: true
    explanation: Главное исследование — УЗИ сердца с допплером; оно подтверждает диагноз, показывает уровень сужения и позволяет оценить его тяжесть.
    cite: [1, 2, 3]
  - level: patient
    prompt: Какой основной способ лечения стеноза клапана лёгочной артерии?
    options:
      - text: Пересадка сердца
      - text: Баллонная вальвулопластика
        correct: true
      - text: Пожизненный приём лекарств всеми пациентами
    explanation: Основной способ лечения — баллонная вальвулопластика; катетер с баллоном проводят к клапану и раздувают баллон, чтобы расширить суженный клапан.
    cite: [1, 2, 3]
  - level: patient
    prompt: Как может проявиться критический стеноз у новорождённого?
    options:
      - text: Синюшностью и недостаточностью кровообращения
        correct: true
      - text: Икотой после кормления
      - text: Чиханием
    explanation: Критический стеноз у новорождённого может проявиться синюшностью и недостаточностью кровообращения и требует неотложного вмешательства; если синеют губы и кожа, сразу вызывайте скорую.
    cite: [1]
  - level: student
    prompt: Какой пиковый допплеровский градиент ESC относит к тяжёлой обструкции?
    options:
      - text: Менее 36 мм рт. ст.
      - text: 36–64 мм рт. ст.
      - text: Более 64 мм рт. ст.
        correct: true
    explanation: По ESC лёгкая обструкция — менее 36 мм рт. ст., умеренная — 36–64, тяжёлая — более 64 мм рт. ст. (при нормальной функции ПЖ и нормальном трансклапанном потоке).
    cite: [2]
  - level: student
    prompt: Что происходит с лёгочным компонентом II тона по мере утяжеления стеноза?
    options:
      - text: Становится громче
      - text: Становится тише
        correct: true
      - text: Не меняется
    explanation: При аускультации II тон широко расщеплён; по мере утяжеления стеноза лёгочный компонент II тона становится тише.
    cite: [2, 3]
