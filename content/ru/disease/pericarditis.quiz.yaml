questions:
  - level: patient
    prompt: Что такое перикардит?
    options:
      - text: Воспаление перикарда — оболочки сердца
        correct: true
      - text: Сужение аортального клапана
      - text: Тромб в лёгочной артерии
    explanation: Перикардит — это воспалительный процесс в перикарде, оболочке сердца.
    cite: [2]
  - level: patient
    prompt: Какая боль в груди типична для перикардита?
    options:
      - text: Ослабевает на вдохе и в положении лёжа
      - text: Острая, усиливается на вдохе и лёжа, слабеет сидя с наклоном вперёд
        correct: true
      - text: Боли в груди при перикардите не бывает
    explanation: Главный симптом — боль в груди. Обычно это острая боль, которая усиливается на вдохе и в положении лёжа и ослабевает, если сесть и наклониться вперёд.
    cite: [1]
  - level: patient
    prompt: Что чаще всего стоит за перикардитом в развитых странах?
    options:
      - text: Перелом рёбер
      - text: Туберкулёз
      - text: Причину найти не удаётся или перикардит вызван вирусом
        correct: true
    explanation: В развитых странах чаще всего причину найти не удаётся или перикардит вызван вирусом. Туберкулёз — главная причина в развивающихся странах.
    cite: [1, 2]
  - level: patient
    prompt: При каких жалобах человеку с перикардитом нужно вызывать скорую?
    options:
      - text: При приступах резкой слабости, головокружении, обмороках, усилении одышки
        correct: true
      - text: Ни при каких, перикардит никогда не угрожает жизни
    explanation: Перикардит может осложниться тампонадой сердца, а это состояние угрожает жизни. Основные жалобы при тампонаде или её угрозе — приступы резкой слабости, головокружение, обмороки, усиление одышки. При таких жалобах вызывайте скорую.
    cite: [1, 2]
  - level: student
    prompt: Как давно, по определению, началось заболевание при остром перикардите?
    options:
      - text: Более года назад
      - text: Не более 4 недель назад
        correct: true
      - text: Более 3 месяцев назад
    explanation: Острый перикардит — воспалительный перикардиальный синдром с выпотом или без него, с началом не более 4 недель назад.
    cite: [1]
  - level: student
    prompt: Какой признак называют патогномоничным для тампонады сердца?
    options:
      - text: Голосистолический шум на верхушке
      - text: Повышение систолического давления на вдохе
      - text: Парадоксальный пульс, падение систолического давления на вдохе более 10 мм рт. ст.
        correct: true
    explanation: Патогномоничный признак тампонады — парадоксальный пульс, снижение систолического давления более чем на 10 мм рт. ст. на вдохе при спокойном дыхании.
    cite: [2]
