questions:
  - level: patient
    prompt: Что такое инфекционный эндокардит?
    options:
      - text: Врождённое отверстие в перегородке сердца
      - text: Сужение коронарных артерий
      - text: Воспаление внутренней оболочки сердца, вызванное бактериями или грибами
        correct: true
    explanation: Инфекционный эндокардит — инфекционно-воспалительное заболевание внутренней оболочки сердца (эндокарда) на клапанах и стенках сердца, а также искусственных внутрисердечных устройств. Его вызывают бактерии или грибы.
    cite: [2]
  - level: patient
    prompt: Какие проявления эндокардита самые частые?
    options:
      - text: Повышенная температура и новый шум в сердце
        correct: true
      - text: Насморк и чихание
      - text: Жалоб не бывает никогда
    explanation: Самые частые проявления — повышенная температура и новый шум в сердце, который слышит врач.
    cite: [1, 2]
  - level: patient
    prompt: Какие исследования главные при подозрении на эндокардит?
    options:
      - text: Анализ мочи и рентген стопы
      - text: Посев крови и УЗИ сердца (эхокардиография)
        correct: true
      - text: Только измерение артериального давления
    explanation: Главные исследования — посев крови, чтобы найти возбудителя, и УЗИ сердца (эхокардиография).
    cite: [1, 2]
  - level: patient
    prompt: Что делать человеку из группы риска эндокардита, если температура поднялась без понятной причины?
    options:
      - text: Ничего не говорить врачу о риске
      - text: Сообщить врачу, что он в группе риска эндокардита
        correct: true
    explanation: Если у человека из группы риска эндокардита (например, с протезом клапана или перенесённым эндокардитом) поднялась температура без понятной причины, нужно сообщить врачу, что он в группе риска.
    cite: [1]
  - level: student
    prompt: Что, по ESC, остаётся основой диагностики инфекционного эндокардита?
    options:
      - text: Положительные гемокультуры
        correct: true
      - text: Анализ мочи
      - text: Рентгенография кисти
    explanation: Положительные гемокультуры остаются основой диагностики ИЭ; эхокардиография — метод визуализации первой линии.
    cite: [1]
  - level: student
    prompt: Почему при инфекционном эндокардите часты эмболические осложнения?
    options:
      - text: Вегетации прочно срастаются со створкой и не отрываются
      - text: Из-за сужения коронарных артерий
      - text: Вегетации непрочно связаны с эндокардом и легко отрываются
        correct: true
    explanation: Вегетации или их фрагменты непрочно связаны с эндокардом и легко отрываются, поэтому более чем у трети пациентов возникают эмболические осложнения.
    cite: [2]
