questions:
  - level: patient
    prompt: Как наследуется болезнь Фабри?
    options:
      - text: Сцепленно с Y-хромосомой
      - text: Сцепленно с X-хромосомой
        correct: true
      - text: Только от матери к дочери
    explanation: Ген GLA находится на X-хромосоме, поэтому болезнь наследуется сцепленно с X-хромосомой.
    cite: [1]
  - level: patient
    prompt: Бывают ли проявления болезни Фабри у женщин?
    options:
      - text: Да, у многих носительниц гена
        correct: true
      - text: Нет, болеют только мужчины
      - text: Нет, женщины не бывают носительницами
    explanation: Болеют не только мужчины. По данным клинических рекомендаций, проявления болезни есть у 60–70% женщин-носительниц, иногда такие же тяжёлые, как у мужчин, хотя обычно у женщин болезнь протекает легче.
    cite: [1]
  - level: patient
    prompt: Какой признак со стороны сердца характерен для болезни Фабри?
    options:
      - text: Отверстие в перегородке между предсердиями
      - text: Истончение стенки правого предсердия
      - text: Утолщение стенки левого желудочка
        correct: true
    explanation: Характерный признак — утолщение стенки левого желудочка, из-за которого болезнь бывает похожа на гипертрофическую кардиомиопатию.
    cite: [1, 5]
  - level: patient
    prompt: Почему для женщин особенно важен генетический анализ?
    options:
      - text: Анализы крови женщинам вообще не делают
      - text: Активность фермента у них часто нормальная
        correct: true
      - text: Гена GLA у женщин в организме не бывает совсем
    explanation: У женщин активность фермента часто остаётся нормальной, поэтому для них особенно важен генетический анализ.
    cite: [1, 2]
  - level: student
    prompt: Что в основном даёт гипертрофию левого желудочка при болезни Фабри?
    options:
      - text: Отложения кальция в створках клапанов
      - text: Скопление жидкости в полости перикарда
      - text: Гипертрофия миоцитов и фиброз
        correct: true
    explanation: 'Гипертрофию нельзя объяснить только отложениями в миоцитах и проводящей ткани: важнее гипертрофия миоцитов и фиброз.'
    cite: [1]
  - level: student
    prompt: Какую особенность родословной ESC относит к «красным флагам» болезни Андерсона–Фабри?
    options:
      - text: Отсутствие передачи от отца к сыну
        correct: true
      - text: Передачу только от отца к сыну
      - text: Передачу только через поколение по мужской линии
    explanation: Отсутствие передачи от отца к сыну в родословной ESC относит к «красным флагам» болезни Андерсона–Фабри.
    cite: [2]
