questions:
  - level: patient
    prompt: Когда появляется дополнительный путь проведения при WPW?
    options:
      - text: В пожилом возрасте
      - text: Ещё до рождения
        correct: true
      - text: После перенесённой простуды
    explanation: 'Дополнительный путь появляется ещё до рождения: в норме мышца предсердий и желудочков полностью разделяется, а здесь разделение остаётся неполным.'
    cite: [1, 2]
  - level: patient
    prompt: Какой главный признак синдрома WPW?
    options:
      - text: Приступы частого ровного сердцебиения, которые внезапно начинаются и заканчиваются
        correct: true
      - text: Постоянный редкий пульс
      - text: Боль в суставах
    explanation: Главный признак — приступы частого ровного сердцебиения, которые внезапно начинаются и внезапно заканчиваются.
    cite: [3]
  - level: patient
    prompt: Какое исследование при WPW главное?
    options:
      - text: Анализ мочи
      - text: Гастроскопия
      - text: ЭКГ — признаки предвозбуждения видны на ней и вне приступа
        correct: true
    explanation: 'Главное исследование — ЭКГ: признаки предвозбуждения видны на ней и вне приступа.'
    cite: [2, 3]
  - level: patient
    prompt: Что делают при катетерной аблации при WPW?
    options:
      - text: Заменяют клапан сердца протезом
      - text: Через сосуд проводят катетер к сердцу и прицельно воздействуют на дополнительный путь
        correct: true
    explanation: 'Чтобы избавиться от приступов надолго, применяют катетерную аблацию: через сосуд к сердцу проводят катетер и прицельно воздействуют на дополнительный путь.'
    cite: [1, 3]
  - level: student
    prompt: Какая аритмия жизнеугрожающая при манифестирующем синдроме WPW?
    options:
      - text: Фибрилляция или трепетание предсердий
        correct: true
      - text: Синусовая брадикардия
    explanation: 'Жизнеугрожающая аритмия при манифестирующем синдроме WPW — фибрилляция или трепетание предсердий: при коротком антеградном рефрактерном периоде ДАВС проведение на желудочки с высокой частотой может привести к фибрилляции желудочков.'
    cite: [1, 2]
  - level: student
    prompt: Какая ЭКГ покоя типична для манифестирующего ДПП?
    options:
      - text: Удлинённый PR без дельта-волны и узкий QRS
      - text: Короткий PR, дельта-волна в начале QRS и широкий QRS
        correct: true
    explanation: 'Типичная ЭКГ покоя при манифестирующем ДПП: короткий интервал PR (менее 120 мс), дельта-волна в начальной части комплекса QRS и широкий QRS (более 120 мс).'
    cite: [1, 2]
