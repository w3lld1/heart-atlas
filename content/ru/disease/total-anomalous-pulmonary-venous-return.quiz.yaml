questions:
  - level: patient
    prompt: Что такое тотальный аномальный дренаж лёгочных вен?
    options:
      - text: Сужение аортального клапана, из-за которого сердцу трудно выбрасывать кровь
      - text: Ни одна лёгочная вена не соединяется с левым предсердием
        correct: true
      - text: Отверстие в перегородке между двумя желудочками сердца
    explanation: Тотальный аномальный дренаж лёгочных вен — врождённый порок сердца, при котором ни одна лёгочная вена не соединяется напрямую с левым предсердием.
    cite: [1, 3]
  - level: patient
    prompt: Почему жизнь новорождённого с этим пороком зависит от отверстия между предсердиями?
    options:
      - text: Через это отверстие воздух из лёгких попадает прямо в полость сердца
      - text: Оно управляет частотой сердечных сокращений
      - text: Только через него кровь из лёгких попадает в левые отделы сердца
        correct: true
    explanation: К левым отделам сердца и дальше к органам тела кровь из лёгких может пройти только через отверстие в перегородке между предсердиями. Поэтому жизнь новорождённого зависит от того, есть ли такое отверстие и какого оно размера.
    cite: [1, 3]
  - level: patient
    prompt: Что происходит, если путь крови из лёгких к сердцу сужен?
    options:
      - text: Кровь застаивается в лёгких, и давление в них растёт
        correct: true
      - text: Кровь в лёгких начинает течь быстрее и легче, чем в норме
      - text: Лёгкие становятся меньше и перестают расти
    explanation: 'Если путь сужен, кровь застаивается в лёгких и давление в них растёт, так что лёгкие не могут нормально работать. Такая форма — показание для экстренной госпитализации, а операцию делают в экстренном порядке.'
    cite: [1, 3, 4]
  - level: patient
    prompt: Что делает хирург во время операции?
    options:
      - text: Удаляет одно из лёгких
      - text: Направляет лёгочные вены в левое предсердие
        correct: true
      - text: Заменяет сердце ребёнка донорским сердцем целиком
    explanation: 'Во время операции хирург направляет лёгочные вены в левое предсердие: широко соединяет коллектор с задней стенкой левого предсердия, перекрывает лишний путь к венам тела и закрывает отверстие между предсердиями заплатой.'
    cite: [1, 3]
  - level: student
    prompt: Какая тень видна на рентгенограмме при дренаже в левую безымянную вену?
    options:
      - text: Тень в виде «сапожка»
      - text: Тень в виде «яйца на боку»
      - text: Тень в виде «восьмёрки»
        correct: true
    explanation: На рентгенограмме при дренаже в левую безымянную вену видна тень в виде «восьмёрки»; в MSD Manuals её сравнивают со «снеговиком».
    cite: [1, 3]
  - level: student
    prompt: Что характерно для ЭКГ при ТАДЛВ?
    options:
      - text: Признаки перегрузки правых отделов сердца
        correct: true
      - text: Признаки перегрузки только левого желудочка
      - text: Отклонение электрической оси сердца влево
    explanation: 'На ЭКГ — признаки перегрузки правых отделов: высокий остроконечный зубец P, гипертрофия правого желудочка, часто в виде неполной блокады правой ножки пучка Гиса.'
    cite: [1]
