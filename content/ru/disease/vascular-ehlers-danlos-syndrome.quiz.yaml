questions:
  - level: patient
    prompt: Изменение какого гена вызывает этот тип синдрома?
    options:
      - text: Гена гемоглобина, белка эритроцитов
      - text: Гена коллагена III типа (COL3A1)
        correct: true
      - text: Гена инсулина, гормона поджелудочной железы
    explanation: Этот тип синдрома вызывают патогенные варианты гена COL3A1, гена коллагена III типа.
    cite: [1, 3]
  - level: patient
    prompt: Чем, по статье, подтверждают диагноз?
    options:
      - text: Анализом крови на уровень сахара
      - text: Записью электрокардиограммы в покое
      - text: Генетическим тестом
        correct: true
    explanation: Диагноз ставят по клиническим признакам и подтверждают генетическим тестом.
    cite: [4]
  - level: patient
    prompt: Почему операции на сосудах при этом синдроме рискованнее обычного?
    options:
      - text: Сосуды хрупкие, и кровотечения вероятнее
        correct: true
      - text: Сосуды очень узкие, и инструменты в них не проходят
      - text: Стенка сосудов слишком толстая и жёсткая для швов
    explanation: Операции на сосудах при этом синдроме рискованнее обычного из-за хрупкости сосудов и кровотечений.
    cite: [1, 3]
  - level: patient
    prompt: Какой признак возможного расслоения аорты, по статье, — повод сразу вызвать скорую?
    options:
      - text: Лёгкий насморк и заложенность носа без температуры
      - text: Резко начавшаяся сильная боль в груди или спине
        correct: true
      - text: Сухость и шелушение кожи на руках после мытья посуды
    explanation: При резко начавшейся сильной боли в груди или спине (иногда в животе), особенно если она сильнее всего в первый момент, нужно сразу вызвать скорую.
    cite: [1]
  - level: student
    prompt: К какой группе болезней аорты ACC/AHA относят этот тип?
    options:
      - text: К атеросклеротическим болезням брюшной аорты и её крупных ветвей
      - text: К воспалительным болезням грудной аорты, то есть аортитам
      - text: К синдромальным наследственным болезням грудной аорты (HTAD)
        correct: true
    explanation: Этот тип синдрома Элерса — Данло относится к синдромальным наследственным болезням грудной аорты (HTAD) вместе с синдромом Марфана и синдромом Лойса — Дитца.
    cite: [1]
  - level: student
    prompt: Что при этом типе ACC/AHA и Минздрав рекомендуют при неосложнённой торакоабдоминальной аневризме, требующей вмешательства?
    options:
      - text: Открытую операцию
        correct: true
      - text: Эндоваскулярное протезирование аорты
      - text: Динамическое наблюдение без вмешательства
    explanation: При неосложнённой торакоабдоминальной аневризме, требующей вмешательства, ACC/AHA и Минздрав рекомендуют открытую операцию, а не эндоваскулярную.
    cite: [1, 3]
