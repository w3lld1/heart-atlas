questions:
  - level: patient
    prompt: Каким путём кровь выходит из левого желудочка при этом пороке?
    options:
      - text: Через сосуд, который отходит от левого желудочка к лёгким
      - text: Через отверстие в перегородке между желудочками
        correct: true
      - text: Через открытое овальное окно в правое предсердие
    explanation: Почти всегда при этом пороке есть дефект межжелудочковой перегородки, и только через него кровь может выйти из левого желудочка.
    cite: [2, 3]
  - level: patient
    prompt: Какие признаки у младенца с этим пороком описаны в статье?
    options:
      - text: Жёлтая кожа и светлый стул после кормлений
      - text: Сыпь на щеках и припухшие суставы пальцев
      - text: Частое дыхание и синеватые губы
        correct: true
    explanation: У младенца может быть частое дыхание, он плохо сосёт и быстро устаёт, а губы, ногтевые ложа и кожа могут синеть.
    cite: [3]
  - level: patient
    prompt: Каким исследованием подтверждают диагноз этого порока?
    options:
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: Анализ крови на уровень холестерина
      - text: Суточное измерение артериального давления дома
    explanation: Диагноз подтверждают с помощью УЗИ сердца (эхокардиографии).
    cite: [3]
  - level: patient
    prompt: Как, по статье, исправляют этот порок?
    options:
      - text: Дыхательной гимнастикой и массажем грудной клетки
      - text: Хирургически, с помощью операции
        correct: true
      - text: Сменой питания и режима сна ребёнка
    explanation: 'Лекарства при этом пороке помогают, но без операции не обойтись: порок исправляют хирургически.'
    cite: [2, 3]
  - level: student
    prompt: Как называют вариант, при котором лёгочный клапан прилежит к ДМЖП или нависает над ним?
    options:
      - text: Синдром гипоплазии левых отделов сердца
      - text: Аномалия Эбштейна
      - text: Аномалия Тауссиг — Бинга
        correct: true
    explanation: Если лёгочный клапан непосредственно прилежит к дефекту или частично нависает над ним, порок называют аномалией Тауссиг — Бинга.
    cite: [2]
  - level: student
    prompt: На какой порок, по MSD Manuals, похожа картина при субаортальном ДМЖП со стенозом ЛА?
    options:
      - text: Тетрада Фалло
        correct: true
      - text: Дефект межпредсердной перегородки
      - text: Гипертрофическая кардиомиопатия
    explanation: 'Если при субаортальном ДМЖП есть стеноз ЛА, в аорту направляется больше десатурированной крови из ПЖ: развивается цианоз, и картина похожа на тетраду Фалло.'
    cite: [2]
