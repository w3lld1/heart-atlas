questions:
  - level: patient
    prompt: Что такое инфаркт миокарда?
    options:
      - text: Воспаление наружной оболочки сердца из-за инфекции
      - text: Гибель участка сердечной мышцы от нехватки крови
        correct: true
      - text: Врождённое сужение клапана между сердцем и аортой
    explanation: Инфаркт миокарда — гибель участка сердечной мышцы из-за того, что к ней не хватает крови и кислорода.
    cite: [1, 6]
  - level: patient
    prompt: Какое исследование делают в течение 10 минут там, где человека впервые осмотрели медики?
    options:
      - text: Рентгеновский снимок костей стопы
      - text: Общий анализ мочи на сахар
      - text: Электрокардиограмму (ЭКГ)
        correct: true
    explanation: ЭКГ записывают там, где человека впервые осмотрели медики, — в течение 10 минут.
    cite: [1, 3]
  - level: patient
    prompt: Чем со временем замещается погибшая сердечная мышца?
    options:
      - text: Рубцом, который не сокращается
        correct: true
      - text: Новой мышцей, которая сокращается сильнее прежней
      - text: Хрящом, который сокращается вместе с сердцем
    explanation: Погибшая мышца со временем замещается рубцом, который не сокращается.
    cite: [7]
  - level: patient
    prompt: Почему при признаках инфаркта скорую нужно вызывать сразу?
    options:
      - text: Потому что инфаркт заразен и может передаться родственникам
      - text: Потому что погибшая мышца отрастает заново, если помочь сразу
      - text: Потому что многие смерти от инфаркта случаются в первые часы
        correct: true
    explanation: 'Не ждите, пройдёт ли боль сама, и не откладывайте звонок: многие смерти от инфаркта случаются в первые часы.'
    cite: [6]
  - level: student
    prompt: Как называют ИМ со стойким подъёмом ST как минимум в двух смежных отведениях?
    options:
      - text: ИМпST
        correct: true
      - text: ИМбпST
      - text: MINOCA
    explanation: ИМ со стойким (более 20 минут) подъёмом сегмента ST как минимум в двух смежных отведениях называют ИМпST.
    cite: [1, 2]
  - level: student
    prompt: Какой термин исключён в Пятом универсальном определении ИМ (2026)?
    options:
      - text: «Первичный ИМ»
      - text: «ИМ 3 типа»
        correct: true
      - text: «Вторичный ИМ»
    explanation: 'Пятое универсальное определение заменило числовые типы клинической классификацией: первичный, вторичный и связанный с процедурой ИМ; термин «ИМ 3 типа» исключён.'
    cite: [4]
