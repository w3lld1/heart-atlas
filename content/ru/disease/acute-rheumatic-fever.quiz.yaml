questions:
  - level: patient
    prompt: На что, по статье, организм отвечает воспалительной реакцией при ОРЛ?
    options:
      - text: На пищевую аллергию к коровьему молоку
      - text: На стрептококковую инфекцию горла
        correct: true
      - text: На заражение крови после глубокого пореза кожи
    explanation: ОРЛ — воспалительная реакция организма на стрептококковую инфекцию горла — ангину или фарингит.
    cite: [1, 6]
  - level: patient
    prompt: Когда, по статье, начинается ОРЛ?
    options:
      - text: Спустя некоторое время после ангины
        correct: true
      - text: В первые часы ангины, одновременно с ней
      - text: Ещё до ангины, до попадания микроба в горло
    explanation: ОРЛ начинается не во время ангины или фарингита, вызванных стрептококком группы А, а спустя некоторое время после них.
    cite: [1, 5]
  - level: patient
    prompt: Почему, по статье, иммунная система при ОРЛ атакует ткани сердца?
    options:
      - text: Сердце перегревается при высокой температуре
      - text: В сердце накапливается соль из пищи
      - text: Белки микроба похожи на белки сердца
        correct: true
    explanation: Белки этого микроба похожи на белки клапанов сердца, сердечной мышцы и суставов, и иммунная система по ошибке атакует и их.
    cite: [1, 5]
  - level: patient
    prompt: Какое обследование, по статье, главное, чтобы найти ревмокардит?
    options:
      - text: Рентгенография суставов кистей
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: Снимок сосудов сердца с контрастом (коронарография)
    explanation: Чтобы найти ревмокардит, главное обследование — УЗИ сердца (эхокардиография).
    cite: [1]
  - level: student
    prompt: Что, по статье, — проявление уже хронической болезни, а не острого периода?
    options:
      - text: Перикардит
      - text: Аортальная регургитация
      - text: Митральный стеноз
        correct: true
    explanation: В остром периоде чаще всего возникают митральная регургитация и перикардит, иногда аортальная регургитация; митральный стеноз — проявление уже хронической болезни.
    cite: [5]
  - level: student
    prompt: Что, по статье, называют субклиническим кардитом при ОРЛ?
    options:
      - text: Вальвулит, видимый только при ЭхоКГ
        correct: true
      - text: Шум в сердце, при котором ЭхоКГ без изменений
      - text: Удлинение интервала PR без других признаков кардита
    explanation: Кардит — большой критерий, клинический и/или субклинический; субклинический кардит — это вальвулит, видимый только при ЭхоКГ.
    cite: [1, 5]
