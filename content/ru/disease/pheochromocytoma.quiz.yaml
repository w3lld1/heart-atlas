questions:
  - level: patient
    prompt: Какие гормоны выделяет феохромоцитома?
    options:
      - text: Тироксин и трийодтиронин щитовидной железы
      - text: Адреналин, норадреналин и дофамин
        correct: true
      - text: Эстроген и тестостерон
    explanation: Феохромоцитома — опухоль из хромаффинных клеток, которая обычно находится в надпочечнике и выделяет катехоламины — адреналин, норадреналин и дофамин.
    cite: [5, 7]
  - level: patient
    prompt: Как называют такую же опухоль, если она находится вне надпочечника?
    options:
      - text: Параганглиома
        correct: true
      - text: Аденома гипофиза
      - text: Липома
    explanation: Такую же опухоль вне надпочечника называют параганглиомой.
    cite: [7, 8]
  - level: patient
    prompt: Зачем всем людям с этой опухолью рекомендуют генетическое обследование?
    options:
      - text: Чтобы определить группу крови перед операцией
      - text: Чтобы узнать, передаётся ли опухоль при контакте с людьми
      - text: Чтобы спланировать наблюдение и проверить родственников
        correct: true
    explanation: Генетическое обследование рекомендуют всем людям с этой опухолью — оно помогает спланировать наблюдение, найти другие опухоли и вовремя проверить родственников.
    cite: [1, 5, 6]
  - level: patient
    prompt: Какой основной способ лечения феохромоцитомы?
    options:
      - text: Пересадка почки от донора
      - text: Операция по удалению опухоли
        correct: true
      - text: Удаление щитовидной железы целиком
    explanation: Основной способ лечения — операция по удалению опухоли.
    cite: [2, 5, 6]
  - level: student
    prompt: Почему, по MSD, свободные метанефрины плазмы чувствительнее, чем адреналин и норадреналин крови?
    options:
      - text: Их вырабатывает щитовидная железа, а не хромаффинные клетки
      - text: Адреналин и норадреналин повышены постоянно, а метанефрины — эпизодически
      - text: Они повышены постоянно, а адреналин и норадреналин — эпизодически
        correct: true
    explanation: Свободные метанефрины плазмы чувствительнее, потому что метанефрины повышены постоянно, а адреналин и норадреналин секретируются эпизодически.
    cite: [5]
  - level: student
    prompt: Как Минздрав 610_2 оценивает метастатический потенциал ФХЦ?
    options:
      - text: Его нет — ФХЦ всегда считают доброкачественной
      - text: Он есть у любой ФХЦ, как у любой НЭО
        correct: true
      - text: Он есть только у ФХЦ правого надпочечника
    explanation: По Минздраву 610_2, любая ФХЦ, как и любая нейроэндокринная опухоль, имеет метастатический потенциал; прежнее деление на доброкачественные и злокачественные пересмотрено в пользу стратификации риска.
    cite: [2]
