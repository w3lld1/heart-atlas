questions:
  - level: patient
    prompt: Где находится сужение при этом пороке?
    options:
      - text: В лёгочных венах у входа в левое предсердие
      - text: В средней части полости правого желудочка
        correct: true
      - text: На лёгочном клапане, у выхода из правого желудочка
    explanation: При этом пороке сужение в средней части полости правого желудочка делит его на две камеры.
    cite: [2]
  - level: patient
    prompt: Какие жалобы описаны у взрослых с этим пороком?
    options:
      - text: Зуд кожи и сыпь на руках после еды
      - text: Боль в суставах пальцев по утрам
      - text: Одышка и обморок при нагрузке
        correct: true
    explanation: По рекомендациям ESC, если симптомы есть, это одышка, дискомфорт в груди, головокружение или обморок во время физической нагрузки.
    cite: [1]
  - level: patient
    prompt: Какое исследование главное при диагностике этого порока?
    options:
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: УЗИ щитовидной железы с допплером
      - text: Рентгенография костей обеих кистей
    explanation: Главное исследование при этом пороке — УЗИ сердца, то есть эхокардиография.
    cite: [1]
  - level: patient
    prompt: Где, по ESC, следует проводить операции и вмешательства через катетер?
    options:
      - text: В процедурном кабинете при районной поликлинике по месту жительства
      - text: В центрах, специализирующихся на врождённых пороках сердца
        correct: true
      - text: В отделении косметологии при многопрофильном медицинском центре
    explanation: И операции, и вмешательства через катетер при таких врождённых пороках следует проводить только в центрах, которые специализируются на врождённых пороках сердца.
    cite: [1]
  - level: student
    prompt: Что, по классификации StatPearls, создаёт обструкцию при типе 2?
    options:
      - text: Кальциноз створок аортального клапана и его кольца
      - text: Тромб в ушке левого предсердия у пожилых людей
      - text: Гипертрофия париетальных и септальных мышц
        correct: true
    explanation: StatPearls выделяет два типа по ткани, создающей обструкцию; при типе 2 её создаёт гипертрофия париетальных и септальных мышц.
    cite: [2]
  - level: student
    prompt: Какой подход ESC рекомендует при подынфундибулярном стенозе?
    options:
      - text: Хирургическое лечение
        correct: true
      - text: Имплантация кардиостимулятора
      - text: Радиочастотная абляция
    explanation: В тексте раздела о лечении ESC пишет, что хирургическое лечение рекомендуется при подынфундибулярном или инфундибулярном стенозе.
    cite: [1]
