questions:
  - level: patient
    prompt: Что такое спортивное сердце?
    options:
      - text: Воспаление сердечной мышцы, которое начинается после сильной простуды
      - text: Изменения сердца у тех, кто долго и/или интенсивно тренируется
        correct: true
      - text: Сужение артерий ног, которое развивается у курящих людей
    explanation: Спортивное сердце — это изменения строения и работы сердца у людей, которые долго и/или интенсивно тренируются.
    cite: [6]
  - level: patient
    prompt: Что статья говорит о боли в груди, одышке или сердцебиении у спортсмена?
    options:
      - text: Это обычные признаки спортивного сердца у любого спортсмена
      - text: Это всегда значит, что тренировки были слишком лёгкими
      - text: Спортивным сердцем их не объяснить, нужно искать болезнь
        correct: true
    explanation: Если у спортсмена появились боль в груди, одышка или сердцебиение, это не объясняется спортивным сердцем — нужно искать болезнь сердца.
    cite: [6]
  - level: patient
    prompt: Зачем перед соревнованиями проводят обследование сердца?
    options:
      - text: Чтобы найти опасные болезни сердца ещё до симптомов
        correct: true
      - text: Чтобы подобрать спортсмену питание на время сборов
      - text: Чтобы выбрать спортсмену удобную обувь для тренировок
    explanation: Перед участием в соревнованиях проводят обследование сердца, чтобы найти болезни, опасные внезапной смертью, ещё до первых симптомов.
    cite: [1, 2]
  - level: patient
    prompt: В какой ситуации нужно сразу вызвать скорую и начинать реанимацию?
    options:
      - text: У спортсмена болят мышцы ног на следующий день после тренировки
      - text: Спортсмен внезапно упал и не приходит в сознание
        correct: true
      - text: Спортсмену сильно хочется пить после долгой пробежки
    explanation: Если спортсмен внезапно упал и не приходит в сознание, это может быть остановка сердца. Сразу вызовите скорую и начинайте сердечно-лёгочную реанимацию.
    cite: [5, 8]
  - level: student
    prompt: Чем, по MSD, в основном объясняется снижение ЧСС покоя у спортсмена?
    options:
      - text: Снижением уровня гемоглобина в крови
      - text: Хроническим обезвоживанием организма
      - text: Повышением вагусного тонуса
        correct: true
    explanation: При спортивном сердце растут максимальные ударный объём и сердечный выброс, а ЧСС покоя снижается в основном из-за повышения вагусного тонуса.
    cite: [6]
  - level: student
    prompt: Как ESC 2020 сравнивает скрининговую ЭКГ с анамнезом и осмотром у спортсменов?
    options:
      - text: ЭКГ уступает анамнезу и осмотру во всех случаях
      - text: ЭКГ превосходит анамнез и осмотр
        correct: true
      - text: ЭКГ при скрининге спортсменов не применяют совсем
    explanation: По ESC 2020, ЭКГ при предварительном обследовании превосходит анамнез и осмотр, но данных для рутинной ЭхоКГ недостаточно.
    cite: [1]
