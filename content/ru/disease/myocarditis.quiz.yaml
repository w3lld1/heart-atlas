questions:
  - level: patient
    prompt: Что такое миокардит?
    options:
      - text: Сужение аортального клапана
      - text: Воспаление сердечной мышцы
        correct: true
      - text: Тромб в лёгочной артерии
    explanation: Миокардит — воспалительное заболевание миокарда, то есть сердечной мышцы.
    cite: [1]
  - level: patient
    prompt: Как часто при миокардите бывает боль в груди — главный его симптом?
    options:
      - text: Примерно у 5% заболевших
      - text: Более чем у 80% заболевших
        correct: true
      - text: Боли в груди при миокардите не бывает
    explanation: Главный симптом — боль в груди, она бывает более чем у 80% заболевших.
    cite: [1]
  - level: patient
    prompt: Что чаще всего считают причиной миокардита?
    options:
      - text: Перелом рёбер
      - text: Сужение аортального клапана
      - text: Вирусы
        correct: true
    explanation: Чаще всего причиной миокардита считают вирусы. Бывают и неинфекционные причины.
    cite: [1, 2]
  - level: patient
    prompt: Чем обычно заканчивается неосложнённый миокардит?
    options:
      - text: Обычно проходит сам
        correct: true
      - text: Всегда требует пересадки сердца
    explanation: Неосложнённый миокардит — около 75% случаев — обычно проходит сам. Но у части людей работа сердца постепенно ухудшается, и это может привести к дилатационной кардиомиопатии.
    cite: [1]
  - level: student
    prompt: Что характеризует фульминантный миокардит?
    options:
      - text: Бессимптомное течение
      - text: Кардиогенный шок уже при поступлении, требующий гемодинамической поддержки
        correct: true
      - text: Сохранение воспаления дольше 3 месяцев без симптомов
    explanation: Фульминантный миокардит (3–9% случаев) характеризуется кардиогенным шоком уже при поступлении и требует гемодинамической поддержки.
    cite: [1]
  - level: student
    prompt: Как в большинстве случаев меняется уровень тропонина при миокардите в отличие от ОКС?
    options:
      - text: Тропонин при миокардите не повышается
      - text: Снижается быстрее, чем при ОКС
      - text: Снижается замедленно
        correct: true
    explanation: При остром миокардите тропонин повышен. Для миокардита, в отличие от ОКС, в большинстве случаев характерно замедленное снижение уровня тропонина.
    cite: [1, 2]
