questions:
  - level: patient
    prompt: Что такое трёхпредсердное сердце?
    options:
      - text: Предсердия и желудочки соединены наоборот
      - text: Мембрана делит левое предсердие надвое
        correct: true
      - text: Створки аортального клапана срослись с рождения
    explanation: При трёхпредсердном сердце мембрана делит левое предсердие на две камеры.
    cite: [1]
  - level: patient
    prompt: Когда формируется этот порок?
    options:
      - text: В старости, из-за износа клапанов
      - text: После ангины в школьном возрасте
      - text: До рождения, при развитии плода
        correct: true
    explanation: Порок формируется до рождения — когда у плода неправильно закладываются лёгочные вены, в левом предсердии образуется перегородка.
    cite: [1]
  - level: patient
    prompt: Какой главный метод диагностики этого порока?
    options:
      - text: УЗИ сердца с допплером
        correct: true
      - text: Электрокардиограмма (ЭКГ)
      - text: Общий анализ крови из вены на руке
    explanation: Главный метод — УЗИ сердца (эхокардиография) с цветным допплеровским картированием.
    cite: [1]
  - level: patient
    prompt: Что такое радикальное лечение этого порока?
    options:
      - text: Лечебная физкультура и массаж грудной клетки
      - text: Операция, при которой удаляют мембрану
        correct: true
      - text: Курс таблеток, который растворяет мембрану
    explanation: Радикальное лечение — операция, при которой хирург удаляет мембрану, создающую препятствие кровотоку внутри левого предсердия.
    cite: [1]
  - level: student
    prompt: Какой достоверный признак порока выявляют при катетеризации?
    options:
      - text: Градиент давления на аортальном клапане
      - text: Стеноз правой коронарной артерии
      - text: Две зоны разного давления в ЛП
        correct: true
    explanation: При катетеризации достоверный признак порока — две области с разным давлением в левом предсердии.
    cite: [1]
  - level: student
    prompt: Для чего используют термин cor triatriatum dexter?
    options:
      - text: Для аномалий с разделением правого предсердия
        correct: true
      - text: Для отверстия в перегородке между предсердиями
      - text: Для сужения митрального клапана после ревматизма
    explanation: Термин cor triatriatum dexter используют для разных аномалий с разделением правого предсердия; с классическим (левым) трёхпредсердным сердцем он не связан.
    cite: [1]
