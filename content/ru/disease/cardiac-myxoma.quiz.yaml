questions:
  - level: patient
    prompt: В какой камере сердца чаще всего растёт миксома?
    options:
      - text: В правом желудочке
      - text: В левом предсердии
        correct: true
      - text: В верхушке левого желудочка
    explanation: Чаще всего миксома растёт в левом предсердии.
    cite: [4, 5, 6]
  - level: patient
    prompt: Почему человек с миксомой левого предсердия может задыхаться или терять сознание, когда стоит?
    options:
      - text: Стоя опухоль сжимает лёгкие снаружи
      - text: Стоя опухоль каждый раз резко увеличивается в размерах
      - text: Сила тяжести тянет опухоль в отверстие клапана
        correct: true
    explanation: Сила тяжести тянет опухоль в отверстие митрального клапана, сердце перекачивает меньше крови, и давление на время падает. Лёжа опухоль обычно отходит от клапана, и становится легче.
    cite: [5]
  - level: patient
    prompt: Какое осложнение миксомы самое частое?
    options:
      - text: Эмболии — закупорка артерий
        correct: true
      - text: Переход миксомы в раковую опухоль лёгких и печени
      - text: Разрыв стенки левого предсердия во время сна
    explanation: Самое частое осложнение — эмболии. Что случится, зависит от того, какая артерия закупорена; например, эмбол из миксомы левого предсердия в артерии мозга может вызвать инсульт.
    cite: [5]
  - level: patient
    prompt: Как лечат миксому сердца?
    options:
      - text: Только наблюдают, пока она не рассосётся
      - text: Облучают область сердца
      - text: Удаляют хирургически
        correct: true
    explanation: Миксому удаляют хирургически, и обычно операция излечивает. После операции периодически делают ЭхоКГ, чтобы вовремя заметить, если миксома появится снова.
    cite: [4, 5]
  - level: student
    prompt: Какую долю всех первичных опухолей сердца, по MSD, составляет миксома?
    options:
      - text: Менее одного процента
      - text: От 45 до 85%
        correct: true
      - text: Ровно 100%
    explanation: По MSD, на миксому приходится от 45 до 85% всех первичных опухолей сердца, а у женщин она встречается в 2–3 раза чаще, чем у мужчин.
    cite: [4]
  - level: student
    prompt: Какой метод — метод выбора для характеристики ткани опухоли сердца?
    options:
      - text: МРТ сердца
        correct: true
      - text: ЭКГ
      - text: Общий анализ крови
    explanation: МРТ сердца — метод выбора для характеристики ткани опухоли.
    cite: [4]
