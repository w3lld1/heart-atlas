questions:
  - level: patient
    prompt: Что задаёт учащённый ритм при очаговой предсердной тахикардии?
    options:
      - text: Створки аортального клапана в сердце
      - text: Мышца диафрагмы, лежащая под лёгкими
      - text: Отдельный очаг в стенке предсердия
        correct: true
    explanation: При очаговой ПТ учащённый ритм задаёт не синусовый узел, а отдельный очаг в стенке предсердия.
    cite: [2, 3, 4]
  - level: patient
    prompt: К какой группе нарушений ритма относится очаговая предсердная тахикардия?
    options:
      - text: Один из видов наджелудочковой тахикардии
        correct: true
      - text: Одна из форм болезни сосудов головного мозга
      - text: Один из видов сужения артерий нижних конечностей
    explanation: Очаговая предсердная тахикардия — один из видов наджелудочковой тахикардии.
    cite: [1]
  - level: patient
    prompt: Чем полифокусная предсердная тахикардия отличается от очаговой?
    options:
      - text: В предсердиях вообще нет ни одного очага возбуждения
      - text: Очагов несколько, и они разряжаются беспорядочно
        correct: true
      - text: Ритм всегда задают мышцы грудной клетки
    explanation: При полифокусной предсердной тахикардии очагов несколько, и они разряжаются беспорядочно.
    cite: [1, 3]
  - level: patient
    prompt: Что из этого, если сопровождает приступ частого сердцебиения, — повод вызвать скорую?
    options:
      - text: Лёгкий насморк
      - text: Обморок
        correct: true
      - text: Сухость кожи рук
    explanation: Скорую вызывают, если приступ частого сердцебиения сопровождается обмороком или предобморочным состоянием.
    cite: [1]
  - level: student
    prompt: Как консенсус EHRA определяет фокусную ПТ?
    options:
      - text: Активация предсердий из дискретного очага вне синусового узла
        correct: true
      - text: Возбуждение нервов кишечника, которое идёт от желудка вниз
      - text: Активация, которая распространяется строго вдоль стенки аорты сверху вниз
    explanation: Консенсус EHRA определяет фокусную ПТ как активацию предсердий из дискретного очага вне синусового узла с центробежным распространением.
    cite: [4]
  - level: student
    prompt: Как Минздрав определяет кардиомиопатию, ассоциированную с аритмией?
    options:
      - text: Утолщение стенок аорты из-за отложения кальция в её оболочке у пожилых
      - text: Сужение почечных артерий с последующим стойким повышением давления крови
      - text: Дилатация желудочков и снижение их систолической функции из-за аритмии
        correct: true
    explanation: Минздрав определяет КАА как дилатацию желудочков и снижение их систолической функции, наиболее вероятно возникшие или усугубившиеся на фоне аритмии.
    cite: [1]
