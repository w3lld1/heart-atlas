questions:
  - level: patient
    prompt: Что такое острая ишемия конечности?
    options:
      - text: Постепенное сужение артерий ног, которое развивается на протяжении лет
      - text: Сгусток крови в глубокой вене ноги, который мешает оттоку крови
      - text: Внезапное прекращение притока артериальной крови к руке или ноге
        correct: true
    explanation: Острая ишемия конечности — внезапное прекращение или снижение притока артериальной крови к руке или ноге, которое угрожает сохранению конечности и требует неотложной диагностики и лечения.
    cite: [1, 3]
  - level: patient
    prompt: Откуда чаще всего приносится сгусток при эмболии артерии ноги?
    options:
      - text: Из сердца, а основная причина — фибрилляция предсердий
        correct: true
      - text: Из аорты, а основная причина — расслоение её стенки
      - text: Из вен ног, а основная причина — тромбоз глубоких вен ног
    explanation: При эмболии сгусток образуется в другом месте и приносится с током крови. Чаще всего его источник — болезни сердца, а основная причина — фибрилляция предсердий. Расслоение аорты — редкая причина острой ишемии.
    cite: [1]
  - level: patient
    prompt: Как обычно выглядит нога при острой ишемии?
    options:
      - text: Красная и горячая, а пульс на стопе заметно сильнее обычного
      - text: Бледная или синюшная, холодная, ниже закупорки нет пульса
        correct: true
      - text: Отёчная и горячая, с плотной полосой покраснения вдоль вены
    explanation: Нога становится бледной, мраморной или синюшной и холодной, а ниже места закупорки пульса нет.
    cite: [1]
  - level: patient
    prompt: Когда, по статье, нужно сразу вызывать скорую?
    options:
      - text: Когда кожа на голенях стала сухой и шелушится в холодное время года
      - text: Когда к вечеру после долгого рабочего дня немного устали обе ваши ноги
      - text: Когда нога или рука вдруг стала холодной, бледной, болит или немеет
        correct: true
    explanation: Острая ишемия конечности — неотложное состояние. Сразу вызывайте скорую по номеру 103 или 112, если в ноге или руке внезапно появились сильная боль, бледность или синюшность, похолодание, онемение или покалывание, слабость или невозможность пошевелить стопой или пальцами.
    cite: [1, 3, 4]
  - level: student
    prompt: Что означает категория IIb по классификации Rutherford в ESC и ACC/AHA?
    options:
      - text: Конечность жизнеспособна, немедленной угрозы нет
      - text: Угроза немедленная, для спасения нужна немедленная реваскуляризация
        correct: true
      - text: Угроза пограничная, конечность можно спасти при своевременном лечении
    explanation: 'Категории Rutherford: I — конечность жизнеспособна, немедленной угрозы нет; IIa — угроза пограничная, конечность можно спасти при своевременном лечении; IIb — угроза немедленная, для спасения нужна немедленная реваскуляризация; III — необратимое повреждение.'
    cite: [2, 3]
  - level: student
    prompt: Когда, по российским рекомендациям, развивается необратимый мышечный некроз?
    options:
      - text: Через 4–6 часов при эмболии или через 12–24 часа при тромбозе
        correct: true
      - text: Через 4–6 минут при эмболии или через 12–24 минуты при тромбозе
      - text: В первые же секунды — как при эмболии, так и при тромбозе
    explanation: 'По российским рекомендациям, необратимый мышечный некроз развивается через 4–6 часов при эмболии или через 12–24 часа при тромбозе. Не ждите, пока пройдёт: по ACC/AHA, скелетные мышцы переносят нехватку крови лишь около 4–6 часов.'
    cite: [1, 3]
