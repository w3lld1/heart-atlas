questions:
  - level: patient
    prompt: С каким синдромом часто связана полная форма атриовентрикулярного септального дефекта?
    options:
      - text: С синдромом Марфана
      - text: С синдромом Дауна
        correct: true
      - text: С синдромом Бругада
    explanation: Порок часто связан с синдромом Дауна. Большинство людей с полной формой имеют синдром Дауна, а при частичной форме он бывает редко.
    cite: [1, 2, 3]
  - level: patient
    prompt: Через дефекты кровь сбрасывается слева направо. Что из-за этого происходит?
    options:
      - text: В лёгкие поступает лишняя кровь
        correct: true
      - text: Лёгкие получают меньше крови, чем обычно
      - text: Кровь перестаёт поступать в аорту
    explanation: Через дефекты кровь сбрасывается слева направо, и в лёгкие поступает лишняя кровь.
    cite: [1, 3]
  - level: patient
    prompt: Как лечат атриовентрикулярный септальный дефект?
    options:
      - text: Закрывают устройством, проведённым через сосуд
      - text: Только лекарствами, без операции
      - text: Хирургически
        correct: true
    explanation: Лечение хирургическое, а закрыть такой дефект устройством через сосуд нельзя. Хирург закрывает дефекты заплатой и разделяет общий клапан на два — правый и левый.
    cite: [1, 2]
  - level: patient
    prompt: Как долго человеку с этим пороком нужно наблюдаться у кардиолога?
    options:
      - text: Только первый месяц после операции
      - text: Всю жизнь
        correct: true
      - text: Только до школы
    explanation: Наблюдаться у кардиолога нужно всю жизнь — и после операции, и без неё, в том числе в центрах для взрослых с врождёнными пороками сердца.
    cite: [1, 2]
  - level: student
    prompt: Что входит в полную форму порока по Минздраву?
    options:
      - text: Вторичный ДМПП, открытый артериальный проток и два нормальных клапана
      - text: Первичный ДМПП, приточный нерестриктивный ДМЖП и единый АВ-клапан
        correct: true
      - text: Только первичный ДМПП без ДМЖП с расщеплением митральной створки
    explanation: Полная форма — первичный ДМПП, приточный нерестриктивный ДМЖП и единый АВ-клапан. Первичный ДМПП без ДМЖП с расщеплением передней створки митрального клапана — неполная (частичная) форма.
    cite: [1]
  - level: student
    prompt: Что типично для ЭКГ при этом пороке?
    options:
      - text: Укорочение интервала PR
      - text: Отклонение электрической оси вправо
      - text: Отклонение электрической оси влево
        correct: true
    explanation: На ЭКГ — отклонение электрической оси влево, часто удлинение интервала PR (АВ-блокада I степени), признаки гипертрофии правого желудочка (rsR′).
    cite: [1, 3]
