questions:
  - level: patient
    prompt: Что такое стеноз почечной артерии?
    options:
      - text: Разрыв стенки почечной артерии с кровотечением вокруг почки
      - text: Уменьшение кровотока по почечным артериям или их ветвям
        correct: true
      - text: Камень в почечной лоханке, который мешает нормальному оттоку мочи
    explanation: Стеноз почечной артерии — уменьшение кровотока по одной или обеим почечным артериям или их ветвям.
    cite: [5]
  - level: patient
    prompt: Что показывает дуплексное УЗИ при подозрении на стеноз?
    options:
      - text: Размеры почек и кровоток в артериях
        correct: true
      - text: Уровень сахара и холестерина в крови
      - text: Электрическую активность сердечной мышцы
    explanation: УЗИ почек с дуплексным сканированием почечных артерий показывает размеры почек и кровоток в артериях.
    cite: [1, 2, 4]
  - level: patient
    prompt: Какие две главные причины сужения почечной артерии?
    options:
      - text: Мигрень и бронхиальная астма
      - text: Хронический гастрит и варикозное расширение вен ног
      - text: Атеросклероз и фибромышечная дисплазия
        correct: true
    explanation: Две главные причины сужения почечной артерии — атеросклероз и фибромышечная дисплазия (ФМД).
    cite: [4, 5, 7]
  - level: patient
    prompt: Какой признак может означать острую закупорку почечной артерии?
    options:
      - text: Лёгкая заложенность носа после прогулки в мороз
      - text: Внезапная постоянная боль в боку или животе
        correct: true
      - text: Небольшая мозоль на пятке от новой тесной обуви
    explanation: Внезапная постоянная ноющая боль в боку или животе, особенно с лихорадкой, тошнотой и рвотой, кровью в моче или резким уменьшением количества мочи, может означать острую закупорку почечной артерии.
    cite: [5]
  - level: student
    prompt: Как стеноз почечной артерии вызывает реноваскулярную гипертензию?
    options:
      - text: Стимулирует выброс ренина юкстагломерулярными клетками
        correct: true
      - text: Стимулирует выброс инсулина бета-клетками поджелудочной железы
      - text: Стимулирует выброс мелатонина клетками эпифиза
    explanation: Стеноз вызывает реноваскулярную гипертензию, стимулируя выброс ренина юкстагломерулярными клетками поражённой почки.
    cite: [1, 4]
  - level: student
    prompt: Какой стеноз почечной артерии, как правило, повышает давление?
    options:
      - text: Только расположенный в правой почечной артерии
      - text: Только сочетающийся с камнями в почках
      - text: Только гемодинамически значимый
        correct: true
    explanation: Давление, как правило, повышает только гемодинамически значимое сужение почечной артерии.
    cite: [3, 4]
