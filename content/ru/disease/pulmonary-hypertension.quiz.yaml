questions:
  - level: patient
    prompt: Из-за чего чаще всего развивается лёгочная гипертензия?
    options:
      - text: Из-за болезней левых отделов сердца
        correct: true
      - text: Из-за пищевой аллергии
      - text: Из-за травмы колена
    explanation: Чаще всего ЛГ развивается из-за болезней левых отделов сердца, например сердечной недостаточности или пороков клапанов.
    cite: [1, 2]
  - level: patient
    prompt: Когда появляются симптомы на ранних стадиях ЛГ?
    options:
      - text: Только во сне
      - text: При физической нагрузке
        correct: true
      - text: Только после еды
    explanation: На ранних стадиях симптомы появляются при физической нагрузке.
    cite: [1]
  - level: patient
    prompt: Какое исследование — главное отборочное при подозрении на ЛГ?
    options:
      - text: Рентген стопы
      - text: Гастроскопия
      - text: УЗИ сердца (эхокардиография)
        correct: true
    explanation: 'Главное отборочное исследование — УЗИ сердца, эхокардиография: по ней врач оценивает, насколько вероятна ЛГ.'
    cite: [1, 2]
  - level: patient
    prompt: Какой основной метод лечения хронической тромбоэмболической ЛГ (ХТЭЛГ)?
    options:
      - text: Пересадка почки
      - text: Операция по удалению тромботических масс из лёгочных артерий
        correct: true
    explanation: При ХТЭЛГ основной метод — операция, при которой из лёгочных артерий удаляют тромботические массы (тромбэндартерэктомия).
    cite: [1, 2, 3]
  - level: student
    prompt: Мутации какого гена находят при семейной ЛАГ в 75% случаев?
    options:
      - text: BMPR2
        correct: true
      - text: SCN5A
      - text: FBN1
    explanation: При семейной ЛАГ в 75% случаев находят мутации гена BMPR2.
    cite: [1, 3]
  - level: student
    prompt: Что — основной фактор прогноза при ЛГ любой причины?
    options:
      - text: Уровень холестерина в крови
      - text: Функциональное состояние ПЖ
        correct: true
      - text: Масса тела
    explanation: Независимо от причины ЛГ ведёт к перегрузке ПЖ давлением и его дисфункции; функциональное состояние ПЖ — основной фактор прогноза.
    cite: [1, 2]
