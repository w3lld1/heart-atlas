questions:
  - level: patient
    prompt: Что, по статье, вызывает этот синдром?
    options:
      - text: Отложения холестерина в стенках коронарных артерий сердца
      - text: Изменения в генах ионных каналов клеток сердца
        correct: true
      - text: Воспаление сердечных клапанов после перенесённой ангины
    explanation: Причина — изменения (мутации) в генах ионных каналов клеток сердца.
    cite: [1, 3]
  - level: patient
    prompt: К какой группе болезней этот синдром относят вместе с синдромом Бругада?
    options:
      - text: К каналопатиям
        correct: true
      - text: К кардиомиопатиям с утолщением стенки сердца
      - text: К врождённым порокам клапанов сердца
    explanation: Вместе с синдромом Бругада и катехоламинергической полиморфной желудочковой тахикардией этот синдром относят к каналопатиям — болезням, при которых аритмии возникают без явного структурного заболевания сердца.
    cite: [1, 5]
  - level: patient
    prompt: Какое исследование, по статье, главное при этом синдроме?
    options:
      - text: Анализ крови на уровень сахара
      - text: Рентгенография грудной клетки
      - text: Обычная ЭКГ в 12 отведениях
        correct: true
    explanation: Главное исследование — обычная ЭКГ в 12 отведениях.
    cite: [1, 3]
  - level: patient
    prompt: Какая ситуация, по статье, может означать остановку сердца?
    options:
      - text: Человек чихает и жалуется на заложенный нос без температуры
      - text: Человек внезапно упал, не реагирует и не дышит
        correct: true
      - text: Человек после долгой прогулки жалуется на усталость в ногах
    explanation: Если человек внезапно упал, не реагирует и не дышит или только судорожно хватает воздух, это может быть остановка сердца.
    cite: [6]
  - level: student
    prompt: Где, по MSD, сильнее всего укорачивается потенциал действия при этом синдроме?
    options:
      - text: В атриовентрикулярном узле
      - text: В волокнах Пуркинье
      - text: В эпикарде желудочков
        correct: true
    explanation: По MSD, потенциал действия сильнее всего укорачивается в эпикарде желудочков; возникающая трансмуральная дисперсия реполяризации может привести к полиморфной ЖТ или ФЖ.
    cite: [3]
  - level: student
    prompt: По какому механизму, по российским рекомендациям, при этом синдроме возникают жизнеугрожающие аритмии?
    options:
      - text: Риентри
        correct: true
      - text: Полная блокада проведения в АВ-узле
      - text: Ишемия миокарда при сужении артерий
    explanation: Укорочение потенциала действия и эффективного рефрактерного периода кардиомиоцитов предсердий и желудочков создаёт условия для жизнеугрожающих аритмий по механизму риентри.
    cite: [1]
