questions:
  - level: patient
    prompt: Что такое преэклампсия?
    options:
      - text: Болезнь сердечной мышцы, которая бывает связана с беременностью
      - text: Повышенное давление плюс белок в моче или поражение органов
        correct: true
      - text: Сужение почечной артерии, из-за которого у беременной растёт давление
    explanation: При преэклампсии к повышенному давлению присоединяются белок в моче или признаки поражения других органов матери или плаценты.
    cite: [1, 2, 3]
  - level: patient
    prompt: Что называют гестационной гипертензией?
    options:
      - text: Давление, которое было повышено у женщины ещё до беременности
      - text: Давление, которое высокое на приёме у врача, а дома остаётся нормальным
      - text: Давление, которое впервые повысилось во второй половине беременности
        correct: true
    explanation: Гестационная гипертензия — давление, которое впервые повысилось во второй половине беременности. Если давление было повышено ещё до беременности или в её первой половине, это хроническая гипертензия.
    cite: [1, 2]
  - level: patient
    prompt: Почему давление у беременной измеряют при каждом визите к врачу?
    options:
      - text: Преэклампсия долго может ничего не вызывать, а без лечения стать эклампсией
        correct: true
      - text: Так врач проверяет, хватает ли ребёнку околоплодных вод и хорошо ли он растёт
      - text: Повышенное давление при беременности сразу вызывает сильную боль в животе
    explanation: Преэклампсия может долго ничего не вызывать, а без лечения — внезапно перейти в эклампсию. Поэтому давление измеряют при каждом визите к врачу. Рост ребёнка, плаценту и околоплодные воды оценивают с помощью УЗИ.
    cite: [1, 4, 6]
  - level: patient
    prompt: Что, по статье, верно о преэклампсии и родах?
    options:
      - text: Роды на неё никак не влияют, и после них она остаётся такой же, как была
      - text: Она проходит сама ещё задолго до родов, и лечить её не приходится
      - text: Вылечить её можно только родами, хотя она бывает и после них
        correct: true
    explanation: Вылечить преэклампсию можно только родами, хотя иногда она появляется и после них.
    cite: [1, 4]
  - level: student
    prompt: Что, по Минздраву, — обязательное условие диагноза HELLP-синдрома?
    options:
      - text: Артериальная гипертензия
      - text: Тромбоцитопения
        correct: true
      - text: Протеинурия
    explanation: Минздрав называет обязательным условием диагноза HELLP-синдрома тромбоцитопению, а АГ обязательной не является. По MSD, у части женщин с HELLP-синдромом нет ни АГ, ни протеинурии.
    cite: [1, 4]
  - level: student
    prompt: С чего, по двухстадийной теории Минздрава, начинается развитие ПЭ?
    options:
      - text: С поверхностной инвазии трофобласта
        correct: true
      - text: С первичного воспаления клубочков почек
      - text: С врождённого порока клапанов сердца
    explanation: По двухстадийной теории поверхностная инвазия трофобласта ведёт к неадекватному ремоделированию спиральных артерий, затем развиваются дисфункция эндотелия матери и дисбаланс ангиогенных и антиангиогенных факторов.
    cite: [1]
