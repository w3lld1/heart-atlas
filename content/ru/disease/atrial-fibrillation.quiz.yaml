questions:
  - level: patient
    prompt: Что происходит с предсердиями при фибрилляции предсердий?
    options:
      - text: Они сокращаются ровными волнами, как в норме
      - text: Они возбуждаются несогласованно и перестают полноценно сокращаться
        correct: true
    explanation: При ФП предсердия возбуждаются несогласованно и перестают полноценно сокращаться.
    cite: [1]
  - level: patient
    prompt: Что может стать первым проявлением ФП у человека без симптомов?
    options:
      - text: Инсульт
        correct: true
      - text: Перелом ребра
      - text: Сыпь на коже
    explanation: У части людей симптомов нет совсем, и первым проявлением ФП может стать инсульт.
    cite: [3]
  - level: patient
    prompt: Как поступают с ЭКГ, если приступы ФП приходят и уходят?
    options:
      - text: ЭКГ в таком случае не записывают
      - text: Записывают ЭКГ дольше, например сутки
        correct: true
    explanation: Если приступы приходят и уходят, ЭКГ записывают дольше, например сутки.
    cite: [4]
  - level: patient
    prompt: Вокруг каких задач строится лечение ФП?
    options:
      - text: Пересадка сердца всем пациентам
      - text: Замена сердечного клапана всем пациентам
      - text: Снизить риск инсульта, уменьшить симптомы, лечить сопутствующие болезни
        correct: true
    explanation: Лечение строится вокруг нескольких задач — снизить риск инсульта, уменьшить симптомы и лечить сопутствующие болезни.
    cite: [1]
  - level: student
    prompt: Какие ЭКГ-признаки характерны для ФП?
    options:
      - text: Абсолютно нерегулярные интервалы RR и отсутствие отчётливых зубцов P
        correct: true
      - text: Регулярные интервалы RR и отчётливый зубец P перед каждым QRS
    explanation: ЭКГ-признаки ФП — абсолютно нерегулярные интервалы RR и отсутствие отчётливых зубцов P.
    cite: [2, 3]
  - level: student
    prompt: Какую ФП ESC называет пароксизмальной?
    options:
      - text: Непрерывную ФП длительностью не менее 12 месяцев
      - text: ФП, при которой попытки восстановить синусовый ритм больше не планируются
      - text: ФП, которая прекращается сама или после вмешательства в течение 7 дней
        correct: true
    explanation: Пароксизмальная ФП прекращается сама или после вмешательства в течение 7 дней. Непрерывная ФП не менее 12 месяцев — длительно персистирующая, а без планов восстановить ритм — постоянная.
    cite: [1]
