questions:
  - level: patient
    prompt: Что происходит с клапаном лёгочной артерии при этом пороке?
    options:
      - text: Он не закрывается, и кровь течёт назад в желудочек
      - text: Он не пропускает кровь из сердца в лёгкие
        correct: true
      - text: Он пропускает кровь из правого желудочка прямо в аорту
    explanation: При этом пороке клапан лёгочной артерии сформирован неправильно и не пропускает кровь из сердца в лёгкие.
    cite: [2]
  - level: patient
    prompt: Каким исследованием ставят диагноз после рождения, если порок не нашли до родов?
    options:
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: УЗИ почек, мочеточников и мочевого пузыря
      - text: УЗИ тазобедренных суставов
    explanation: Порок могут обнаружить ещё до рождения на УЗИ плода; если этого не случилось, после рождения диагноз ставят по УЗИ сердца — эхокардиографии.
    cite: [2]
  - level: patient
    prompt: От чего зависит выживание новорождённого с этим пороком?
    options:
      - text: От того, остаётся ли открытым большой родничок на голове
      - text: От того, быстро ли заживает пупочная ранка
      - text: От того, остаётся ли открытым артериальный проток
        correct: true
    explanation: При этом пороке кровь попадает в лёгкие через артериальный проток, поэтому выживание новорождённого зависит от того, остаётся ли проток открытым.
    cite: [2, 3]
  - level: patient
    prompt: Что в первую неделю жизни считается неотложным состоянием?
    options:
      - text: Икота у младенца после кормления грудью или из бутылочки
      - text: Синюшность или острая тяжёлая сердечная недостаточность
        correct: true
      - text: Чихание после купания, если малышу в нос попала вода
    explanation: Острая тяжёлая сердечная недостаточность или синюшность в первую неделю жизни — неотложное состояние.
    cite: [3]
  - level: student
    prompt: Как ESC классифицирует атрезию ЛА (все формы) у взрослых с ВПС?
    options:
      - text: Как ВПС умеренной сложности
      - text: Как простой ВПС
      - text: Как ВПС тяжёлой сложности
        correct: true
    explanation: В рекомендациях ESC по взрослым с ВПС атрезия ЛА (все формы) отнесена к ВПС тяжёлой сложности.
    cite: [1]
  - level: student
    prompt: Что делает операция Фонтена?
    options:
      - text: Разделяет системный и лёгочный венозный возврат без подлёгочного желудочка
        correct: true
      - text: Переключает аорту и лёгочную артерию так, чтобы они отходили от других желудочков
      - text: Расширяет устье коронарной артерии заплатой из перикарда
    explanation: Операция Фонтена разделяет системный и лёгочный венозный возврат без подлёгочного желудочка.
    cite: [1]
