questions:
  - level: patient
    prompt: Почему при тампонаде сердце выбрасывает меньше крови?
    options:
      - text: Сердце становится слишком большим
      - text: Давление в перикарде выше, чем в камерах, и они не могут нормально наполниться
        correct: true
      - text: Закрываются клапаны сердца
    explanation: Когда давление в перикарде становится выше, чем в камерах сердца, они не могут нормально наполниться кровью, и сердце выбрасывает меньше крови.
    cite: [1]
  - level: patient
    prompt: Может ли небольшое количество жидкости в перикарде вызвать тампонаду?
    options:
      - text: Нет, тампонада бывает только при очень большом объёме жидкости
      - text: Нет, тампонаду вызывает только газ
      - text: Да, если жидкость скопилась быстро
        correct: true
    explanation: Если жидкость (обычно кровь) прибывает быстро, перикард не успевает растянуться, и тампонаду может вызвать даже небольшое количество, например 150 мл; при медленном накоплении даже 1500 мл могут её не вызвать.
    cite: [3]
  - level: patient
    prompt: Что происходит с венами на шее при тампонаде?
    options:
      - text: Они сильно набухают
        correct: true
      - text: Они спадаются
      - text: Они не меняются
    explanation: Давление падает, пульс учащается, как при шоке, но вены на шее сильно набухают.
    cite: [3]
  - level: patient
    prompt: Что главное в лечении тампонады?
    options:
      - text: Постельный режим дома без обследования
      - text: Удалить жидкость из перикарда, чтобы сердце снова могло наполняться
        correct: true
      - text: Ждать, пока жидкость рассосётся сама
    explanation: Главное — удалить жидкость из перикарда; самый простой и быстрый способ — пункция перикарда (перикардиоцентез), при тампонаде она спасает жизнь.
    cite: [1]
  - level: student
    prompt: Что входит в триаду Бека?
    options:
      - text: Артериальная гипертензия, брадикардия, отёки ног
      - text: Лихорадка, шум трения перикарда, боль в груди
      - text: Артериальная гипотензия, ослабление тонов сердца, расширение яремных вен
        correct: true
    explanation: Сочетание артериальной гипотензии, ослабления тонов сердца и расширения яремных вен называют триадой Бека.
    cite: [1]
  - level: student
    prompt: Что такое парадоксальный пульс?
    options:
      - text: Снижение систолического давления более чем на 10 мм рт. ст. на вдохе
        correct: true
      - text: Рост систолического давления более чем на 10 мм рт. ст. на вдохе
      - text: Урежение пульса на вдохе при спокойном дыхании
    explanation: Парадоксальный пульс — снижение систолического давления более чем на 10 мм рт. ст. на вдохе при спокойном дыхании; российские рекомендации называют его патогномоничным симптомом тампонады. По MSD, он встречается и при ХОБЛ, бронхиальной астме и тромбоэмболии лёгочной артерии.
    cite: [1, 3]
