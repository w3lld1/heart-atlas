questions:
  - level: patient
    prompt: Что называют кардиотоксичностью?
    options:
      - text: Опухоль, которая с самого начала растёт в сердечной мышце
      - text: Отравление сердца несвежей едой во время больничного лечения
      - text: Осложнения со стороны сердца и сосудов при лечении рака
        correct: true
    explanation: Некоторые методы лечения рака могут повышать риск проблем с сердцем и сосудами; такие осложнения называют кардиотоксичностью, или сердечно-сосудистой токсичностью.
    cite: [1]
  - level: patient
    prompt: Когда после облучения грудной клетки может появиться поражение клапанов сердца?
    options:
      - text: Через месяцы и годы после лечения
        correct: true
      - text: Прямо во время самого сеанса облучения
      - text: В первые сутки после сеанса
    explanation: Поздние последствия лучевой терапии органов грудной клетки — ишемическая болезнь сердца, поражение клапанов и сердечная недостаточность — могут появиться через месяцы и годы.
    cite: [5]
  - level: patient
    prompt: Почему сердце проверяют, даже если человек при лечении рака чувствует себя хорошо?
    options:
      - text: Проверка сердца нужна, чтобы узнать группу крови
      - text: Ослабление сердца может не давать симптомов
        correct: true
      - text: Без такой проверки нельзя подобрать очки для чтения
    explanation: Ослабление сердца может не давать симптомов, а признаки кардиотоксичности важно найти рано, пока они не превратились в серьёзное осложнение.
    cite: [1, 2]
  - level: patient
    prompt: Зачем до начала лечения рака могут сделать УЗИ сердца?
    options:
      - text: Чтобы измерить, насколько быстро растёт опухоль в организме
      - text: Чтобы заранее согреть сердечную мышцу перед первым лечением
      - text: Чтобы потом сравнивать с ним результаты во время лечения
        correct: true
    explanation: 'Если лечение рака может повредить сердце, до его начала могут сделать исходные обследования, например УЗИ сердца: оно показывает, насколько хорошо работает сердце, и с ним потом сравнивают результаты во время лечения.'
    cite: [1]
  - level: student
    prompt: Как ESC делит дисфункцию сердца, связанную с лечением рака?
    options:
      - text: На утреннюю и вечернюю по времени появления
      - text: На симптомную и бессимптомную
        correct: true
      - text: На правостороннюю и левостороннюю по стороне сердца
    explanation: 'Дисфункцию сердца ESC делит на симптомную — сердечную недостаточность от лёгкой до очень тяжёлой — и бессимптомную: лёгкую, умеренную и тяжёлую.'
    cite: [1]
  - level: student
    prompt: Когда при оценке сердца рекомендована МРТ сердца?
    options:
      - text: Если ЭхоКГ неинформативна
        correct: true
      - text: Вместо ЭхоКГ как метод первой линии
      - text: Для контроля ритма во время сеансов облучения
    explanation: ЭхоКГ — метод первой линии; GLS рекомендована для выявления ранней, бессимптомной дисфункции ЛЖ, а МРТ сердца — если ЭхоКГ неинформативна.
    cite: [1, 2]
