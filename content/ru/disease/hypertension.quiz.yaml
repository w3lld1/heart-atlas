questions:
  - level: patient
    prompt: С какого уровня стойко повышенное давление в медицинском учреждении считают гипертензией?
    options:
      - text: 100/60 мм рт. ст. и выше
      - text: 140 мм рт. ст. и выше (верхнее) и (или) 90 мм рт. ст. и выше (нижнее)
        correct: true
      - text: 120/70 мм рт. ст. и выше
    explanation: 'Артериальная гипертензия — это стойкое повышение давления, измеренного в медицинском учреждении: систолического 140 мм рт. ст. и выше и (или) диастолического 90 мм рт. ст. и выше.'
    cite: [1, 2]
  - level: patient
    prompt: Как чаще всего проявляется повышенное давление?
    options:
      - text: Всегда сильной головной болью
      - text: Сыпью на коже
      - text: Никак — его находят случайно, когда измеряют давление
        correct: true
    explanation: Чаще всего повышенное давление никак себя не проявляет. Его находят случайно, когда измеряют давление.
    cite: [1, 2, 4]
  - level: patient
    prompt: Что лежит в основе лечения гипертензии?
    options:
      - text: Здоровый образ жизни — меньше соли, физическая активность, отказ от курения
        correct: true
      - text: Больше соли в еде и меньше движения
    explanation: Основа лечения — здоровый образ жизни — меньше соли, достаточная физическая активность, здоровое питание, умеренность в алкоголе и отказ от курения.
    cite: [3]
  - level: patient
    prompt: Как называют очень высокое давление вместе с острым повреждением органов?
    options:
      - text: Вторичная гипертензия
      - text: Гипертонический криз
        correct: true
      - text: Гипертрофия левого желудочка
    explanation: Очень высокое давление вместе с острым повреждением органов — гипертонический криз; он бывает опасным для жизни. Если на фоне высокого давления появились боль в груди, сильная одышка, внезапная спутанность сознания или признаки инсульта, звоните 103 или 112.
    cite: [2, 3, 4]
  - level: student
    prompt: У какой доли пациентов с АГ речь идёт о гипертонической болезни (первичной АГ)?
    options:
      - text: Менее чем у 10%
      - text: Примерно у половины
      - text: Более чем у 90%
        correct: true
    explanation: Более чем у 90% пациентов речь идёт о гипертонической болезни (эссенциальной, первичной АГ); вторичные формы выявляются у 5–10% пациентов с АГ.
    cite: [2]
  - level: student
    prompt: Какому офисному АД по ESC соответствует среднее домашнее АД ≥135/85 мм рт. ст.?
    options:
      - text: ≥140/90 мм рт. ст.
        correct: true
      - text: ≥120/70 мм рт. ст.
      - text: ≥180/120 мм рт. ст.
    explanation: Среднее АД при домашнем мониторировании ≥135/85 мм рт. ст. соответствует офисному ≥140/90 мм рт. ст.
    cite: [1]
