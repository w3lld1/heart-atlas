questions:
  - level: patient
    prompt: Где обычно находится сужение при коарктации аорты?
    options:
      - text: В лёгочной артерии
      - text: Сразу за левой подключичной артерией, в начале нисходящей аорты
        correct: true
      - text: В нижней полой вене
    explanation: Обычно сужение находится в начале нисходящей грудной аорты — сразу за местом, где от аорты отходит левая подключичная артерия, напротив артериального протока.
    cite: [1, 3]
  - level: patient
    prompt: Где из-за сужения повышается давление?
    options:
      - text: Выше сужения — в сосудах рук и головы
        correct: true
      - text: Ниже сужения — в сосудах ног
    explanation: Выше сужения, в артериях к голове и рукам, давление повышено, а стенка левого желудочка утолщается; ниже сужения органы живота и ноги получают меньше крови.
    cite: [1, 3]
  - level: patient
    prompt: Какое простое обследование помогает заподозрить коарктацию?
    options:
      - text: Измерение температуры тела
      - text: Анализ крови на холестерин
      - text: Измерение давления и сравнение пульса на руках и ногах
        correct: true
    explanation: Заподозрить порок помогает простое измерение давления на руках и ногах и сравнение пульса на руках и ногах.
    cite: [1, 3]
  - level: patient
    prompt: Нужно ли наблюдаться у кардиолога после успешной операции?
    options:
      - text: Нет, если операция прошла успешно
      - text: Да, всю жизнь
        correct: true
      - text: Только в первый месяц после операции
    explanation: 'Даже после успешной операции нужно наблюдаться у кардиолога всю жизнь: в первый год — не меньше двух раз, затем не реже раза в год.'
    cite: [1]
  - level: student
    prompt: Какая гипертрофия обычно видна на ЭКГ у новорождённых и грудных детей с тяжёлой КА?
    options:
      - text: Гипертрофия ЛЖ
      - text: Гипертрофия ПЖ
        correct: true
    explanation: На ЭКГ обычно гипертрофия ЛЖ, но ЭКГ может быть нормальной, а у новорождённых и грудных детей с тяжёлой КА обычно гипертрофия ПЖ, а не ЛЖ.
    cite: [3]
  - level: student
    prompt: Рекомендуют ли катетеризацию аорты с диагностической целью при изолированной КА?
    options:
      - text: Нет; её выполняют в ходе эндоваскулярного лечения
        correct: true
      - text: Да, как первый метод диагностики
    explanation: Катетеризацию аорты выполняют в ходе эндоваскулярного лечения; с диагностической целью при изолированной КА её не рекомендуют.
    cite: [1, 2]
