questions:
  - level: patient
    prompt: Что происходит при митральной регургитации?
    options:
      - text: Отверстие в перегородке между желудочками пропускает кровь
      - text: Сужается аортальный клапан
      - text: Створки митрального клапана не смыкаются, и часть крови идёт назад в левое предсердие
        correct: true
    explanation: При митральной регургитации створки митрального клапана не смыкаются полностью во время сокращения желудочков, и часть крови идёт обратно из левого желудочка в левое предсердие.
    cite: [2, 4]
  - level: patient
    prompt: Из-за чего чаще всего развивается острая митральная регургитация?
    options:
      - text: Из-за отрыва хорд клапана или повреждения папиллярных мышц при инфаркте
        correct: true
      - text: Из-за врождённого отверстия в перегородке сердца
      - text: Из-за сужения аортального клапана
    explanation: Острая регургитация чаще всего развивается из-за отрыва хорд клапана или повреждения папиллярных мышц при инфаркте миокарда.
    cite: [2]
  - level: patient
    prompt: Какое исследование главное при митральной регургитации?
    options:
      - text: Анализ мочи
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: Измерение температуры тела
    explanation: Главное исследование — УЗИ сердца. Оно показывает, почему клапан пропускает кровь назад и насколько сильно.
    cite: [2, 4]
  - level: patient
    prompt: Какой признак, по статье, — повод срочно вызвать скорую?
    options:
      - text: Шум в сердце, который врач услышал на плановом осмотре
      - text: Отсутствие каких-либо жалоб
      - text: Внезапная сильная одышка в покое, которая усиливается лёжа
        correct: true
    explanation: Если внезапно появилась сильная одышка в покое, которая усиливается в положении лёжа, или кашель с розовой пенистой мокротой, нужно вызвать скорую помощь.
    cite: [4]
  - level: student
    prompt: Что лежит в основе вторичной митральной регургитации?
    options:
      - text: Перфорация створки клапана
      - text: Тяжёлая систолическая дисфункция и ремоделирование ЛЖ при нормальном строении клапана
        correct: true
      - text: Отрыв хорд при пролапсе митрального клапана
    explanation: Вторичная МН — результат тяжёлой систолической дисфункции и глобального или локального ремоделирования ЛЖ при структурно нормальном клапане. Перфорация створки и поражение хорд относятся к причинам первичной МН.
    cite: [2, 4]
  - level: student
    prompt: Что относится к гемодинамическим последствиям тяжёлой митральной регургитации?
    options:
      - text: Уменьшение левого предсердия и левого желудочка
      - text: Расширение ЛП, увеличение ЛЖ, лёгочная гипертензия
        correct: true
    explanation: Гемодинамические последствия тяжёлой МН — умеренное или выраженное расширение ЛП, увеличение ЛЖ, лёгочная гипертензия в покое или при нагрузке.
    cite: [2]
