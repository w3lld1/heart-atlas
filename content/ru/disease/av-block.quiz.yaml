questions:
  - level: patient
    prompt: Что такое атриовентрикулярная (АВ) блокада?
    options:
      - text: Частичное или полное прерывание проведения импульса от предсердий к желудочкам
        correct: true
      - text: Ускоренное проведение импульса от предсердий к желудочкам
    explanation: АВ-блокада — это частичное или полное прерывание проведения электрического импульса от предсердий к желудочкам.
    cite: [1, 2]
  - level: patient
    prompt: При какой степени АВ-блокада полная?
    options:
      - text: При I степени
      - text: При II степени
      - text: При III степени
        correct: true
    explanation: Различают три степени — при I и II степени блокада частичная, при III — полная.
    cite: [2]
  - level: patient
    prompt: Нужно ли обычно лечить блокаду I степени?
    options:
      - text: Да, всегда нужен постоянный кардиостимулятор
      - text: Нет, обычно она не требует лечения
        correct: true
    explanation: Блокада I степени обычно не требует лечения.
    cite: [2]
  - level: patient
    prompt: Как устанавливают постоянный кардиостимулятор?
    options:
      - text: Только во время операции на открытом сердце
      - text: Вживляют под кожу, обычно под ключицей, без операции на открытом сердце
        correct: true
    explanation: Кардиостимулятор — небольшое устройство, которое вживляют под кожу, обычно под ключицей. Для его установки не нужна операция на открытом сердце.
    cite: [1]
  - level: student
    prompt: Как меняется интервал PR при АВ-блокаде II степени Мобитц I (периодика Венкебаха)?
    options:
      - text: Удлиняется от комплекса к комплексу, пока QRS не выпадет
        correct: true
      - text: Укорачивается от комплекса к комплексу, пока QRS не выпадет
    explanation: При Мобитц I PR от комплекса к комплексу удлиняется, пока импульс не будет заблокирован и QRS не выпадет; следующий проведённый комплекс имеет самый короткий PR, и цикл повторяется.
    cite: [1, 2]
  - level: student
    prompt: Какой замещающий ритм при АВ-блокаде III степени даёт широкие QRS и более медленный, ненадёжный ритм?
    options:
      - text: Из области выше бифуркации пучка Гиса
      - text: Из области ниже бифуркации пучка Гиса
        correct: true
    explanation: Ритм из области ниже бифуркации даёт широкие QRS, он медленнее и ненадёжен, а симптомы тяжелее. Ритм из области выше бифуркации даёт узкие QRS и относительно частый и надёжный ритм.
    cite: [2]
