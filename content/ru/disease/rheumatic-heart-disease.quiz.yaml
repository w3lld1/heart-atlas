questions:
  - level: patient
    prompt: Что такое острая ревматическая лихорадка (ОРЛ)?
    options:
      - text: Врождённый порок клапанов сердца, который заметен уже с рождения
      - text: Воспалительная реакция организма на стрептококковую ангину
        correct: true
      - text: Сама стрептококковая инфекция, которая перешла из горла в сердце
    explanation: ОРЛ — это не сама инфекция, а воспалительная реакция организма на стрептококковую инфекцию горла, ангину или фарингит.
    cite: [1, 5]
  - level: patient
    prompt: Когда обычно начинается ОРЛ после ангины, вызванной стрептококком группы А?
    options:
      - text: В первые 1–2 часа после начала ангины
      - text: Только спустя 5–10 лет после ангины
      - text: Через 2–3 недели
        correct: true
    explanation: ОРЛ начинается после ангины или фарингита, вызванных стрептококком группы А, обычно через 2–3 недели.
    cite: [1, 4]
  - level: patient
    prompt: Какие клапаны сердца ревматизм поражает чаще всего?
    options:
      - text: Митральный и аортальный
        correct: true
      - text: Трикуспидальный и лёгочный
      - text: Только клапан лёгочной артерии
    explanation: Чаще всего ревматизм поражает митральный и аортальный клапаны. Трикуспидальный и лёгочный клапаны изолированно почти не поражаются.
    cite: [4]
  - level: patient
    prompt: Что может УЗИ сердца, если подозревают ОРЛ?
    options:
      - text: Доказать ОРЛ само по себе, без оценки других признаков
      - text: Найти воспаление клапанов, даже когда шума не слышно
        correct: true
      - text: Измерить уровень антител к стрептококку группы А в крови
    explanation: Одного анализа, который доказал бы ОРЛ, нет. УЗИ сердца рекомендуют всем, у кого подозревают ОРЛ, — оно находит воспаление клапанов даже тогда, когда шума не слышно. Антитела к стрептококку смотрят в крови.
    cite: [1, 4]
  - level: student
    prompt: По критериям Джонса, что нужно для диагноза первичной ОРЛ при доказанной стрептококковой инфекции?
    options:
      - text: Одно любое малое проявление
      - text: Сама стрептококковая инфекция, без каких-либо проявлений
      - text: 2 больших или 1 большое и 2 малых
        correct: true
    explanation: При доказанной предшествующей инфекции стрептококком группы А первичную ОРЛ диагностируют по 2 большим или 1 большому и 2 малым проявлениям. Больших критериев пять — кардит, артрит, хорея, кольцевидная эритема и подкожные узелки.
    cite: [1]
  - level: student
    prompt: Что самое частое проявление ОРЛ?
    options:
      - text: Мигрирующий полиартрит
        correct: true
      - text: Кольцевидная эритема и подкожные узелки
      - text: Изолированное поражение лёгочного клапана
    explanation: Мигрирующий полиартрит — самое частое проявление ОРЛ. Кожные проявления редки, а лёгочный клапан изолированно почти не поражается.
    cite: [4]
