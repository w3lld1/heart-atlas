questions:
  - level: patient
    prompt: Что такое аномалии коронарных артерий?
    options:
      - text: Сужение коронарных артерий из-за атеросклероза у пожилых людей
      - text: Врождённые отклонения в отхождении, ходе или ветвях артерий
        correct: true
      - text: Приобретённые изменения артерий у детей после болезни Кавасаки
    explanation: Аномалии коронарных артерий — врождённые отклонения в том, откуда отходят коронарные артерии, как они идут или как устроены их конечные ветви.
    cite: [1]
  - level: patient
    prompt: Что происходит при ALCAPA после рождения, когда давление в лёгочной артерии снижается?
    options:
      - text: Кровоток по левой коронарной артерии резко возрастает
      - text: Левая коронарная артерия сама переходит на аорту
      - text: Кровоток по левой коронарной артерии падает
        correct: true
    explanation: После рождения давление в лёгочной артерии снижается, кровоток по левой коронарной артерии падает, и сердечной мышце левого желудочка не хватает крови и кислорода.
    cite: [1, 2]
  - level: patient
    prompt: Что такое коронарная фистула?
    options:
      - text: Ненормальное соединение коронарной артерии с камерой или сосудом
        correct: true
      - text: Расширение стенки коронарной артерии в виде мешка после воспаления
      - text: Тромб, полностью закрывающий просвет коронарной артерии
    explanation: Коронарная фистула — ненормальное соединение коронарной артерии с камерой сердца или сосудом в обход мелких сосудов.
    cite: [1, 2]
  - level: patient
    prompt: В каком случае младенцу с ALCAPA нужно вызвать скорую?
    options:
      - text: Чихание во время вечернего купания
      - text: Приступы резкого беспокойства с бледностью, потливостью и одышкой
        correct: true
      - text: Икота после кормления, которая через пару минут проходит сама собой
    explanation: Вызывайте скорую по номеру 103 или 112, если у младенца приступы резкого беспокойства с бледностью, потливостью и усилением одышки, особенно во время или после кормления.
    cite: [1, 4]
  - level: student
    prompt: От чего отходит левая коронарная артерия при ALCAPA?
    options:
      - text: От правого синуса аорты
      - text: От передней поверхности восходящей аорты
      - text: От задней поверхности лёгочного ствола
        correct: true
    explanation: При ALCAPA правая коронарная артерия отходит от аорты, а левая — от задней поверхности лёгочного ствола и почти сразу делится на переднюю межжелудочковую и огибающую ветви.
    cite: [1]
  - level: student
    prompt: Чем Минздрав объясняет недостаточность митрального клапана при ALCAPA?
    options:
      - text: Ишемией папиллярных мышц и дилатацией фиброзного кольца
        correct: true
      - text: Ревматическим поражением створок после перенесённой ангины
      - text: Врождённым расщеплением передней створки митрального клапана
    explanation: По Минздраву, недостаточность митрального клапана при ALCAPA возникает из-за ишемии папиллярных мышц и дилатации фиброзного кольца.
    cite: [1]
