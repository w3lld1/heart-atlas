questions:
  - level: patient
    prompt: Что сдавливается при синдроме верхней апертуры грудной клетки?
    options:
      - text: Трахея и пищевод в нижней части шеи
      - text: Нервы, артерии или крупные вены на пути из шеи к руке
        correct: true
      - text: Желчные протоки и кровеносные сосуды печени в брюшной полости
    explanation: Это группа состояний, при которых сдавливаются нервы, артерии или крупные вены там, где они проходят из шеи в грудную клетку и дальше к руке.
    cite: [1, 4]
  - level: patient
    prompt: Какие три формы синдрома различают по тому, что сдавлено?
    options:
      - text: Нейрогенную, венозную и артериальную
        correct: true
      - text: Сердечную, лёгочную и желудочно-кишечную
      - text: Почечную, печёночную и кишечную
    explanation: Различают нейрогенную форму (нервы плечевого сплетения), венозную (подключичная вена) и артериальную (подключичная артерия).
    cite: [1, 3]
  - level: patient
    prompt: Между чем могут оказаться зажаты сосуды или нервы в проходе из шеи к руке?
    options:
      - text: Между почкой и печенью в брюшной полости
      - text: Между коленной чашечкой и бедром
      - text: Между ребром, ключицей или мышцей
        correct: true
    explanation: Проход из шеи к руке тесный, поэтому сосуды или нервы могут оказаться зажаты между ребром, ключицей или мышцей.
    cite: [4]
  - level: patient
    prompt: При каком внезапном симптоме нужно вызвать скорую?
    options:
      - text: Чихание и насморк
      - text: Кашель с кровью
        correct: true
      - text: Зуд кожи на плече
    explanation: Скорую вызывают, если внезапно появились одышка, боль в груди, предобморочное состояние или обморок, кашель с кровью — так может проявляться ТЭЛА.
    cite: [1]
  - level: student
    prompt: Компрессию каких структур Минздрав называет в определении СВАГК?
    options:
      - text: Спинного мозга и позвоночных артерий в канале
      - text: Плечевого сплетения или подключичных сосудов
        correct: true
      - text: Блуждающего нерва и сонных артерий
    explanation: Минздрав определяет СВАГК как группу клинических синдромов, вызванную врождённой или приобретённой компрессией плечевого сплетения или подключичных сосудов при их прохождении через верхнюю апертуру грудной клетки.
    cite: [1]
  - level: student
    prompt: Что, по MSD, сдавлено при нейрогенной форме синдрома?
    options:
      - text: Седалищный нерв в области ягодицы
      - text: Лицевой нерв
      - text: Нижний ствол плечевого сплетения
        correct: true
    explanation: По MSD, при нейрогенной форме сдавлен нижний ствол плечевого сплетения, хотя характер поражения до конца не ясен.
    cite: [3]
