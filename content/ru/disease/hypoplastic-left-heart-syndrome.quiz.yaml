questions:
  - level: patient
    prompt: Как до операции кровь от правого желудочка попадает к органам тела у новорождённого с СГЛС?
    options:
      - text: Через левый желудочек и аортальный клапан, как в здоровом сердце
      - text: Только через открытый артериальный проток
        correct: true
      - text: Через верхнюю полую вену, минуя лёгочную артерию
    explanation: Работу левых отделов берёт на себя правый желудочек, но к органам кровь от него попадает только через открытый артериальный проток — сосуд, который соединяет лёгочную артерию с аортой и после рождения сам закрывается.
    cite: [1, 3]
  - level: patient
    prompt: Зачем новорождённому с СГЛС вводят в вену лекарство из группы простагландинов?
    options:
      - text: Чтобы артериальный проток не закрылся
        correct: true
      - text: Чтобы закрыть отверстие между предсердиями
      - text: Чтобы вырос недоразвитый левый желудочек
    explanation: В вену вводят лекарство из группы простагландинов, чтобы артериальный проток не закрылся.
    cite: [1, 3]
  - level: patient
    prompt: Какова цель этапных операций при СГЛС?
    options:
      - text: Полностью восстановить нормальное строение сердца
      - text: Заменить недоразвитый левый желудочек искусственным
      - text: Чтобы правый желудочек качал кровь к органам, а в лёгкие кровь шла другим путём
        correct: true
    explanation: Цель операций — чтобы единственный работающий, правый, желудочек качал кровь к органам тела, а в лёгкие кровь поступала другим путём. Эти операции не делают сердце нормальным.
    cite: [1, 3]
  - level: patient
    prompt: Какой признак у новорождённого с СГЛС — повод вызвать скорую по номеру 103 или 112?
    options:
      - text: Короткая икота после кормления при хорошем самочувствии
      - text: Бледная, серая или синюшная кожа и холодные руки и ноги
        correct: true
      - text: Редкое чихание без каких-либо других изменений
    explanation: Если у новорождённого частое тяжёлое дыхание, бледная, серая или синюшная кожа, холодные руки и ноги, он стал вялым, плохо ест или мало мочится, вызывайте скорую помощь по номеру 103 или 112.
    cite: [3]
  - level: student
    prompt: Почему при СГЛС метаболический ацидоз усиливается при дыхании кислородом?
    options:
      - text: Он снижает лёгочное сопротивление, и выброс ПЖ уходит в лёгкие, а не в большой круг
        correct: true
      - text: Он повышает лёгочное сопротивление и перегружает правый желудочек давлением
      - text: Он расширяет ОАП, и кровь из аорты уходит обратно в правый желудочек
    explanation: Кислород снижает лёгочное сосудистое сопротивление, и большая часть выброса правого желудочка уходит в лёгкие, а не через ОАП в большой круг.
    cite: [3]
  - level: student
    prompt: В каком порядке выполняют три этапа хирургического лечения СГЛС по российским рекомендациям?
    options:
      - text: Операция Fontan, затем ДКПА (Glenn), затем операция Norwood
      - text: Стентирование ОАП, затем ДКПА, затем пересадка сердца
      - text: Операция Norwood, затем ДКПА (Glenn), затем операция Fontan
        correct: true
    explanation: Российские рекомендации — этапное лечение с созданием одножелудочковой гемодинамики из трёх этапов — операция Norwood, двунаправленный кавопульмональный анастомоз (ДКПА, Glenn), операция Fontan.
    cite: [1]
