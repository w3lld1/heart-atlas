questions:
  - level: patient
    prompt: В каких сосудах при болезни Бюргера образуются тромбы?
    options:
      - text: В артериях сетчатки глаза и зрительного нерва
      - text: В мелких и средних артериях рук и ног
        correct: true
      - text: В венах печени и кишечника
    explanation: При болезни Бюргера тромбы образуются в мелких и средних артериях рук и ног, а иногда и в поверхностных венах.
    cite: [5, 6]
  - level: patient
    prompt: Что российские рекомендации называют основным фактором риска болезни Бюргера?
    options:
      - text: Работу за компьютером
      - text: Употребление молочных продуктов
      - text: Курение
        correct: true
    explanation: Российские рекомендации называют курение основным фактором риска болезни Бюргера.
    cite: [2]
  - level: patient
    prompt: Зачем при подозрении на болезнь Бюргера делают анализы крови и УЗИ сердца?
    options:
      - text: Чтобы исключить другие причины плохого кровотока
        correct: true
      - text: Чтобы определить группу крови для будущего переливания
      - text: Чтобы узнать, есть ли аллергия на пыльцу растений
    explanation: Анализы крови и методы визуализации, в том числе эхокардиографию, делают, чтобы исключить другие причины плохого кровотока, например васкулит или тромбы из сердца.
    cite: [6]
  - level: patient
    prompt: От чего при болезни Бюргера важно беречь руки и ноги?
    options:
      - text: От солнечного света и свежего воздуха
      - text: От холода, ожогов и травм
        correct: true
      - text: От обычной воды и мыла
    explanation: Важно избегать холода, ожогов, химических и механических травм, особенно от плохо подобранной обуви.
    cite: [5]
  - level: student
    prompt: Что, по данным MSD, сохранено в остром периоде болезни Бюргера?
    options:
      - text: Свободный от тромбов просвет артерии
      - text: Эндотелий без признаков пролиферации
      - text: Внутренняя эластическая мембрана
        correct: true
    explanation: В остром периоде просвет закрывают тромбы, интима инфильтрирована нейтрофилами и лимфоцитами, эндотелий пролиферирует, но внутренняя эластическая мембрана сохранена.
    cite: [5]
  - level: student
    prompt: Что, по данным MSD, показывает ангиография при болезни Бюргера?
    options:
      - text: Штопорообразные коллатерали вокруг окклюзий
        correct: true
      - text: Атеросклеротические бляшки во многих артериях
      - text: Сужение аорты и её крупных ветвей
    explanation: По MSD, ангиография показывает сегментарные окклюзии дистальных артерий кистей и стоп, извитые штопорообразные коллатерали вокруг окклюзий и отсутствие атеросклероза.
    cite: [5]
