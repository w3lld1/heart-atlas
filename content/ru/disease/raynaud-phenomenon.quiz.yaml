questions:
  - level: patient
    prompt: Что происходит с мелкими артериями пальцев во время приступа феномена Рейно?
    options:
      - text: В их стенках откладываются кристаллы кальция
      - text: Они резко сужаются (спазм)
        correct: true
      - text: Они растягиваются и лопаются
    explanation: Во время приступа феномена Рейно мелкие артерии пальцев резко сужаются — это спазм.
    cite: [1, 2, 4]
  - level: patient
    prompt: На сигналы какой системы, по MSD, вероятно, слишком сильно отвечают сосуды пальцев?
    options:
      - text: Симпатической нервной системы
        correct: true
      - text: Мочевыделительной системы почек
      - text: Дыхательной системы лёгких
    explanation: По справочнику MSD, механизм до конца не известен; вероятно, сосуды пальцев слишком сильно отвечают на сигналы симпатической нервной системы.
    cite: [4, 5]
  - level: patient
    prompt: Что главное в лечении вторичного феномена Рейно?
    options:
      - text: Есть больше сладкого
      - text: Сменить очки на контактные линзы
      - text: Лечить основную болезнь
        correct: true
    explanation: При вторичном феномене Рейно главное — лечить основную болезнь.
    cite: [4, 5]
  - level: patient
    prompt: Что из этого в руке или ноге — повод сразу вызвать скорую?
    options:
      - text: Лёгкий зуд кожи после горячего душа
      - text: Внезапно появилась сильная боль
        correct: true
      - text: Небольшая мозоль от новой тесной обуви
    explanation: Сразу вызывайте скорую, если в руке или ноге внезапно появилась сильная боль.
    cite: [3]
  - level: student
    prompt: Как рекомендации Минздрава по системному склерозу у детей определяют феномен Рейно?
    options:
      - text: Как хроническое воспаление суставов пальцев
      - text: Как стойкое расширение поверхностных вен кисти
      - text: Как эпизоды преходящей дигитальной ишемии
        correct: true
    explanation: В рекомендациях Минздрава по системному склерозу у детей феномен Рейно определён как эпизоды преходящей дигитальной ишемии.
    cite: [2]
  - level: student
    prompt: Какое исследование рекомендации Минздрава по системному склерозу у детей рекомендуют всем пациентам?
    options:
      - text: Капилляроскопию ногтевого ложа
        correct: true
      - text: Биопсию печени под контролем УЗИ
      - text: Коронарографию с контрастом
    explanation: Рекомендации Минздрава по системному склерозу у детей рекомендуют капилляроскопию ногтевого ложа всем пациентам.
    cite: [2]
