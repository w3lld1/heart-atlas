questions:
  - level: patient
    prompt: Какие отделы мозга питают позвоночные артерии?
    options:
      - text: Почки, печень и другие органы брюшной полости
      - text: Ствол мозга, мозжечок и задние отделы коры
        correct: true
      - text: Сердечную мышцу
    explanation: Позвоночные артерии питают задние отделы мозга — ствол мозга, мозжечок и задние отделы коры.
    cite: [4]
  - level: patient
    prompt: Во что сливаются позвоночные артерии в черепе?
    options:
      - text: В воротную вену печени
      - text: В лёгочный ствол
      - text: В основную артерию
        correct: true
    explanation: Позвоночные артерии несут кровь по задней поверхности шеи, а в черепе сливаются в основную артерию.
    cite: [5]
  - level: patient
    prompt: Что может сделать тромб, образовавшийся на бляшке?
    options:
      - text: Оторваться и закупорить артерию мозга
        correct: true
      - text: Укрепить стенку артерии и расширить её просвет
      - text: Превратиться в новую ветвь артерии
    explanation: На бляшке может образоваться тромб — он может закрыть артерию или оторваться и закупорить артерию мозга.
    cite: [6]
  - level: patient
    prompt: Какой внезапный симптом — повод немедленно вызвать скорую?
    options:
      - text: Чихание и заложенность носа
      - text: Двоение или потеря зрения
        correct: true
      - text: Зуд кожи на руках
    explanation: Скорую нужно вызвать немедленно, если внезапно появились двоение или потеря зрения (как и другие признаки из раздела о скорой), даже если симптом быстро прошёл.
    cite: [5]
  - level: student
    prompt: Какие основные механизмы атеротромботического инсульта называет Минздрав?
    options:
      - text: Разрыв аневризмы мозговой артерии с кровоизлиянием в ткань мозга
      - text: Воспаление оболочек мозга
      - text: Артерио-артериальная эмболия, гипоперфузия или их сочетание
        correct: true
    explanation: Минздрав называет основными механизмами атеротромботического инсульта артерио-артериальную эмболию (тромбом или фрагментом атеромы), гипоперфузию или их сочетание.
    cite: [1]
  - level: student
    prompt: Через какую артерию задний бассейн сообщается с передним в виллизиевом круге?
    options:
      - text: Нижняя брыжеечная артерия кишечника
      - text: Задняя соединительная артерия
        correct: true
      - text: Почечная артерия
    explanation: Позвоночные и основная артерии образуют задний (вертебрально-базилярный) бассейн; с передним он сообщается в виллизиевом круге через заднюю соединительную артерию.
    cite: [4]
