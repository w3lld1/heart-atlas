questions:
  - level: patient
    prompt: Что такое дефект межжелудочковой перегородки?
    options:
      - text: Воспаление сердечной мышцы
      - text: Врождённое отверстие в перегородке между правым и левым желудочками
        correct: true
      - text: Тромб в лёгочной артерии
    explanation: ДМЖП — врождённый порок сердца, при котором в перегородке между правым и левым желудочками есть отверстие.
    cite: [1]
  - level: patient
    prompt: Куда идёт кровь через отверстие при ДМЖП?
    options:
      - text: Из левого желудочка в правый
        correct: true
      - text: Из лёгочной артерии в аорту
      - text: Через отверстие кровь не проходит
    explanation: Через отверстие кровь идёт из левого желудочка в правый, поэтому в сосуды лёгких поступает лишняя кровь, а левый желудочек работает с перегрузкой.
    cite: [1]
  - level: patient
    prompt: Что часто происходит с небольшими дефектами межжелудочковой перегородки?
    options:
      - text: Они всегда быстро увеличиваются
      - text: Они всегда требуют срочной операции
      - text: Они часто закрываются сами
        correct: true
    explanation: Небольшие дефекты часто закрываются сами.
    cite: [1, 3]
  - level: patient
    prompt: Какое исследование главное для диагностики ДМЖП?
    options:
      - text: Измерение температуры тела
      - text: Анализ мочи
      - text: УЗИ сердца (эхокардиография) с допплеровским режимом
        correct: true
    explanation: Главное исследование — УЗИ сердца (эхокардиография) с допплеровским режимом.
    cite: [1, 3]
  - level: student
    prompt: Какой сброс крови характерен для ДМЖП, исключая терминальную стадию?
    options:
      - text: Право-левый
      - text: Лево-правый
        correct: true
      - text: Сброса через дефект нет
    explanation: Для ДМЖП, исключая терминальную стадию, характерен лево-правый сброс крови из ЛЖ в ПЖ.
    cite: [1]
  - level: student
    prompt: Что из перечисленного — признаки синдрома Эйзенменгера?
    options:
      - text: Нормальное давление в лёгочной артерии и лево-правый сброс
      - text: Высокая лёгочная гипертензия и право-левый сброс через дефект
        correct: true
      - text: Самостоятельное закрытие дефекта
    explanation: Высокая лёгочная гипертензия и право-левый сброс крови через дефект — признаки синдрома Эйзенменгера.
    cite: [1, 3]
