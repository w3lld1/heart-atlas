questions:
  - level: patient
    prompt: Что происходит со стенкой артерии при ФМД?
    options:
      - text: Она полностью рассасывается и исчезает без следа
      - text: Она аномально утолщается, и артерия сужается
        correct: true
      - text: Она покрывается изнутри слоем кристаллов соли
    explanation: При ФМД стенка артерии аномально утолщается, и артерия сужается, а иногда закупоривается или расширяется, образуя аневризму.
    cite: [4, 5, 6]
  - level: patient
    prompt: Какая болезнь ФМД по своему течению?
    options:
      - text: Заразная, передаётся через общую посуду
      - text: Кратковременная, исчезает сама после отдыха
      - text: Хроническая, нужно лечение и наблюдение
        correct: true
    explanation: ФМД — хроническая болезнь сосудов, нужны лечение и наблюдение.
    cite: [4]
  - level: patient
    prompt: На что похожа на снимке артерия при мультифокальной форме ФМД?
    options:
      - text: На нитку бус или чётки
        correct: true
      - text: На туго закрученную пружину
      - text: На мелкую рыболовную сеть
    explanation: При мультифокальной форме ФМД в средней и дальней части артерии участки сужения чередуются с расширениями — на снимке это похоже на нитку бус или чётки.
    cite: [1, 4]
  - level: patient
    prompt: Какой признак может появиться, если ФМД сонных артерий проявилась инсультом?
    options:
      - text: Зуд от укуса комара
      - text: Трудности с речью
        correct: true
      - text: Сухость кожи зимой
    explanation: ФМД сонных артерий может проявиться ТИА или инсультом — появляются трудности с речью, мышечная слабость, паралич одной половины тела, нарушения зрения.
    cite: [6]
  - level: student
    prompt: Как международный консенсус предлагает классифицировать поражения при ФМД?
    options:
      - text: По данным электрокардиограммы
      - text: По уровню сахара в крови натощак
      - text: По ангиографической картине
        correct: true
    explanation: Международный консенсус предлагает классифицировать поражения только по ангиографической картине — фокальная или мультифокальная ФМД.
    cite: [4]
  - level: student
    prompt: Какой метод консенсус допускает первым при ФМД почечных артерий только в центрах с большим опытом?
    options:
      - text: Дуплексное УЗИ
        correct: true
      - text: Проверку слуха
      - text: Измерение глазного давления
    explanation: Дуплексное УЗИ как первый метод диагностики ФМД почечных артерий консенсус допускает только в специализированных центрах с большим опытом.
    cite: [4, 7]
