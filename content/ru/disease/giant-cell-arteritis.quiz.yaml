questions:
  - level: patient
    prompt: Когда врачи начинают лечение этой болезни?
    options:
      - text: После того как биопсия подтвердит диагноз
      - text: Как только врач заподозрил болезнь
        correct: true
      - text: Когда появятся осложнения на аорте
    explanation: Лечение начинают срочно, как только врач заподозрил ГКА, обычно ещё до биопсии, потому что без лечения может развиться слепота.
    cite: [2, 4, 5]
  - level: patient
    prompt: Что сужает просвет поражённой артерии при этой болезни?
    options:
      - text: Холестериновые бляшки, как при атеросклерозе
      - text: Тромб, принесённый током крови из сердца
      - text: Резко утолщённая внутренняя оболочка стенки
        correct: true
    explanation: Внутренняя оболочка артерии резко утолщается, и просвет сужается, иногда до полной закупорки.
    cite: [4]
  - level: patient
    prompt: Когда исследуют аорту и её ветви с помощью КТ или МРТ?
    options:
      - text: При постановке диагноза и затем периодически
        correct: true
      - text: Лишь один раз, спустя несколько лет после диагноза
      - text: После того как пройдёт головная боль
    explanation: Чтобы не пропустить поражение аорты и её ветвей, их исследуют с помощью КТ или МРТ при постановке диагноза и затем периодически, даже без симптомов.
    cite: [1, 2, 4]
  - level: patient
    prompt: Что делать, если внезапно пропало или ухудшилось зрение?
    options:
      - text: Подождать, пока зрение восстановится само
      - text: Отложить до планового визита к врачу
      - text: Сразу вызвать скорую помощь
        correct: true
    explanation: Внезапная потеря зрения — опасное неотложное состояние, при котором нужно немедленно обратиться за медицинской помощью. Если внезапно пропало или ухудшилось зрение, сразу вызывайте скорую.
    cite: [3]
  - level: student
    prompt: Почему биопсию берут предпочтительно из участка артерии, который выглядит изменённым?
    options:
      - text: Воспалённые сегменты чередуются с нормальными
        correct: true
      - text: Так образец получается короче
      - text: Чтобы биопсию можно было сделать без местного обезболивания
    explanation: Биопсию берут предпочтительно из участка, который выглядит изменённым, потому что воспалённые сегменты чередуются с нормальными.
    cite: [4]
  - level: student
    prompt: Почему, по MSD, одну лишь СОЭ не следует использовать для оценки активности болезни?
    options:
      - text: При этой болезни СОЭ обычно остаётся нормальной
      - text: У пожилых её могут повышать и другие причины
        correct: true
      - text: Её значение не меняется от начала лечения до ремиссии
    explanation: По MSD, одну лишь СОЭ для оценки ответа на лечение и активности болезни использовать не следует, потому что у пожилых её могут повышать и другие причины, например моноклональные гаммапатии.
    cite: [4]
