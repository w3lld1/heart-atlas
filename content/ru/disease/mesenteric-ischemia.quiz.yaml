questions:
  - level: patient
    prompt: Что такое мезентериальная ишемия?
    options:
      - text: Расширение брюшной аорты, которое со временем может разорваться
      - text: Сужение почечных артерий, из-за которого повышается давление
      - text: Нехватка крови в кишечнике из-за слабого кровотока
        correct: true
    explanation: Мезентериальная ишемия — нехватка крови в кишечнике, когда кровоток по его сосудам снижается или прекращается.
    cite: [3, 7]
  - level: patient
    prompt: Откуда может прийти тромб, который закупорил артерию кишечника?
    options:
      - text: Из сердца, например при фибрилляции предсердий
        correct: true
      - text: Из глубоких вен ног, например при их тромбозе после операции
      - text: Из лёгких, например при тяжёлом воспалении лёгких
    explanation: Тромб может образоваться в самой артерии или прийти с током крови из сердца, например при фибрилляции предсердий.
    cite: [3, 5]
  - level: patient
    prompt: Когда появляется боль при хронической ишемии кишечника?
    options:
      - text: При долгой ходьбе, когда больше крови нужно мышцам ног
      - text: После еды, когда кишке нужно больше крови
        correct: true
      - text: Ночью во сне, когда сердце бьётся медленнее обычного
    explanation: Хроническая ишемия проявляется сильной ровной болью, которая появляется после еды — во время пищеварения кишке нужно больше крови.
    cite: [4, 6]
  - level: patient
    prompt: Что главное в лечении острой ишемии кишечника?
    options:
      - text: Подождать, не пройдёт ли боль сама, и только потом лечить
      - text: Подобрать строгую диету, чтобы кишке было легче работать
      - text: Как можно быстрее восстановить кровоток по артерии
        correct: true
    explanation: Острая закупорка артерии кишечника — неотложное хирургическое состояние. Главное — как можно быстрее восстановить кровоток. Ждать, пройдёт ли боль сама, нельзя — без кровотока кишка быстро погибает.
    cite: [3, 4, 5, 6]
  - level: student
    prompt: Почему ХМН редко даёт симптомы, пока не сужены одновременно ВБА и чревный ствол?
    options:
      - text: Слизистая кишки получает мало крови и устойчива к её нехватке
      - text: Между ними обширное коллатеральное кровообращение
        correct: true
      - text: Тонкую кишку вместо ВБА питает нижняя брыжеечная артерия
    explanation: Хроническая мезентериальная недостаточность редко даёт симптомы, если не сужены существенно или не окклюзированы одновременно ВБА и чревный ствол, — коллатеральное кровообращение между ними обширное.
    cite: [4]
  - level: student
    prompt: Какой отдел толстой кишки — зона водораздела между ВБА и НБА?
    options:
      - text: Селезёночный изгиб
        correct: true
      - text: Сигмовидная кишка
      - text: Восходящая ободочная кишка
    explanation: Селезёночный изгиб — зона водораздела между ВБА и НБА с особым риском ишемии. ВБА питает ободочную кишку до селезёночного изгиба, НБА — нисходящую ободочную, сигмовидную и прямую кишку.
    cite: [3]
