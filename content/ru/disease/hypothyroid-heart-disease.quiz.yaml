questions:
  - level: patient
    prompt: Что такое гипотиреоз?
    options:
      - text: Сужение главной артерии на шее
      - text: Щитовидная железа вырабатывает недостаточно гормонов
        correct: true
      - text: Заражение клапанов сердца бактериями, попавшими из полости рта
    explanation: Гипотиреоз — состояние, при котором щитовидная железа вырабатывает недостаточно гормонов и в организме возникает их дефицит.
    cite: [1, 5]
  - level: patient
    prompt: Что происходит с работой организма, когда гормонов щитовидной железы не хватает?
    options:
      - text: Она ускоряется, и сердце бьётся чаще
      - text: 'Ничего не меняется: эти гормоны на сердце не влияют'
      - text: Она замедляется, нарушается и работа сердца
        correct: true
    explanation: Когда гормонов щитовидной железы не хватает, работа организма замедляется, нарушаются обменные процессы и в том числе работа сердца.
    cite: [1, 6]
  - level: patient
    prompt: К чему со временем может привести нелеченый гипотиреоз?
    options:
      - text: К сердечной недостаточности
        correct: true
      - text: К аллергии на пыльцу деревьев
      - text: К куриной слепоте в сумерках
    explanation: Если гипотиреоз не лечить, со временем он может привести к сердечной недостаточности.
    cite: [6]
  - level: patient
    prompt: Как называется опасное для жизни осложнение гипотиреоза из раздела о скорой помощи?
    options:
      - text: Горная болезнь
      - text: Микседематозная кома
        correct: true
      - text: Солнечный тепловой удар
    explanation: Опасное для жизни осложнение гипотиреоза — микседематозная кома.
    cite: [5]
  - level: student
    prompt: Каково основное изменение на клеточном уровне при гипотиреозе?
    options:
      - text: Ускоренное деление клеток, которое создаёт в клетке избыток энергии
      - text: Снижение потребления кислорода и синтеза АТФ, клетке не хватает энергии
        correct: true
      - text: Накопление кристаллов в ядре клетки, которое блокирует синтез всех белков
    explanation: Основное изменение на клеточном уровне — снижение потребления кислорода, интенсивности окислительного фосфорилирования и синтеза АТФ, клетка испытывает дефицит энергии.
    cite: [1]
  - level: student
    prompt: К каким причинам брадикардии ESC относит гипотиреоз?
    options:
      - text: К наследственным болезням ионных каналов
      - text: К врождённым порокам клапанов сердца
      - text: К внешним (метаболическим) причинам
        correct: true
    explanation: ESC относит гипотиреоз к внешним (метаболическим) причинам и синусовой брадикардии или дисфункции синусового узла, и нарушений АВ-проведения.
    cite: [3]
