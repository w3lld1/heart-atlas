questions:
  - level: patient
    prompt: Что значит очень небольшая («следовая») трикуспидальная регургитация?
    options:
      - text: Это всегда показание к срочной операции
      - text: Это нормальная находка, лечения она не требует
        correct: true
    explanation: Очень небольшая («следовая», физиологическая) регургитация — нормальная находка, и лечения она не требует.
    cite: [3]
  - level: patient
    prompt: Что иногда замечает человек с трикуспидальной регургитацией?
    options:
      - text: Звон в ушах
      - text: Боль в суставах
      - text: Пульсацию на шее
        correct: true
    explanation: Иногда человек замечает пульсацию на шее из-за повышенного давления в венах и правом предсердии.
    cite: [3, 4]
  - level: patient
    prompt: Как чаще всего находят лёгкую трикуспидальную регургитацию?
    options:
      - text: Случайно, на УЗИ сердца, сделанном по другому поводу
        correct: true
      - text: По сильной боли в груди
      - text: По анализу мочи
    explanation: Лёгкую регургитацию чаще всего находят случайно, на УЗИ сердца, сделанном по другому поводу.
    cite: [3]
  - level: patient
    prompt: Что обычно предпочитают при операции на трёхстворчатом клапане?
    options:
      - text: Замену клапана протезом
      - text: Восстановление клапана
        correct: true
    explanation: Восстановление клапана обычно предпочитают замене.
    cite: [3]
  - level: student
    prompt: Как меняется шум ТР на вдохе?
    options:
      - text: Усиливается (симптом Карвалло)
        correct: true
      - text: Ослабевает
    explanation: Голосистолический шум ТР лучше всего выслушивается у левого края грудины в среднем или нижнем отделе и усиливается на вдохе (симптом Карвалло), но часто не выслушивается.
    cite: [3]
  - level: student
    prompt: Какой метод предпочтителен для оценки размеров и функции ПЖ?
    options:
      - text: Спирометрия
      - text: МРТ сердца
        correct: true
      - text: Электроэнцефалография
    explanation: МРТ сердца — предпочтительный метод оценки размеров и функции ПЖ.
    cite: [3]
