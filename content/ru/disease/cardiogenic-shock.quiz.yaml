questions:
  - level: patient
    prompt: Что такое кардиогенный шок?
    options:
      - text: Сильное душевное потрясение после внезапного тяжёлого известия
      - text: Сердце резко уменьшает выброс крови, органам не хватает кислорода
        correct: true
      - text: Воспаление слизистой оболочки желудка после очень острой и жирной еды
    explanation: Кардиогенный шок — угрожающее жизни состояние, при котором сердце резко уменьшает выброс крови и органы и ткани получают слишком мало крови и кислорода.
    cite: [1, 5]
  - level: patient
    prompt: К каким органам организм в первую очередь направляет кровь, когда начинается шок?
    options:
      - text: Коже рук и ног
      - text: Желудку и кишечнику
      - text: Сердцу и мозгу
        correct: true
    explanation: Сначала организм пытается помочь себе сам — сосуды сужаются, пульс учащается, и кровь направляется прежде всего к сердцу и мозгу.
    cite: [5]
  - level: patient
    prompt: Что, по статье, главное в лечении кардиогенного шока?
    options:
      - text: Устранить его причину
        correct: true
      - text: Подождать, пока он пройдёт сам
      - text: Постепенно снизить вес за несколько месяцев
    explanation: Главное в лечении — устранить причину шока.
    cite: [7]
  - level: patient
    prompt: У человека боль в груди или болезнь сердца. При каком признаке статья велит вызвать скорую?
    options:
      - text: На ногтях появились мелкие белые точки
      - text: Вялость, сонливость или спутанность сознания
        correct: true
      - text: Волосы после стрижки стали отрастать немного быстрее, чем обычно
    explanation: Скорую вызывают, если у человека с болью в груди или известной болезнью сердца появились вялость, сонливость или спутанность сознания, холодная потная, бледная или синеватая кожа, слабый частый пульс, частое дыхание, он не может сесть без головокружения или обморока или почти перестал мочиться.
    cite: [1, 7]
  - level: student
    prompt: Что, по MSD, происходит с клетками, когда доставка кислорода при шоке недостаточна?
    options:
      - text: Переходят на анаэробный обмен, и растёт лактат
        correct: true
      - text: Ускоряют деление и заметно быстрее обновляются в тканях
      - text: Накапливают гликоген и жиры на будущее
    explanation: Когда доставка кислорода недостаточна, клетки переходят на анаэробный обмен и растёт лактат; если шок продолжается, повреждение клеток становится необратимым.
    cite: [5]
  - level: student
    prompt: Кому ESC 2026 рекомендует поручить выбор временной механической поддержки кровообращения?
    options:
      - text: Родственникам пациента по их желанию
      - text: Дежурному администратору приёмного отделения
      - text: Мультидисциплинарной «шоковой команде»
        correct: true
    explanation: Для выбора временной механической поддержки кровообращения ESC 2026 рекомендует мультидисциплинарную «шоковую команду» (I C).
    cite: [3]
