questions:
  - level: patient
    prompt: Какая самая частая причина аортального стеноза у взрослых?
    options:
      - text: Отверстие в перегородке между предсердиями
      - text: Отложение кальция на створках клапана
        correct: true
      - text: Высокое давление в сосудах лёгких
    explanation: У взрослых самая частая причина — отложение кальция на створках клапана. Это бывает и с обычным клапаном из трёх створок, и с врождённым клапаном из двух створок.
    cite: [3]
  - level: patient
    prompt: Какой самый частый первый признак аортального стеноза?
    options:
      - text: Сыпь на коже
      - text: Насморк
      - text: Одышка при нагрузке или то, что нагрузки стали переноситься хуже
        correct: true
    explanation: Самый частый первый признак — одышка при нагрузке или то, что нагрузки стали переноситься хуже.
    cite: [2]
  - level: patient
    prompt: Какой основной способ лечения тяжёлого аортального стеноза?
    options:
      - text: Замена клапана
        correct: true
      - text: Пересадка сердца
      - text: Установка кардиостимулятора
    explanation: Основной способ лечения тяжёлого аортального стеноза — замена клапана. Её делают либо открытой операцией на сердце, либо через сосуд с помощью катетера (TAVI).
    cite: [2, 3, 4]
  - level: patient
    prompt: У человека с аортальным стенозом случился обморок. Что делать?
    options:
      - text: Подождать планового визита к кардиологу
      - text: Вызвать скорую помощь по номеру 103 или 112
        correct: true
      - text: Ничего, при аортальном стенозе обмороки неопасны
    explanation: Аортальный стеноз может резко декомпенсироваться, вплоть до кардиогенного шока. Если случился обморок, появилась сильная боль в груди или внезапная тяжёлая одышка, вызывайте скорую помощь по номеру 103 или 112.
    cite: [1, 2]
  - level: student
    prompt: Что означает стадия C аортального стеноза в рекомендациях ACC/AHA?
    options:
      - text: Прогрессирующий стеноз
      - text: Тяжёлый стеноз с симптомами
      - text: Тяжёлый стеноз без симптомов
        correct: true
    explanation: 'Стадии ACC/AHA: A — риск стеноза, B — прогрессирующий стеноз, C — тяжёлый стеноз без симптомов, D — тяжёлый стеноз с симптомами.'
    cite: [2]
  - level: student
    prompt: Какая пиковая скорость на аортальном клапане говорит о тяжёлом стенозе с высоким градиентом по ACC/AHA?
    options:
      - text: 4 м/с и больше
        correct: true
      - text: 2 м/с и больше
    explanation: Тяжёлый стеноз с высоким градиентом по ACC/AHA — пиковая скорость на аортальном клапане ≥4 м/с или средний градиент ≥40 мм рт. ст.
    cite: [2]
