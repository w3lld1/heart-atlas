questions:
  - level: patient
    prompt: Какой желудочек при этом пороке качает кровь в аорту и ко всему телу?
    options:
      - text: Морфологически левый желудочек
      - text: Морфологически правый желудочек
        correct: true
      - text: Оба желудочка по очереди, через удар
    explanation: Кровь в аорту и ко всему телу качает морфологически правый желудочек, а левый работает на лёгкие.
    cite: [1]
  - level: patient
    prompt: Почему кровообращение при этом пороке называют «корригированным»?
    options:
      - text: Его исправляют операцией в первые часы жизни
      - text: Сердце устроено так же, как у здоровых людей
      - text: Две «ошибки» компенсируют друг друга
        correct: true
    explanation: 'Две «ошибки» компенсируют друг друга, поэтому кровь идёт в правильном направлении: в лёгкие поступает венозная кровь, а к органам — артериальная. Поэтому кровообращение и называют «корригированным», то есть исправленным.'
    cite: [1, 3]
  - level: patient
    prompt: Какое исследование главное для диагноза?
    options:
      - text: УЗИ сердца (эхокардиография)
        correct: true
      - text: Анализ мочи на сахар
      - text: Измерение роста, веса и окружности головы
    explanation: 'Главное исследование — УЗИ сердца, эхокардиография: она показывает, что желудочки поменялись местами, и находит сопутствующие пороки.'
    cite: [2, 3]
  - level: patient
    prompt: Почему при этом пороке часто бывают нарушения проводимости (АВ-блокада)?
    options:
      - text: Нехватка витаминов в питании
      - text: Проводящая система сердца расположена необычно
        correct: true
      - text: У сердца при этом пороке нет клапанов
    explanation: Проводящая система сердца — АВ-узел и пучок Гиса — при этом пороке расположена необычно, поэтому часто бывают нарушения проводимости — АВ-блокада.
    cite: [1, 2]
  - level: student
    prompt: Чем объясняют громкий II тон у основания сердца слева от грудины при КТМС?
    options:
      - text: Передним и левым положением аорты
        correct: true
      - text: Задним и правым положением аорты
      - text: Сращением аорты и лёгочной артерии в общий ствол
    explanation: Громкий II тон у основания сердца слева от грудины объясняется передним и левым положением аорты; его можно ошибочно принять за признак высокой лёгочной гипертензии.
    cite: [1, 3]
  - level: student
    prompt: Какой АВ-клапан ведёт в системный желудочек при КТМС?
    options:
      - text: Митральный клапан
      - text: Трёхстворчатый клапан
        correct: true
    explanation: АВ-клапан системного (морфологически правого) желудочка морфологически трёхстворчатый и называется системным (артериальным) АВ-клапаном; клапан венозного желудочка — митральный.
    cite: [1]
