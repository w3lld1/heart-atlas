questions:
  - level: patient
    prompt: Что вызывает симптомы при двойной дуге аорты?
    options:
      - text: Недостаток крови в нижней половине тела
      - text: Сдавление трахеи и пищевода
        correct: true
      - text: Сужение клапана, через который кровь выходит из сердца
    explanation: Симптомы вызывает сдавление трахеи и пищевода, и от его силы зависят время появления симптомов и прогноз.
    cite: [1]
  - level: patient
    prompt: Какое исследование после рождения показывает тип двойной дуги и размеры обеих дуг?
    options:
      - text: Анализ мочи
      - text: Измерение температуры
      - text: УЗИ сердца
        correct: true
    explanation: После рождения делают УЗИ сердца (эхокардиографию) — оно показывает тип двойной дуги, места сужений и размеры обеих дуг.
    cite: [1]
  - level: patient
    prompt: Каким способом можно устранить сосудистое кольцо?
    options:
      - text: Операцией
        correct: true
      - text: Специальной диетой
      - text: Курсом дыхательной гимнастики
    explanation: Устранить кольцо можно только операцией. Она может быть открытой или торакоскопической; какой способ выбрать, решают врачи.
    cite: [1]
  - level: patient
    prompt: При каком признаке у ребёнка с двойной дугой аорты нужно вызывать скорую?
    options:
      - text: Ребёнок зевнул перед дневным сном
      - text: У ребёнка случаются остановки дыхания
        correct: true
      - text: У малыша ненадолго появилась икота после еды
    explanation: Вызывайте скорую, если у ребёнка случаются остановки дыхания, сильная синюшность, потеря сознания или очень шумное, тяжёлое дыхание с втяжением кожи под рёбрами.
    cite: [1]
  - level: student
    prompt: На какие группы делят сосудистые кольца аорты по Международной номенклатуре?
    options:
      - text: На артериальные и венозные
      - text: На врождённые и приобретённые формы
      - text: На полные и неполные («петли»)
        correct: true
    explanation: По Международной номенклатуре, которую приводят рекомендации Минздрава, сосудистые кольца аорты делят на полные и неполные («петли»).
    cite: [1]
  - level: student
    prompt: Какой бывает ЭКГ при двойной дуге аорты без сопутствующих пороков?
    options:
      - text: В пределах нормы
        correct: true
      - text: С признаками перегрузки левого желудочка
      - text: С выраженной синусовой тахикардией
    explanation: ЭКГ при двойной дуге в пределах нормы, если нет сопутствующих пороков.
    cite: [1]
