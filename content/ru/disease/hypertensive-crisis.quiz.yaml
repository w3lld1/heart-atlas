questions:
  - level: patient
    prompt: Что, по российским рекомендациям, отличает гипертонический криз от очень высокого давления?
    options:
      - text: Возраст человека старше пятидесяти
      - text: Острое поражение органов-мишеней
        correct: true
      - text: Время суток, когда измерили давление
    explanation: Гипертонический криз — значительное повышение давления с острым поражением органов-мишеней. Очень высокое давление без поражения органов российские рекомендации кризом не называют.
    cite: [1]
  - level: patient
    prompt: Какие органы прежде всего страдают при гипертоническом кризе?
    options:
      - text: Суставы, связки, мышцы и крупные кости скелета
      - text: Кожа, волосы, ногти и потовые железы
      - text: Мозг, сердце и сосуды, почки, сетчатка
        correct: true
    explanation: При гипертоническом кризе страдают прежде всего мозг, сердце и сосуды, почки, а также сетчатка глаза.
    cite: [3, 4]
  - level: patient
    prompt: Где лечат гипертонический криз с поражением органов?
    options:
      - text: В больнице, обычно в интенсивной терапии
        correct: true
      - text: В санатории, на курсе лечебных ванн и массажа
      - text: В стоматологической клинике
    explanation: Криз с поражением органов лечат в больнице, обычно в отделении интенсивной терапии.
    cite: [3, 4]
  - level: patient
    prompt: При каком признаке на фоне высокого давления нужно сразу звонить 103 или 112?
    options:
      - text: Захотелось пить после прогулки
      - text: Зачесался комариный укус на руке
      - text: Появилась боль в груди
        correct: true
    explanation: Звоните 103 или 112, если на фоне высокого давления появились боль в груди или сильная одышка, спутанность сознания, судороги, внезапная потеря зрения, слабость или онемение одной половины тела.
    cite: [1, 2, 3]
  - level: student
    prompt: Как в англоязычной литературе называют тяжёлый острый подъём АД без острого ПОМ?
    options:
      - text: Hypertensive emergency
      - text: Hypertensive urgency
        correct: true
      - text: Hypertensive encephalopathy
    explanation: Hypertensive crisis — общее название тяжёлого острого подъёма АД. С острым ПОМ это hypertensive emergency, без него — hypertensive urgency.
    cite: [4]
  - level: student
    prompt: На что, по MSD, указывает очаговая неврологическая симптоматика при ясном сознании?
    options:
      - text: На инсульт
        correct: true
      - text: На энцефалопатию
      - text: На поражение почек
    explanation: Общемозговые нарушения (спутанность, оглушение, кома) указывают на энцефалопатию, а очаговая симптоматика при ясном сознании — на инсульт.
    cite: [3]
