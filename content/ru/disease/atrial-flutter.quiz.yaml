questions:
  - level: patient
    prompt: Чем электрическая активность предсердий при трепетании отличается от фибрилляции?
    options:
      - text: При трепетании она хаотическая, а при фибрилляции согласованная
      - text: При трепетании она согласованная, а при фибрилляции хаотическая
        correct: true
      - text: При трепетании электрической активности в предсердиях нет совсем
    explanation: При фибрилляции электрическая активность предсердий хаотическая, а при трепетании — согласованная.
    cite: [1, 5]
  - level: patient
    prompt: На что при типичной форме трепетания похожи волны трепетания на ЭКГ?
    options:
      - text: На зубья пилы
        correct: true
      - text: На ровную прямую линию без волн
      - text: На редкие одиночные всплески раз в несколько секунд
    explanation: На ЭКГ видны частые одинаковые волны трепетания, которые при типичной форме похожи на зубья пилы.
    cite: [1, 4]
  - level: patient
    prompt: Какой способ статья называет самым эффективным, чтобы удержать нормальный ритм при трепетании?
    options:
      - text: Пересадка сердца
      - text: Установка искусственного клапана
      - text: Катетерная аблация
        correct: true
    explanation: Аблация — самый эффективный способ удержать нормальный ритм, и трепетание после неё возвращается редко, но со временем может появиться фибрилляция предсердий.
    cite: [2]
  - level: patient
    prompt: С какими признаками сердцебиение — повод звонить 103 или 112?
    options:
      - text: С заложенностью носа без температуры
      - text: С болью или дискомфортом в груди, сильной одышкой или обмороком
        correct: true
      - text: С зудом кожи после душа
    explanation: Звоните 103 или 112, если сердцебиение сопровождается болью или дискомфортом в груди, сильной одышкой, обмороком или ощущением, что вот-вот потеряете сознание.
    cite: [1, 4, 5]
  - level: student
    prompt: Через какую структуру обязательно проходит волна macro re-entry при типичном ТП?
    options:
      - text: Через коронарный синус
      - text: Через пучок Бахмана
      - text: Через кавотрикуспидальный истмус
        correct: true
    explanation: При типичном ТП (тип I) волна macro re-entry распространяется вокруг трёхстворчатого клапана и обязательно проходит через кавотрикуспидальный истмус (КТИ).
    cite: [1]
  - level: student
    prompt: Какие зубцы F на ЭКГ характерны для ТП против часовой стрелки?
    options:
      - text: Отрицательные в нижних отведениях и положительные в V1
        correct: true
      - text: Положительные в нижних отведениях и отрицательные в V1
      - text: Зубцы F не видны ни в одном отведении
    explanation: При ТП против часовой стрелки зубцы F отрицательные в нижних отведениях и положительные в V1.
    cite: [2]
