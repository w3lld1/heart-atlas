questions:
  - level: patient
    prompt: When does the accessory pathway in WPW form?
    options:
      - text: In old age
      - text: Before birth
        correct: true
      - text: After a cold
    explanation: 'The accessory pathway forms before birth: normally the muscle of the atria and the ventricles becomes completely separated, but here the separation stays incomplete.'
    cite: [1, 2]
  - level: patient
    prompt: What is the main sign of WPW syndrome?
    options:
      - text: Episodes of a fast, regular heartbeat that start and stop suddenly
        correct: true
      - text: A constantly slow pulse
      - text: Joint pain
    explanation: The main sign is episodes of a fast, regular heartbeat that start suddenly and stop suddenly.
    cite: [3]
  - level: patient
    prompt: What is the main test for WPW?
    options:
      - text: A urine test
      - text: Gastroscopy
      - text: An ECG, which shows pre-excitation even between episodes
        correct: true
    explanation: 'The main test is an ECG: the signs of pre-excitation show on it even between episodes.'
    cite: [2, 3]
  - level: patient
    prompt: What is done during catheter ablation for WPW?
    options:
      - text: A heart valve is replaced with a prosthesis
      - text: A catheter is passed through a blood vessel to the heart and the accessory pathway is targeted
        correct: true
    explanation: 'To get rid of episodes in the long term, catheter ablation is used: a catheter is passed through a blood vessel to the heart and the accessory pathway is targeted precisely.'
    cite: [1, 3]
  - level: student
    prompt: Which arrhythmia is life-threatening in manifest WPW syndrome?
    options:
      - text: Atrial fibrillation or atrial flutter
        correct: true
      - text: Sinus bradycardia
    explanation: 'The life-threatening arrhythmia in manifest WPW syndrome is AF or atrial flutter: if the AP has a short antegrade refractory period, rapid conduction to the ventricles can lead to ventricular fibrillation.'
    cite: [1, 2]
  - level: student
    prompt: Which resting ECG is typical of a manifest AP?
    options:
      - text: A long PR interval without a delta wave and a narrow QRS
      - text: A short PR interval, a delta wave at the start of QRS and a wide QRS
        correct: true
    explanation: The typical resting ECG of a manifest AP shows a short PR interval (under 120 ms), a delta wave in the initial part of the QRS complex and a wide QRS (over 120 ms).
    cite: [1, 2]
