questions:
  - level: patient
    prompt: How many features make up tetralogy of Fallot?
    options:
      - text: Two
      - text: Four
        correct: true
      - text: Six
    explanation: Tetralogy of Fallot is a congenital heart defect made up of four features.
    cite: [1, 2, 3]
  - level: patient
    prompt: In tetralogy of Fallot, why do the child's lips and skin usually turn blue?
    options:
      - text: The blood going to the body does not carry enough oxygen
        correct: true
      - text: Too much blood reaches the lungs
    explanation: It is a "blue" (cyanotic) defect — usually the child's lips and skin turn blue, because the blood going to the body does not carry enough oxygen.
    cite: [1]
  - level: patient
    prompt: Some children squat during play. What happens to the oxygen in their blood in this position?
    options:
      - text: The blood carries less oxygen
      - text: It does not change
      - text: The blood carries more oxygen
        correct: true
    explanation: A typical sign is that some children squat during play; in this position the blood carries more oxygen.
    cite: [1, 3]
  - level: patient
    prompt: Is follow-up with a cardiologist needed after surgery?
    options:
      - text: No, follow-up is not needed after surgery
      - text: Yes, for life
        correct: true
      - text: Only in the first year after surgery
    explanation: After surgery, lifelong follow-up with a cardiologist is needed — with a paediatric cardiologist until 18, then with an adult cardiologist.
    cite: [1]
  - level: student
    prompt: What causes the harsh systolic murmur at the left sternal border in tetralogy of Fallot?
    options:
      - text: Flow across the VSD
      - text: Flow across the pulmonary stenosis
        correct: true
    explanation: A harsh systolic murmur is heard at the left sternal border, caused by flow across the pulmonary stenosis; the VSD is usually silent because it is large and has no pressure gradient.
    cite: [1, 3]
  - level: student
    prompt: What does the chest X-ray show in tetralogy of Fallot?
    options:
      - text: Reduced pulmonary vascular markings and a boot-shaped heart
        correct: true
      - text: Increased pulmonary vascular markings and a normally shaped heart
    explanation: The chest X-ray shows reduced pulmonary vascular markings and a boot-shaped heart.
    cite: [1, 3]
