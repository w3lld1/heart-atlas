questions:
  - level: patient
    prompt: What is a ventricular septal defect?
    options:
      - text: Inflammation of the heart muscle
      - text: A congenital hole in the wall between the right and left ventricles
        correct: true
      - text: A blood clot in the pulmonary artery
    explanation: A VSD is a congenital heart defect in which there is a hole in the wall (septum) between the right and left ventricles.
    cite: [1]
  - level: patient
    prompt: Which way does blood flow through the hole in a VSD?
    options:
      - text: From the left ventricle into the right
        correct: true
      - text: From the pulmonary artery into the aorta
      - text: No blood passes through the hole
    explanation: Blood flows through the hole from the left ventricle into the right, so the lung blood vessels receive extra blood and the left ventricle is overloaded.
    cite: [1]
  - level: patient
    prompt: What often happens to small ventricular septal defects?
    options:
      - text: They always grow quickly
      - text: They always need urgent surgery
      - text: They often close on their own
        correct: true
    explanation: Small defects often close on their own.
    cite: [1, 3]
  - level: patient
    prompt: What is the key test for diagnosing a VSD?
    options:
      - text: Measuring body temperature
      - text: A urine test
      - text: An ultrasound scan of the heart (echocardiogram) with Doppler
        correct: true
    explanation: The key test is an ultrasound scan of the heart (echocardiogram) with Doppler.
    cite: [1, 3]
  - level: student
    prompt: Except in the end stage, which shunt is characteristic of a VSD?
    options:
      - text: Right-to-left
      - text: Left-to-right
        correct: true
      - text: There is no shunt through the defect
    explanation: Except in the end stage, VSD is characterised by a left-to-right shunt from the LV to the RV.
    cite: [1]
  - level: student
    prompt: Which of these are features of Eisenmenger syndrome?
    options:
      - text: Normal pulmonary artery pressure and a left-to-right shunt
      - text: Severe pulmonary hypertension and a right-to-left shunt through the defect
        correct: true
      - text: Spontaneous closure of the defect
    explanation: Severe pulmonary hypertension and a right-to-left shunt through the defect are features of Eisenmenger syndrome.
    cite: [1, 3]
