questions:
  - level: patient
    prompt: Which vessels does the ductus arteriosus connect?
    options:
      - text: The superior and inferior venae cavae
      - text: The two coronary arteries
      - text: The aorta and the pulmonary artery
        correct: true
    explanation: The duct usually leaves the arch of the aorta opposite the left subclavian artery and joins the pulmonary artery where the left pulmonary artery begins.
    cite: [1, 2]
  - level: patient
    prompt: In which babies does the duct most often stay open?
    options:
      - text: In babies born prematurely
        correct: true
      - text: In babies with a high birth weight
    explanation: 'The duct most often stays open in babies born prematurely: the lower the birth weight, the more often this happens.'
    cite: [1, 3]
  - level: patient
    prompt: What is the key test for a patent ductus arteriosus?
    options:
      - text: A urine test
      - text: An ultrasound scan of the heart (echocardiogram) with Doppler
        correct: true
      - text: An MRI scan of the brain
    explanation: 'The key test is an ultrasound scan of the heart (echocardiogram) with Doppler: it shows the duct itself and the blood flowing through it.'
    cite: [1, 3]
  - level: patient
    prompt: What develops over time if a large duct is not closed?
    options:
      - text: Pulmonary hypertension and Eisenmenger syndrome
        correct: true
      - text: Nothing, a large duct is harmless
    explanation: If a large duct is not closed, pulmonary hypertension and Eisenmenger syndrome, irreversible damage to the blood vessels of the lungs, develop over time.
    cite: [1, 3]
  - level: student
    prompt: Which murmur is characteristic of PDA?
    options:
      - text: A short systolic murmur at the cardiac apex
      - text: A continuous systolic-diastolic murmur, 2nd–3rd left intercostal space
        correct: true
    explanation: The characteristic signs are a continuous systolic-diastolic murmur in the 2nd–3rd intercostal space to the left of the sternum and a reduced diastolic blood pressure.
    cite: [1]
  - level: student
    prompt: Is cardiac catheterisation needed to diagnose PDA?
    options:
      - text: Yes, in everyone, to confirm the diagnosis
      - text: Usually not; it is done when there are signs of raised PA pressure
        correct: true
    explanation: Cardiac catheterisation is usually not needed for the diagnosis; it is done when there are signs of raised PA pressure, to determine pulmonary vascular resistance and whether the duct can be closed.
    cite: [1, 2, 3]
