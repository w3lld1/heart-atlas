questions:
  - level: patient
    prompt: What is an interrupted aortic arch?
    options:
      - text: The aortic valve has been narrowed since birth
      - text: A segment of the aorta is missing or has no lumen
        correct: true
      - text: There is a hole in the wall between the two upper heart chambers
    explanation: An interrupted aortic arch is a rare congenital heart defect in which a segment of the aorta between its ascending and descending parts is missing or has no lumen.
    cite: [1]
  - level: patient
    prompt: With this defect, how does blood reach the lower half of the body?
    options:
      - text: Through the coronary arteries that supply the heart
      - text: Through the veins that carry blood back to the heart
      - text: Only through the open ductus arteriosus
        correct: true
    explanation: Blood reaches the descending aorta, and so the lower half of the body, only through the open ductus arteriosus.
    cite: [1]
  - level: patient
    prompt: What is the only way to correct this defect?
    options:
      - text: Surgery
        correct: true
      - text: Heart failure medicines
      - text: Rest and a special diet
    explanation: The only way to correct the defect is surgery. Heart failure medicines are only a "bridge" to the operation and do not replace it.
    cite: [1]
  - level: patient
    prompt: When should you call an ambulance for a newborn?
    options:
      - text: The baby sneezed once in the morning
      - text: The baby yawned before falling asleep
      - text: "The baby's lips or skin turned blue"
        correct: true
    explanation: Call your local emergency number if a newborn's lips or skin turn pale or blue, the hands and feet become cold, the baby becomes floppy and responds poorly, or breathes with difficulty or struggles for breath during feeds.
    cite: [1, 3, 4]
  - level: student
    prompt: In the Celoria–Patton classification, where is the interruption in type B?
    options:
      - text: Between the subclavian and carotid arteries
        correct: true
      - text: Further along, beyond the left subclavian artery
      - text: Between the two carotid arteries
    explanation: Type A is an interruption distal to the left subclavian artery; type B, between the subclavian and carotid arteries; type C, between the carotid arteries.
    cite: [1]
  - level: student
    prompt: What happens to the shunt as pulmonary vascular resistance falls naturally?
    options:
      - text: The shunt shrinks and disappears
      - text: The shunt volume grows
        correct: true
      - text: The shunt reverses to right-to-left
    explanation: As pulmonary vascular resistance falls naturally, the shunt volume grows, and organ hypoperfusion, heart failure and lactic acidosis increase; they worsen when the PDA closes.
    cite: [1]
