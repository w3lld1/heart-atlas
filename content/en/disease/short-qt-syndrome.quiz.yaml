questions:
  - level: patient
    prompt: According to the article, what causes this syndrome?
    options:
      - text: Cholesterol deposits in the walls of the heart's coronary arteries
      - text: Changes in genes for the ion channels of heart cells
        correct: true
      - text: Inflammation of the heart valves after a past sore throat
    explanation: The cause is changes (mutations) in genes for the ion channels of heart cells.
    cite: [1, 3]
  - level: patient
    prompt: Together with Brugada syndrome, which group of diseases is this syndrome part of?
    options:
      - text: The channelopathies
        correct: true
      - text: Cardiomyopathies with a thickened heart wall
      - text: Congenital heart valve defects
    explanation: Together with Brugada syndrome and catecholaminergic polymorphic ventricular tachycardia, this syndrome is one of the channelopathies, diseases in which arrhythmias arise without obvious structural heart disease.
    cite: [1, 5]
  - level: patient
    prompt: According to the article, what is the main test for this syndrome?
    options:
      - text: A blood sugar test
      - text: A standard chest X-ray image
      - text: An ordinary 12-lead ECG
        correct: true
    explanation: The main test is an ordinary 12-lead ECG.
    cite: [1, 3]
  - level: patient
    prompt: According to the article, which situation may mean cardiac arrest?
    options:
      - text: Someone sneezes a lot and complains of a blocked nose without fever
      - text: Someone suddenly collapses, does not respond and is not breathing
        correct: true
      - text: Someone complains of tired legs after a long walk in the park
    explanation: If someone suddenly collapses, does not respond and is not breathing or is only gasping, this may be cardiac arrest.
    cite: [6]
  - level: student
    prompt: According to MSD, where does the action potential shorten most in this syndrome?
    options:
      - text: In the atrioventricular (AV) node
      - text: In the Purkinje fibres
      - text: In the ventricular epicardium
        correct: true
    explanation: According to MSD, the action potential shortens most in the ventricular epicardium; the resulting transmural dispersion of repolarisation may lead to polymorphic VT or VF.
    cite: [3]
  - level: student
    prompt: According to the Russian guideline, by what mechanism do life-threatening arrhythmias arise in this syndrome?
    options:
      - text: Re-entry
        correct: true
      - text: Complete conduction block in the AV node
      - text: Myocardial ischaemia from narrowed arteries
    explanation: Shortening of the action potential and effective refractory period of atrial and ventricular cardiomyocytes sets the stage for life-threatening re-entrant arrhythmias.
    cite: [1]
