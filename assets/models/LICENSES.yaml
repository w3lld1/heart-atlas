  changes: >-
    Selected heart and great-vessel elements listed in heart/structures.yaml, merged them into one
    mesh per structure, renamed them to project ids, converted millimetres to metres and Z-up to
    Y-up, centred the model, and added a schematic conduction system from heart/conduction.yaml.
  notes: >-
    Conduction system placement follows Anderson RH, Yanni J, Boyett MR, Chandler NJ,
    Dobrzynski H. The anatomy of the cardiac conduction system. Clin Anat. 2009;22:99-113.
    doi:10.1002/ca.20700

