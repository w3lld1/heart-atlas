# Layers of the tetralogy of Fallot model (3DPX-016151). Each congenital model is one patient's
# segmentation, so it has layers instead of named chambers. Ids are a public contract, as in
# heart/structures.yaml, and the model must contain a node with each id.

- id: myocardium
  kind: mesh
  group: layer
- id: blood-pool
  kind: mesh
  group: layer
