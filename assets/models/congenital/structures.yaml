# Structures of the congenital heart models. Each model is one patient's segmentation, so it has
# two layers instead of named chambers. Ids are a public contract, as in heart/structures.yaml, and
# every congenital model must contain a node with each id.

- id: myocardium
  kind: mesh
  group: layer
- id: blood-pool
  kind: mesh
  group: layer
