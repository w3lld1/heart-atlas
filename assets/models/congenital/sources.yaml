# Source files of the congenital heart models. packages/models/src/congenital.ts checks the hashes,
# prepares the model and writes assets/models/congenital/<id>.glb. The sources are too large for the
# repository (up to 200 MB); download them from file_url. Spec: docs/plans/2026-10-12-congenital-models.md.
# Each model's layers are listed in congenital/<id>.structures.yaml.
# axes: gltf (ours: Y up, +X to the patient's left, +Z anterior) or lps (scanner: +Y posterior, +Z up).
# scale: factor from source units to metres; models are zoomed to about 0.2 m to fill the viewer.
# section: how the viewer and the poster open the model (frontal: cut, for defects inside the heart).
# keep: share of triangles the simplifier aims to keep in that mesh.
tetralogy-of-fallot:
  entry: https://3d.nih.gov/entries/3DPX-016151/3
  files:
    - file: CM0070 myo, bp, lung.glb
      file_url: https://3d.nih.gov/api/files/1034581
      sha256: cfce90ed18d86855a890215d12f54d36ad01a253649bd52cd27291c961663e33
  axes: gltf
  scale: 1
  section: frontal
  center_on: myocardium
  meshes:
    - { node: Myo, id: myocardium, keep: 0.15 }
    - { node: BP, id: blood-pool, keep: 0.2 }
    # Lungs are left out: their segmentation is full of vessel spikes that hide the heart when cut.
transposition-of-the-great-arteries:
  entry: https://3d.nih.gov/entries/3DPX-007810/3
  files:
    - file: CM0054_MB_bp_vessel_systemic.stl
      file_url: https://3d.nih.gov/api/files/967989
      sha256: 1260b65d37dc6fb20388dbf56833af326e9d63e3da38b471949879d51ddcf20e
    - file: CM0054_MB_bp_vessel_pulmonary.stl
      file_url: https://3d.nih.gov/api/files/967988
      sha256: 5d4d47702140a46c53bee95e24d3d5510bcc1000d9d28ef8fa1d3626312de6b0
  axes: lps
  # Millimetres; a newborn's heart, about 70 mm with its vessels, shown 2.5 times larger.
  scale: 0.0025
  # The defect is in how the great arteries leave the ventricles, which shows from outside.
  section: none
  center_on: systemic-circulation
  meshes:
    - { node: CM0054_MB_bp_vessel_systemic.stl, id: systemic-circulation, keep: 0.6 }
    - { node: CM0054_MB_bp_vessel_pulmonary.stl, id: pulmonary-circulation, keep: 0.6 }
