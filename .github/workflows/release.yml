name: Release

# Run from the Actions tab on main after the version bump and its CHANGELOG section are merged.
# Tags v<version> from the root package.json on the current commit and publishes a GitHub
# Release whose notes are that version's CHANGELOG section.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::run this workflow on main"; exit 1
      - uses: actions/checkout@v5
      - name: Read version and notes
        id: notes
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$version' is not semver"; exit 1
          fi
          # The section runs from "## [<version>] - <date>" to the next "## " heading or link list.
          awk -v v="$version" '
            index($0, "## [" v "] - ") == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no dated section for $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          # An existing tag would make gh reuse it and ignore --target.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Heart Atlas $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
