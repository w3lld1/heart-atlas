name: Release

# Tags v<version> from the root package.json on the current commit of main and publishes a GitHub
# Release whose notes are that version's CHANGELOG section. Runs by itself when a push to main
# changes package.json and its version has no tag yet (merging a version bump releases it), or
# from the Actions tab.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::run this workflow on main"; exit 1
      - uses: actions/checkout@v5
      - name: Read the version and notes
        id: version
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$version' is not semver"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # An existing tag would make gh reuse it and ignore --target. A push that changed
          # package.json without a new version (a dependency, a script) is not a release.
          # ls-remote exits 2 when the tag is missing; anything else is a real error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          if [ "$status" = 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "v$version is already released; nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::tag v$version already exists"; exit 1
          elif [ "$status" != 2 ]; then
            echo "::error::could not list tags (git ls-remote exit $status)"; exit 1
          fi
          scripts/changelog-section.sh > "$RUNNER_TEMP/notes.md"
      - name: Create the tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Heart Atlas $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
