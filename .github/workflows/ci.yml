name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://w3lld1.github.io
  BASE_PATH: /heart-atlas

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm i18n:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
      # JS an article page can load, gzip, against the stage 4 budget.
      - run: pnpm --filter @heart-atlas/web js-budget
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '' is the production build; '1' adds the right-to-left test locale.
        test-locales: ['', '1']
    name: e2e${{ matrix.test-locales == '1' && ' (test locales)' || '' }}
    env:
      HA_TEST_LOCALES: ${{ matrix.test-locales }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @heart-atlas/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      # Article pages are checked on fictional test articles until real ones exist.
      - run: pnpm --filter @heart-atlas/web build:test-content
      - run: pnpm e2e
        env:
          HA_TEST_CONTENT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report${{ matrix.test-locales == '1' && '-test-locales' || '' }}
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Uses the Chrome preinstalled on the runner. The server is `astro preview`
      # (see lighthouserc.json), so assets under BASE_PATH resolve as on Pages.
      - run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 7
